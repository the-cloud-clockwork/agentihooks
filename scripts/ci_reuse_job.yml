runs-on: ubuntu-latest
timeout-minutes: 5
outputs:
  reused: ${{ steps.decision.outputs.reused || 'false' }}
  run: ${{ steps.decision.outputs.run }}
  attempt: ${{ steps.decision.outputs.attempt }}
  grader: ${{ steps.grader.outputs.sha }}
steps:
  - uses: actions/checkout@v4
    with:
      ref: dev
      fetch-depth: 0
      persist-credentials: false

  - name: Record the protected grader revision
    id: grader
    run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  - uses: actions/setup-python@v5
    if: hashFiles('scripts/ci_reuse.py') != ''
    with:
      python-version: "3.12"

  - name: Install metadata dependencies
    if: hashFiles('scripts/ci_reuse.py') != ''
    run: python -m pip install "pyyaml>=6.0"

  - name: Mint the tcc main ci App token
    id: app-token
    if: github.event_name == 'merge_group' && hashFiles('scripts/ci_reuse.py') != ''
    uses: actions/create-github-app-token@v3.2.0
    with:
      client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
      private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
      repositories: ${{ github.event.repository.name }}
      permission-actions: read
      permission-contents: read

  - name: Fetch the evidence of recent passed runs
    if: github.event_name == 'merge_group' && hashFiles('scripts/ci_reuse.py') != ''
    env:
      GH_TOKEN: ${{ steps.app-token.outputs.token }}
      QUEUE_REF: ${{ github.event.merge_group.head_ref }}
    run: |
      [[ "$QUEUE_REF" =~ ^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$ ]] || exit 0
      pull="${BASH_REMATCH[1]}"
      evidence="$RUNNER_TEMP/evidence"
      actions="repos/$GITHUB_REPOSITORY/actions"
      mkdir -p "$evidence"
      if ! gh api "$actions/workflows/test.yml/runs?event=pull_request&status=success&per_page=20" > "$evidence/runs.json"; then
        rm -f "$evidence/runs.json"
        exit 0
      fi
      fetch() {
        local folder="$evidence/$1" artifact job
        mkdir -p "$folder"
        gh api --paginate "$actions/runs/$1/artifacts?per_page=100" --jq '.artifacts[]' > "$folder/artifacts.jsonl" || { rm -f "$folder/artifacts.jsonl"; return 0; }
        artifact="$(jq -r --arg name "required-tree-$2" 'select(.name == $name and (.expired | not)) | .id' "$folder/artifacts.jsonl" | head -n 1)"
        [[ -n "$artifact" ]] || return 0
        gh api "$actions/artifacts/$artifact/zip" > "$folder/proof.zip" || { rm -f "$folder/proof.zip"; return 0; }
        gh api --paginate "$actions/runs/$1/attempts/$2/jobs?per_page=100" --jq '.jobs[]' > "$folder/jobs.jsonl" || { rm -f "$folder/jobs.jsonl"; return 0; }
        job="$(jq -r 'select(.name == "reuse" and .conclusion == "success") | .id' "$folder/jobs.jsonl" | head -n 1)"
        [[ -n "$job" ]] || return 0
        gh api "$actions/jobs/$job/logs" > "$folder/reuse.log" || rm -f "$folder/reuse.log"
      }
      export -f fetch
      export evidence actions
      jq -r --argjson pull "$pull" '.workflow_runs[] | select(any(.pull_requests[]?; .number == $pull)) | "\(.id) \(.run_attempt)"' "$evidence/runs.json" | xargs -r -n 2 -P 8 bash -c 'fetch "$@"' fetch

  - name: Decide from protected code and record the tested tree
    id: decision
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
      HEAD: ${{ github.sha }}
      EVENT: ${{ github.event_name }}
      RUN: ${{ github.run_id }}
      ATTEMPT: ${{ github.run_attempt }}
    run: |
      if [[ ! -f scripts/ci_reuse.py ]]; then
        echo "reused=false" >> "$GITHUB_OUTPUT"
        exit 0
      fi
      python -I scripts/ci_reuse.py --base "$BASE" --head "$HEAD" --event "$EVENT" \
        --repository "$GITHUB_REPOSITORY" --run "$RUN" --attempt "$ATTEMPT" \
        --evidence "$RUNNER_TEMP/evidence" --record "$RUNNER_TEMP/provenance.json"

  - name: Publish protected tested tree evidence
    if: steps.decision.outputs.recorded == 'true'
    uses: actions/upload-artifact@v4
    with:
      name: required-tree-${{ github.run_attempt }}
      path: ${{ runner.temp }}/provenance.json
      if-no-files-found: error
      retention-days: 7
