- name: Turn off automatic git maintenance
  run: 'echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"

    echo "GIT_CONFIG_KEY_0=maintenance.auto" >> "$GITHUB_ENV"

    echo "GIT_CONFIG_VALUE_0=false" >> "$GITHUB_ENV"

    '
- uses: actions/checkout@v4
  if: needs.mutation.result == 'success'
  with:
    fetch-depth: 0
    ref: ${{ github.event.pull_request.head.sha }}
- name: Download every shard's mutation report
  if: needs.mutation.result == 'success'
  id: download-every-shards-mutation-report
  continue-on-error: true
  uses: actions/download-artifact@v4
  with: &id001
    pattern: mutation-report-*
    path: .mutation-reports
- name: Download every shard's mutation report, wait before attempt 2
  if: steps.download-every-shards-mutation-report.outcome == 'failure'
  shell: bash
  run: 'echo "::warning::Download every shard''s mutation report failed, as an artifact service outage does; retrying it once in 30 seconds."

    sleep 30

    '
- name: Download every shard's mutation report, attempt 2
  if: steps.download-every-shards-mutation-report.outcome == 'failure'
  uses: actions/download-artifact@v4
  with: *id001
- name: Grade the split mutation units from the protected grader
  if: needs.mutation.result == 'success'
  env:
    BASES: ${{ needs.mutation-plan.outputs.bases }}
    GRADER: ${{ github.event.pull_request.base.sha || (inputs.base == 'origin/dev' && 'dev' || inputs.base) }}
    PLANNED: ${{ needs.mutation-plan.outputs.shards }}
  run: 'git fetch --no-tags origin "$GRADER"

    git worktree add --detach "$RUNNER_TEMP/grader" FETCH_HEAD

    grader="$RUNNER_TEMP/grader"

    grep -qs ''add_parser("units")'' "$grader/scripts/ci_mutation/regrade.py" || grader="$GITHUB_WORKSPACE"

    PYTHONPATH="$grader" python -P -m scripts.ci_mutation.regrade units .mutation-reports "$(jq length <<< "$PLANNED")" . "$BASES"

    '
