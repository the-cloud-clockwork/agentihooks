name: Red fixture for the for loop word list gate
on: push
jobs:
  steps-without-a-shell:
    runs-on: ubuntu-latest
    steps:
      - run: for _ in $(seq 3); do sleep 1; done
      - name: A literal block after assignments from GitHub expressions
        run: |
          first=${{ inputs.first }} last=${{ inputs.last }}
          for _ in $(seq "$first" "$last"); do
            sleep 1
          done
      - name: Backticks in a POSIX shell
        shell: sh
        run: |
          for name in `ls`; do
            echo "$name"
          done
      - name: A folded block whose loop follows a comment line
        shell: bash
        run: >
          # wait for the kind nodes
          for node in $(kind get nodes); do
          docker exec "$node" true; done
      - name: A quoted run text names its first line
        run: "echo start\nfor _ in $(seq 2); do :; done"
      - name: A shell chosen by a GitHub expression
        shell: ${{ matrix.shell }}
        run: for _ in $(seq 2); do :; done
      - name: A blank shell runs the default shell
        shell: " "
        run: for _ in $(seq 2); do :; done
  python-by-default:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: python
    steps:
      - name: A bash step named by its path in a python job
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: |
          if true; then for job in $(jobs -p); do wait "$job"; done; fi
  blank-default:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: " "
    steps:
      - run: for _ in $(seq 2); do :; done
