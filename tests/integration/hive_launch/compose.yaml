services:
  redis:
    image: mirror.gcr.io/library/redis:7
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 30
  worker:
    image: local/agentihooks-hive-proof
    build:
      context: ../../..
    command: [python, /proof/agent.py, worker]
    volumes:
      - ./agent.py:/proof/agent.py:ro
    environment:
      AGENTIHOOKS_SWARM_REDIS_URL: redis://redis:6379/0
      AGENTIHOOKS_DEPLOYMENT: local
      AGENTIHOOKS_SERENA: "false"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /proof/agent.py, ready]
      interval: 1s
      timeout: 2s
      retries: 30
  controller:
    image: local/agentihooks-hive-proof
    command: [python, /proof/agent.py, controller]
    volumes:
      - ./agent.py:/proof/agent.py:ro
    environment:
      AGENTIHOOKS_SWARM_REDIS_URL: redis://redis:6379/0
      AGENTIHOOKS_DEPLOYMENT: compose
    depends_on:
      worker:
        condition: service_healthy
