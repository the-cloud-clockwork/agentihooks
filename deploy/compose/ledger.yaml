name: agentihooks-ledger

services:
  ledger:
    image: ghcr.io/the-cloud-clockwork/agentihooks-swarm:dev
    command: [python, "${LEDGER_CODE}/scripts/swarm_ledger/ledger_server.py", --serve]
    working_dir: ${LEDGER_CODE:?set by ledger_server.py --ensure}
    user: ${LEDGER_UID:-1000}:${LEDGER_GID:-1000}
    network_mode: host
    pid: host
    environment:
      HOME: ${HOME}
      PYTHONPATH: ${LEDGER_CODE}
      LEDGER_DIR: ${LEDGER_DIR:?set by ledger_server.py --ensure}
      LEDGER_HOST: 127.0.0.1
      LEDGER_PORT: ${LEDGER_PORT:-8765}
      AGENTIHOOKS_SWARM_DATABASE_URL: ${AGENTIHOOKS_SWARM_DATABASE_URL:-}
      AGENTIHOOKS_SWARM_REDIS_URL: ${AGENTIHOOKS_SWARM_REDIS_URL:-}
      # The certificate and key must sit under a mounted folder, such as ~/.agentihooks.
      LEDGER_TLS_CERT: ${LEDGER_TLS_CERT:-}
      LEDGER_TLS_KEY: ${LEDGER_TLS_KEY:-}
      SWARM_RELOAD: "1"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - ${LEDGER_DIR}:${LEDGER_DIR}
      - ${LEDGER_CODE}:${LEDGER_CODE}:ro
      - ${HOME}/.agentihooks:${HOME}/.agentihooks
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2
    pids_limit: 200
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, scripts.swarm_ledger.ledger_health]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 60s
