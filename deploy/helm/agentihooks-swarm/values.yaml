deployment: distributed

image:
  repository: ghcr.io/the-cloud-clockwork/agentihooks-swarm
  tag: dev
  pullPolicy: Always

hive:
  id: ""

secretEnv: []
envFromSecrets: []
externalSecrets: []

ledger:
  replicas: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: anton.io/capacity-type
                operator: DoesNotExist
  tolerations: []
  port: 8765
  publicUrl: ""
  persistence:
    size: 1Gi
    storageClassName: ""
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

redis:
  enabled: true
  url: ""
  existingSecret:
    name: ""
    key: ""
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

controller:
  # Durable capacity only: EC2 nodes carry anton.io/capacity-type and the autoscaler may remove them.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: anton.io/capacity-type
                operator: DoesNotExist
  tolerations: []
  # Required with workers: the Kubernetes runtime creates worker Pods with this account's token.
  serviceAccountName: ""
  # Worker registration and heartbeat API, served by the controller process for one swarm.
  api:
    enabled: false
    port: 8780
    swarm: ""
    signingKey:
      keyId: ""
      secretName: ""
      secretKey: signing-key
    # Peers beyond the release, such as worker Pods in their own namespace.
    ingressFrom: []
  # Kubernetes runtime settings, rendered once apiUrl is set and read while the API is on. The worker
  # image stays on a floating tag; the controller resolves its digest at each launch. No launch account
  # lives here: approved accounts come from the shared account secret.
  workers:
    apiUrl: ""
    imageTag: dev
    profile: ""
    cap: 1
    projects: []
    brain: ""
    # The Pod policy, docs/swarm-v2/schemas/pod-policy.json; its owner is agentihooks-swarm-<api.swarm>.
    podPolicy: {}
    # Or the name of a ConfigMap in the release namespace holding pod-policy.json, such as one GitOps manages.
    podPolicyConfigMap: ""
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  terminationGracePeriodSeconds: 30
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

worker:
  enabled: false
  replicas: 0
  command: []
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

probe:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 16Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 64Mi

networkPolicy:
  enabled: true
  ingressFrom: []

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []
