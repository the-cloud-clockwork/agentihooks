deployment: distributed

image:
  repository: ghcr.io/the-cloud-clockwork/agentihooks-swarm
  tag: dev
  pullPolicy: Always

hive:
  id: ""
  join:
    enabled: false
    port: 8770
    memberRedisUrl: ""
    tlsSecretName: ""
    redisSecret:
      name: ""
      key: ""
    affinity: {}
    tolerations: []
    ingressFrom: []
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
        ephemeral-storage: 16Mi
      limits:
        memory: 256Mi
        ephemeral-storage: 64Mi

secretEnv: []
envFromSecrets: []
externalSecrets: []

ledger:
  replicas: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: anton.io/capacity-type
                operator: DoesNotExist
  tolerations: []
  port: 8765
  publicUrl: ""
  # Secret with tls.crt, tls.key and ca.crt; clients refuse to send ledger credentials over plain http off loopback.
  # The certificate must name <fullname>-ledger, the service and ingress backend name, as a SAN.
  tls:
    secretName: ""
  persistence:
    size: 1Gi
    storageClassName: ""
  env: {}
  # Secret env only the ledger container reads, such as the shared database URL workers must never hold.
  secretEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

redis:
  enabled: true
  url: ""
  existingSecret:
    name: ""
    key: ""
  # Set all three or none; once set, existingSecret (the administrator credential) reaches no container.
  roles:
    ledger:
      name: ""
      key: ""
    controller:
      name: ""
      key: ""
    worker:
      name: ""
      key: ""
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

controller:
  # Durable capacity only: EC2 nodes carry anton.io/capacity-type and the autoscaler may remove them.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: anton.io/capacity-type
                operator: DoesNotExist
  tolerations: []
  # Required with workers: the Kubernetes runtime creates worker Pods with this account's token.
  serviceAccountName: ""
  # Worker registration and heartbeat API, served by the controller process for one swarm.
  api:
    enabled: false
    port: 8780
    swarm: ""
    signingKey:
      keyId: ""
      secretName: ""
      secretKey: signing-key
    # Peers beside the controller's own Pods, such as worker Pods; networkPolicy.ingressFrom never reaches the API.
    ingressFrom: []
    # {agent, task} of the swarm task proving a launch: the controller creates that proof swarm, and removes it once cleared.
    proof: {}
  # Kubernetes runtime settings, rendered once apiUrl is set and read while the API is on. The worker
  # image stays on a floating tag; the controller resolves its digest at each launch. No launch account
  # lives here: approved accounts come from the shared account secret.
  workers:
    apiUrl: ""
    imageTag: dev
    profile: ""
    cap: 1
    projects: []
    brain: ""
    # The Pod policy, docs/swarm-v2/schemas/pod-policy.json, shared by every swarm; the controller labels its Pods agentihooks-swarm-<api.swarm>.
    podPolicy: {}
    # Or the name of a ConfigMap in the release namespace holding pod-policy.json, such as one GitOps manages.
    podPolicyConfigMap: ""
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 8
    failureThreshold: 3
  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 8
    failureThreshold: 60
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 8
    failureThreshold: 3
  terminationGracePeriodSeconds: 30
  env:
    LANGFUSE_MCP_URL: ""
  # Secret env only the controller container reads, unlike secretEnv; optional: true lets it start before the Secret exists.
  secretEnv: []
  # The terminal user CA private key: only that key of the Secret, a read only file on the controller container.
  # Required with workers.apiUrl; never list it in secretEnv, which every swarm container reads.
  terminalCa:
    secretName: ""
    key: ""
  # SSH jump from the operator's machine to worker terminals: an sshd sidecar in the controller Pod, whose
  # Pods the worker terminal policy already admits. address is the host:port the operator machine dials,
  # recorded in Redis with the jump host key; publish that port with a LoadBalancer outside this chart.
  jump:
    enabled: false
    address: ""
    image:
      repository: ghcr.io/the-cloud-clockwork/agentihooks-worker
      tag: dev
      pullPolicy: Always
    # Peers admitted to the jump port, such as the operator LAN.
    ingressFrom: []
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 16Mi
      limits:
        memory: 128Mi
        ephemeral-storage: 64Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

workers:
  replicas: 0
  maxAgents: 20
  excluded: [master]
  image:
    repository: ghcr.io/the-cloud-clockwork/agentihooks-hive-worker
    tag: dev
    pullPolicy: Always
  repositories: []
  credentialSecret:
    name: ""
    key: ""
  caSecret:
    name: ""
    key: ""
  envFromSecrets: []
  githubAuth:
    mode: token
    secretName: ""
    tokenKey: GITHUB_TOKEN
    appIdKey: GITHUB_APP_ID
    installationIdKey: GITHUB_APP_INSTALLATION_ID
    privateKeyKey: GITHUB_APP_PRIVATE_KEY
  # Operator keys and the stable host key come from credentialSecret; publish the port outside this chart.
  ssh:
    enabled: false
    port: 2222
  # Memory in MiB per agent, multiplied by maxAgents into the pod's memory request and limit.
  memoryPerAgentMi:
    request: 700
    limit: 2048
  resources:
    requests:
      cpu: 100m
      ephemeral-storage: 1Gi
    limits:
      ephemeral-storage: 10Gi
  # Volume source of /home/worker, which holds the repo clones, worktrees and scratchpad; any kind other
  # than emptyDir (a hostPath or persistentVolumeClaim) rolls out by Recreate so two hives never share it.
  homeVolume:
    emptyDir: {}
  # Free GB wt.sh new requires on the home volume, passed to agents as WT_MIN_FREE_GB.
  worktreeMinFreeGb: 50
  nodeSelector: {}
  affinity: {}
  tolerations: []

worker:
  enabled: false
  replicas: 0
  command: []
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

probe:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 16Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 64Mi

networkPolicy:
  enabled: true
  ingressFrom: []

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []
