deployment: distributed

image:
  repository: ghcr.io/the-cloud-clockwork/agentihooks-swarm
  tag: dev
  pullPolicy: Always

hive:
  id: ""

secretEnv: []
envFromSecrets: []
externalSecrets: []

ledger:
  replicas: 1
  port: 8765
  publicUrl: ""
  persistence:
    size: 1Gi
    storageClassName: ""
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

redis:
  enabled: true
  url: ""
  existingSecret:
    name: ""
    key: ""
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

controller:
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  terminationGracePeriodSeconds: 30
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

worker:
  enabled: false
  replicas: 0
  command: []
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi

probe:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 16Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 64Mi

networkPolicy:
  enabled: true
  ingressFrom: []

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []
