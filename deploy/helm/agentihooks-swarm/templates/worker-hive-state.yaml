{{- if and (gt (int .Values.workers.replicas) 0) .Values.workers.joinCodeSecret.name }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "swarm.fullname" . }}-worker-hive-state
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.workers.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.workers.persistence.size }}
{{- end }}
