{{- if and .Values.hub.enabled (not .Values.hiveOnly) }}
{{- $hub := .Values.hub }}
{{- $busUrl := include "swarm.busUrl" . }}
{{- if and (eq (toString $hub.bus.backend) "nats") (not $busUrl) }}
{{- fail "hub.bus.url is required with the nats backend when nats.enabled is false: the hub reads every reactor's events from that address" }}
{{- end }}
{{- if not $hub.servingFile }}
{{- fail "hub.servingFile is required: the hub creates that file once it answers slots requests, and its readiness probe waits for it" }}
{{- end }}
{{- $reload := list }}
{{- range (concat (default (list) .Values.secretEnv) (default (list) $hub.secretEnv)) }}
{{- $reload = append $reload .secretName }}
{{- end }}
{{- $reload = concat $reload (default (list) .Values.envFromSecrets) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swarm.fullname" . }}-hub
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    {{- with ($reload | uniq) }}
    secret.reloader.stakater.com/reload: {{ join "," . | quote }}
    {{- end }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  replicas: {{ int $hub.replicas }}
  {{- if gt (int $hub.replicas) 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "swarm.selector" (dict "root" . "component" "hub") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swarm.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: hub
    spec:
      {{- include "swarm.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ $hub.terminationGracePeriodSeconds }}
      {{- $spread := and (gt (int $hub.replicas) 1) (not (hasKey (default (dict) $hub.affinity) "podAntiAffinity")) }}
      {{- if or $hub.affinity $spread }}
      affinity:
        {{- with $hub.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $spread }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "swarm.selector" (dict "root" . "component" "hub") | nindent 20 }}
        {{- end }}
      {{- end }}
      {{- with $hub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: {{ include "swarm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "swarm.containerSecurity" . | nindent 10 }}
          command: [agentihooks, hub, run]
          env:
            {{- include "swarm.env" (dict "root" . "role" "controller") | nindent 12 }}
            {{- include "swarm.databaseEnv" (dict "root" . "env" $hub.env "secretEnv" $hub.secretEnv) | nindent 12 }}
            - name: AGENTIHOOKS_BUS
              value: {{ $hub.bus.backend | quote }}
            {{- if $hub.bus.scoped }}
            - name: AGENTIHOOKS_BUS_SCOPED
              value: "1"
            {{- end }}
            {{- with $busUrl }}
            - name: AGENTIHOOKS_BUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- include "swarm.extraEnv" $hub.env | nindent 12 }}
            {{- include "swarm.secretKeyEnv" $hub.secretEnv | nindent 12 }}
            - name: AGENTIHOOKS_HUB_SERVING_FILE
              value: {{ $hub.servingFile | quote }}
          {{- include "swarm.envFrom" . | nindent 10 }}
          readinessProbe:
            exec:
              command: [test, -f, {{ $hub.servingFile | quote }}]
            periodSeconds: 2
          resources:
            {{- toYaml $hub.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /home/swarm/.agentihooks
      volumes:
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: {{ $hub.cache.sizeLimit | quote }}
{{- end }}
