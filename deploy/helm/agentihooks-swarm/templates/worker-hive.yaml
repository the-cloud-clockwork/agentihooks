{{- if gt (int .Values.workers.replicas) 0 }}
{{- $workers := .Values.workers }}
{{- $github := $workers.githubAuth }}
{{- if not (has $github.mode (list "token" "app")) }}
{{- fail "workers.githubAuth.mode must be token or app" }}
{{- end }}
{{- $credential := $workers.credentialSecret }}
{{- $code := $workers.joinCodeSecret }}
{{- if eq (empty $credential.name) (empty $code.name) }}
{{- fail "workers need a credentialSecret or joinCodeSecret, exactly one" }}
{{- end }}
{{- if and $code.name (ne (int $workers.replicas) 1) }}
{{- fail "one time join codes require workers.replicas=1" }}
{{- end }}
{{- if gt (int $workers.replicas) 1 }}
{{- fail "workers.replicas above 1 is refused: one hive credential is one hive, so every replica would report the same hive id and agent limit; install one release per hive credential to scale" }}
{{- end }}
{{- if lt (int $workers.maxAgents) 1 }}
{{- fail "workers.maxAgents must be positive" }}
{{- end }}
{{- if and $workers.ssh.enabled (not $credential.name) }}
{{- fail "workers.ssh needs credentialSecret: the hive sshd keys ride in the member credential Secret" }}
{{- end }}
{{- if and $workers.ssh.enabled (lt (int $workers.ssh.port) 1024) }}
{{- fail "workers.ssh.port must be 1024 or higher: sshd runs as the unprivileged worker" }}
{{- end }}
{{- $perAgent := $workers.memoryPerAgentMi }}
{{- if or (lt (int $perAgent.request) 1) (lt (int $perAgent.limit) (int $perAgent.request)) }}
{{- fail "workers.memoryPerAgentMi needs a positive request and a limit no lower than it" }}
{{- end }}
{{- if or (hasKey ($workers.resources.requests | default dict) "memory") (hasKey ($workers.resources.limits | default dict) "memory") }}
{{- fail "set worker hive memory with workers.memoryPerAgentMi, not workers.resources" }}
{{- end }}
{{- $memory := dict "requests" (dict "memory" (printf "%dMi" (mul $workers.maxAgents $perAgent.request))) "limits" (dict "memory" (printf "%dMi" (mul $workers.maxAgents $perAgent.limit))) }}
{{- $secret := $credential }}
{{- $path := "credential" }}
{{- if $code.name }}
{{- $secret = $code }}
{{- $path = "code" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swarm.fullname" . }}-worker-hive
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-hive
spec:
  replicas: {{ $workers.replicas }}
  {{- if $code.name }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "swarm.selector" (dict "root" . "component" "worker-hive") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swarm.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker-hive
    spec:
      {{- include "swarm.podSecurity" . | nindent 6 }}
      containers:
        - name: worker-hive
          image: {{ include "swarm.image" (dict "Values" (dict "image" $workers.image)) }}
          imagePullPolicy: {{ $workers.image.pullPolicy }}
          {{- include "swarm.containerSecurity" . | nindent 10 }}
          env:
            {{- if $github.secretName }}
            - name: HIVE_GITHUB_AUTH_MODE
              value: {{ $github.mode | quote }}
            {{- $keys := dict "GITHUB_TOKEN" $github.tokenKey }}
            {{- if eq $github.mode "app" }}
            {{- $keys = dict "GITHUB_APP_ID" $github.appIdKey "GITHUB_APP_INSTALLATION_ID" $github.installationIdKey "GITHUB_APP_PRIVATE_KEY" $github.privateKeyKey }}
            {{- end }}
            {{- range $name, $key := $keys }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $github.secretName }}
                  key: {{ required "each selected workers.githubAuth Secret key is required" $key }}
            {{- end }}
            {{- end }}
            - name: SWARM_HIVE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AGENTIHOOKS_DEPLOYMENT
              value: {{ .Values.deployment | quote }}
            - name: HIVE_ROLES
              value: {{ join "," $workers.roles | quote }}
            - name: HIVE_MAX_AGENTS
              value: {{ $workers.maxAgents | quote }}
            - name: HIVE_REPOSITORIES
              value: {{ $workers.repositories | toJson | quote }}
            {{- if $credential.name }}
            - name: HIVE_CREDENTIAL_FILE
              value: /run/hive-join/credential
            {{- else }}
            - name: HIVE_JOIN_URL
              value: {{ required "workers.joinUrl is required with a join code" $workers.joinUrl | quote }}
            - name: HIVE_JOIN_CODE_FILE
              value: /run/hive-join/code
            {{- end }}
            {{- if $workers.caSecret.name }}
            - name: SSL_CERT_FILE
              value: /run/hive-ca/ca.pem
            {{- end }}
            {{- if $workers.ssh.enabled }}
            - name: HIVE_SSH_AUTHORIZED_KEYS_FILE
              value: /run/hive-join/ssh/authorized_keys
            - name: HIVE_SSH_HOST_KEY_FILE
              value: /run/hive-join/ssh/host_key
            - name: HIVE_SSH_PORT
              value: {{ $workers.ssh.port | quote }}
            {{- end }}
          {{- if $workers.ssh.enabled }}
          ports:
            - name: ssh
              containerPort: {{ $workers.ssh.port }}
          {{- end }}
          {{- with $workers.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: join
              mountPath: /run/hive-join
              readOnly: true
            - name: home
              mountPath: /home/worker
            - name: tmp
              mountPath: /tmp
            {{- if $workers.caSecret.name }}
            - name: ca
              mountPath: /run/hive-ca
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml (mergeOverwrite (deepCopy $workers.resources) $memory) | nindent 12 }}
      volumes:
        - name: join
          secret:
            secretName: {{ $secret.name }}
            defaultMode: 0440
            items:
              - key: {{ required "worker join Secret key is required" $secret.key }}
                path: {{ $path }}
              {{- if $workers.ssh.enabled }}
              - key: authorized_keys
                path: ssh/authorized_keys
              - key: host_key
                path: ssh/host_key
              {{- end }}
        - name: home
          {{- if $code.name }}
          persistentVolumeClaim:
            claimName: {{ include "swarm.fullname" . }}-worker-hive-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if $workers.caSecret.name }}
        - name: ca
          secret:
            secretName: {{ $workers.caSecret.name }}
            items:
              - key: {{ required "workers.caSecret.key is required" $workers.caSecret.key }}
                path: ca.pem
        {{- end }}
{{- end }}
