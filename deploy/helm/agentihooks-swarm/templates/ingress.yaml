{{- if and .Values.ingress.enabled (not .Values.hiveOnly) }}
{{- if and .Values.networkPolicy.enabled (not .Values.networkPolicy.ingressFrom) }}
{{- fail "ingress.enabled needs networkPolicy.ingressFrom to admit the ingress controller to the ledger" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "swarm.fullname" . }}-ledger
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
  {{- $annotations := .Values.ingress.annotations | default dict }}
  {{- if .Values.ledger.tls.secretName }}
  {{- $verify := dict "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS" "nginx.ingress.kubernetes.io/proxy-ssl-verify" "on" }}
  {{- $_ := set $verify "nginx.ingress.kubernetes.io/proxy-ssl-name" (printf "%s-ledger" (include "swarm.fullname" .)) }}
  {{- $_ := set $verify "nginx.ingress.kubernetes.io/proxy-ssl-secret" (printf "%s/%s" .Release.Namespace .Values.ledger.tls.secretName) }}
  {{- $annotations = merge $verify $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is the public ledger host" .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "swarm.fullname" . }}-ledger
                port:
                  name: http
{{- end }}
