{{- if and .Values.auth.enabled (not .Values.hiveOnly) }}
{{- $auth := .Values.auth }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "swarm.fullname" . }}-auth
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  replicas: {{ int $auth.replicas }}
  selector:
    matchLabels:
      {{- include "swarm.selector" (dict "root" . "component" "auth") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swarm.labels" . | nindent 8 }}
        app.kubernetes.io/component: auth
    spec:
      {{- include "swarm.podSecurity" . | nindent 6 }}
      {{- with $auth.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $auth.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: auth
          image: {{ include "swarm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "swarm.containerSecurity" . | nindent 10 }}
          command: [python, -m, scripts.auth, serve, --host, 0.0.0.0, --port, {{ $auth.port | quote }}]
          env:
            {{- include "swarm.env" (dict "root" . "role" "controller") | nindent 12 }}
            - name: AGENTIHOOKS_AUTH_LEGACY
              value: {{ $auth.legacy | quote }}
            {{- include "swarm.extraEnv" $auth.env | nindent 12 }}
            {{- include "swarm.secretKeyEnv" $auth.secretEnv | nindent 12 }}
          {{- include "swarm.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ int $auth.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml $auth.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swarm.fullname" . }}-auth
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  type: ClusterIP
  selector:
    {{- include "swarm.selector" (dict "root" . "component" "auth") | nindent 4 }}
  ports:
    - name: http
      port: {{ int $auth.port }}
      targetPort: http
{{- end }}
