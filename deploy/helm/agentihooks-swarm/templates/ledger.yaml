{{- if not .Values.hiveOnly }}
{{- $fullname := include "swarm.fullname" . }}
{{- $host := printf "%s-ledger" $fullname }}
{{- $port := .Values.ledger.port }}
{{- $replicas := int .Values.ledger.replicas }}
{{- $secretNames := list }}
{{- range .Values.ledger.secretEnv }}
{{- $secretNames = append $secretNames .name }}
{{- end }}
{{- $shared := or (hasKey (.Values.ledger.env | default dict) "AGENTIHOOKS_SWARM_DATABASE_URL") (has "AGENTIHOOKS_SWARM_DATABASE_URL" $secretNames) }}
{{- if lt $replicas 1 }}
{{- fail "ledger.replicas must be at least 1" }}
{{- end }}
{{- if and (gt $replicas 1) (not $shared) }}
{{- fail "ledger.replicas above 1 needs the shared database: set AGENTIHOOKS_SWARM_DATABASE_URL in ledger.secretEnv, since a ledger folder has one active writer" }}
{{- end }}
{{- if gt $replicas 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $host }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: ledger
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "swarm.selector" (dict "root" . "component" "ledger") | nindent 6 }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $host }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: ledger
spec:
  type: ClusterIP
  selector:
    {{- include "swarm.selector" (dict "root" . "component" "ledger") | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $host }}
  {{- with .Values.ledger.tls.secretName }}
  annotations:
    secret.reloader.stakater.com/reload: {{ . | quote }}
  {{- end }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: ledger
spec:
  replicas: {{ $replicas }}
  {{- if gt $replicas 1 }}
  minReadySeconds: 5
  {{- end }}
  serviceName: {{ $host }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "swarm.selector" (dict "root" . "component" "ledger") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swarm.labels" . | nindent 8 }}
        app.kubernetes.io/component: ledger
    spec:
      {{- include "swarm.podSecurity" . | nindent 6 }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.ledger.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ledger.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ledger
          image: {{ include "swarm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "swarm.containerSecurity" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ $port }}
          env:
            {{- include "swarm.env" (dict "root" . "role" "ledger") | nindent 12 }}
            - name: LEDGER_HOST
              value: 0.0.0.0
            - name: LEDGER_PORT
              value: {{ $port | quote }}
            - name: LEDGER_DIR
              value: /data
            {{- if .Values.ledger.tls.secretName }}
            - name: LEDGER_TLS_CERT
              value: /run/ledger-tls/tls.crt
            - name: LEDGER_TLS_KEY
              value: /run/ledger-tls/tls.key
            {{- end }}
            - name: SWARM_RELOAD
              value: "0"
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: SWARM_PUBLIC_URL
              value: {{ .Values.ledger.publicUrl | default (ternary (printf "https://%s" .Values.ingress.host) (include "swarm.ledgerUrl" .) .Values.ingress.enabled) | quote }}
            - name: SWARM_ALLOWED_HOSTS
              value: {{ printf "%s:%v,%s.%s:%v,%s.%s.svc:%v,%s.%s.svc.cluster.local:%v%s" $host $port $host .Release.Namespace $port $host .Release.Namespace $port $host .Release.Namespace $port (ternary (printf ",%s" .Values.ingress.host) "" .Values.ingress.enabled) | quote }}
            {{- include "swarm.secretKeyEnv" .Values.ledger.secretEnv | nindent 12 }}
            {{- include "swarm.extraEnv" .Values.ledger.env | nindent 12 }}
          {{- include "swarm.envFrom" . | nindent 10 }}
          {{- if gt $replicas 1 }}
          lifecycle:
            preStop:
              exec:
                command: [python, -c, "import time; time.sleep(5)"]
          {{- end }}
          readinessProbe:
            {{- include "swarm.healthz" . | nindent 12 }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            {{- include "swarm.healthz" . | nindent 12 }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.ledger.tls.secretName }}
            - name: ledger-tls
              mountPath: /run/ledger-tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.ledger.resources | nindent 12 }}
      {{- with .Values.ledger.tls.secretName }}
      volumes:
        - name: ledger-tls
          secret:
            secretName: {{ . | quote }}
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.ledger.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.ledger.persistence.size }}
{{- end }}
