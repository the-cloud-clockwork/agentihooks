{{- if and (not .Values.hiveOnly) .Values.api.enabled }}
{{- $fullname := include "swarm.fullname" . }}
{{- $host := printf "%s-api" $fullname }}
{{- $api := .Values.api }}
{{- $busUrl := include "swarm.busUrl" . }}
{{- $secretNames := list }}
{{- range $api.secretEnv }}
{{- $secretNames = append $secretNames .name }}
{{- end }}
{{- if not (and $api.token.secretName $api.token.key) }}
{{- fail "api.enabled needs api.token.secretName and api.token.key: the api answers only callers holding its token" }}
{{- end }}
{{- if not (has "AGENTIHOOKS_SWARM_DATABASE_URL" $secretNames) }}
{{- fail "api.enabled needs AGENTIHOOKS_SWARM_DATABASE_URL in api.secretEnv: every API replica writes the one shared database" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $host }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "swarm.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ $api.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $host }}
  labels:
    {{- include "swarm.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ int $api.replicas }}
  selector:
    matchLabels:
      {{- include "swarm.selector" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swarm.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- include "swarm.podSecurity" . | nindent 6 }}
      {{- with $api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "swarm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "swarm.containerSecurity" . | nindent 10 }}
          command: [python, -m, scripts.swarm_ledger.api.store]
          ports:
            - name: http
              containerPort: {{ $api.port }}
          env:
            - name: AGENTIHOOKS_SWARM_API_PORT
              value: {{ $api.port | quote }}
            - name: LEDGER_DIR
              value: /data
            - name: AGENTIHOOKS_BUS
              value: {{ ternary .Values.hub.bus.backend "memory" (not (empty $busUrl)) | quote }}
            {{- with $busUrl }}
            - name: AGENTIHOOKS_BUS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $api.token.secretName }}
            - name: AGENTIHOOKS_SWARM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $api.token.key }}
            {{- end }}
            {{- include "swarm.secretKeyEnv" $api.secretEnv | nindent 12 }}
            {{- include "swarm.extraEnv" $api.env | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml $api.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
