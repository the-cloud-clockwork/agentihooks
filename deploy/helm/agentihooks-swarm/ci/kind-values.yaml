image:
  repository: local/agentihooks-swarm
  tag: dev
  pullPolicy: Never
ledger:
  tls:
    secretName: swarm-ledger-tls
redis:
  image:
    repository: mirror.gcr.io/library/redis
controller:
  startupProbe:
    periodSeconds: 1
  readinessProbe:
    periodSeconds: 1
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 1
    timeoutSeconds: 5
    failureThreshold: 6
  terminationGracePeriodSeconds: 30
  # Never created in kind; optional lets the controller start without it.
  secretEnv:
    - name: AGENTIHOOKS_WORKER_TERMINAL
      secretName: swarm-worker-terminal
      key: setting
      optional: true
  env:
    AGENTIHOOKS_CONTROLLER_TICK_SECONDS: "2"
nats:
  enabled: false
