rules:
  - id: hub-pulls-poll-unbounded-sweep
    languages: [python]
    severity: ERROR
    message: >-
      The pulls reactor poll runs on the single hub loop thread, so a fetch loop over every open pull request with no
      time slice holds every reactor for the whole sweep. On 24 and 25 November one sweep took about three minutes of
      every pass and task changes waited sixteen hours to be tracked. Check the elapsed time against SLICE_MS before
      each fetch and pause the sweep at a stored cursor.
    paths:
      include:
        - /scripts/hub/pulls.py
        - hub-pulls-poll-unbounded-sweep.py
    patterns:
      - pattern-inside: |
          def poll(...):
              ...
      - pattern: |
          for $URL in $URLS:
              ...
      - pattern: |
          for $URL in $URLS:
              ...
              $SEEN = self._fetch($URL)
              ...
      - pattern-not: |
          for $URL in $URLS:
              ...
              if <... SLICE_MS ...>:
                  ...
              ...
