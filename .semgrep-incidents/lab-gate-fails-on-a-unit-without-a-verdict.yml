rules:
  - id: lab-gate-fails-on-a-unit-without-a-verdict
    languages: [python]
    severity: ERROR
    message: >-
      The lab scheduler folds a gate to failure from every final unit that did not pass. A unit the lab lost, a
      unit its worker reported as crashed or unable to run and a job that vanished hold no verdict, so a failed gate
      on them blames the head for a fault of the lab. Fail a gate only on a unit that failed, and conclude neutral
      when the only units without a pass have an outcome in UNGRADED.
    paths:
      include:
        - /scripts/ci_lab/scheduler.py
        - lab-gate-fails-on-a-unit-without-a-verdict.py
    pattern-either:
      - pattern: |
          "success" if all($SLOT.outcome == $PASSED for $SLOT in $SLOTS) else "failure"
      - pattern: |
          "failure" if any($SLOT.outcome != $PASSED for $SLOT in $SLOTS) else "success"
