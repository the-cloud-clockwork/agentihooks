rules:
  - id: credential-guard-heredoc-substitution
    languages: [python]
    severity: ERROR
    message: >-
      The credential guard returned before it read any heredoc body when no stage of the segment ran a shell, so a
      command substitution in an unquoted heredoc body fed to cat or tee, which the shell still runs, read a dotenv
      file past the guard. Walk every heredoc body: judge a body a shell runs as a command, and judge each command
      substitution of an unquoted body as a stage.
    paths:
      include:
        - /hooks/
        - /scripts/
        - credential-guard-heredoc-substitution.py
    patterns:
      - pattern-inside: |
          def $FUNCTION(...):
              ...
              for $TOKEN in HEREDOC_TOKEN.finditer(...):
                  ...
      - pattern: |
          if not any(runs_input_script(...) for $STAGE in $STAGES):
              return ALLOW
