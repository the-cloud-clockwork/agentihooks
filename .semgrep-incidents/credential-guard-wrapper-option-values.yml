rules:
  - id: credential-guard-wrapper-option-values
    languages: [python]
    severity: ERROR
    message: >-
      Skipping only the flag immediately after sudo makes its value the command.
      Consume wrapper options and their values before selecting the wrapped command.
    paths:
      include:
        - /hooks/
        - credential-guard-wrapper-option-values.py
    patterns:
      - pattern-inside: |
          def verb_index(...):
            ...
      - pattern: |
          if $TOKEN.startswith("-") and $INDEX > 0 and $TOKENS[$INDEX - 1] == "sudo":
              continue
