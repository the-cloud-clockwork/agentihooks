rules:
  - id: review-record-write-skips-forge-post
    languages: [python]
    severity: ERROR
    message: >-
      A review record holds only findings the forge received. A finding enters the record only as a Finding built
      with the comment id that forge.post returned for it, so the rule guards the write at that construction; writes
      that change stored findings post nothing new, and only _decode rebuilds stored findings.
    paths:
      include:
        - /scripts/review/
        - review-record-write-skips-forge-post.py
    patterns:
      - pattern: Finding(...)
      - pattern-not: Finding($ID, $BODY, $FORGE.post(...), ...)
      - pattern-not: Finding(..., comment=$FORGE.post(...), ...)
      - pattern-not-inside: |
          def _decode(...):
              ...
