rules:
  - id: nats-reply-without-size-path
    languages: [python]
    severity: ERROR
    message: >-
      A NATS reply is sent without nats_payload.fitted, so a reply over the server payload limit is dropped and the
      requester only times out. Send every reply through nats_payload.fitted, which compresses an oversized reply and
      hands one that still does not fit to the serve's refusal.
    paths:
      include:
        - /scripts/events/*.py
        - nats-reply-without-size-path.py
    patterns:
      - pattern: $MSG.respond($REPLY)
      - pattern-not: $MSG.respond(nats_payload.fitted(...))
      - pattern-not-inside: |
          $REPLY = nats_payload.fitted(...)
          ...
