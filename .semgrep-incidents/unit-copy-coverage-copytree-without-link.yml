rules:
  - id: unit-copy-coverage-copytree-without-link
    languages: [python]
    severity: ERROR
    message: >-
      The unit copy layout copies a queue leg coverage folder into a push leg without
      copy_function=os.link. Every copy writes the coverage databases again, and on 26 November the
      twenty push legs filled the 6Gi anton-oss work folder of the reusing dev push copy job.
    paths:
      include:
        - /scripts/ci_unit_copy.py
        - unit-copy-coverage-copytree-without-link.py
    patterns:
      - pattern: shutil.copytree($QUEUE / artifact("coverage", $LEG), ...)
      - pattern-not: shutil.copytree(..., copy_function=os.link, ...)
