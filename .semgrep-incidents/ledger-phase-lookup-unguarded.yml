rules:
  - id: ledger-phase-lookup-unguarded
    languages: [python]
    severity: ERROR
    message: >-
      A ledger phases map is indexed by a task's phase field with no guard, so a task whose phase is empty or not in
      the ledger raises KeyError. Read the phase with get and handle a missing phase. The rule covers lookups by a
      task's phase field only; lookups by a phase id the ledger already validated are out of its scope.
    paths:
      include:
        - /scripts/
        - ledger-phase-lookup-unguarded.py
    patterns:
      - pattern-either:
          - pattern-inside: |
              $PHASES = {$P["id"]: $P for $P in $DOC["phases"]}
              ...
          - pattern-inside: |
              $PHASES: $TYPE = {$P["id"]: $P for $P in $DOC["phases"]}
              ...
          - pattern-inside: |
              $PHASES = {$P["id"]: $P for $P in $DOC.get("phases", ...)}
              ...
      - pattern-not-inside: |
          if $T["phase"] in $PHASES:
              ...
      - pattern: $PHASES[$T["phase"]]
