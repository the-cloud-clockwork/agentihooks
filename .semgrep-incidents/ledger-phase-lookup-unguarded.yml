rules:
  - id: ledger-phase-lookup-unguarded
    languages: [python]
    severity: ERROR
    message: >-
      A ledger phases map is indexed by a task's phase with no guard. The ledger stores a task with no phase as an
      empty phase, so a phase less task raises KeyError with an empty key; hub plan lane admission crashed this way
      after its claim and the hive read it as a slot request missing an empty key. Read the phase with get and handle a
      task whose phase is empty or not in the ledger.
    paths:
      include:
        - /scripts/
        - ledger-phase-lookup-unguarded.py
    patterns:
      - pattern-either:
          - pattern-inside: |
              $PHASES = {$P["id"]: $P for $P in $DOC["phases"]}
              ...
          - pattern-inside: |
              $PHASES = {$P["id"]: $P for $P in $DOC.get("phases", ...)}
              ...
      - pattern: $PHASES[$T["phase"]]
