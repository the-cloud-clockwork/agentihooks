rules:
  - id: credential-guard-get-secret-output-regex
    languages: [python]
    severity: ERROR
    message: >-
      The credential guard refused kubectl get of a Secret only when the command text held get directly before the
      Secret type and the short output flag directly before yaml or json, so the long output flag, an equals sign, a
      quoted format, a flag before the type and every jsonpath, template and custom columns format printed Secret
      data values. Read the kubectl words and the output flag in every spelling instead of matching the command text.
    paths:
      include:
        - /hooks/
        - credential-guard-get-secret-output-regex.py
    patterns:
      - pattern: re.$FUNCTION("$REGEX", ...)
      - metavariable-regex:
          metavariable: $REGEX
          regex: (?is).*(get\\{1,2}s[*+]secret|-o\\{1,2}s[*+?]?\(?(\?:)?(yaml|json))
