rules:
  - id: tick-fenced-runtime
    languages: [python]
    severity: ERROR
    message: >-
      A tick module builds the controller's fenced runtime itself, so the runtime it spawns through escapes the
      Tools ports and their deadlines. Take the lease through the coordination port and fence through the runtime
      port: tools.runtime.fence(held, deployment, deadline=...).
    paths:
      include:
        - /scripts/tick/
        - tick-fenced-runtime.py
    pattern-regex: \bFencedRuntime\b
