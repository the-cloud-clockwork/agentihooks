rules:
  - id: tick-fenced-runtime
    languages: [python]
    severity: ERROR
    message: >-
      A tick module builds the controller's fenced runtime itself. Plan slice tc-d2 closed on the condition that the
      pass fences its runtime only through its ports, yet the masters step kept building FencedRuntime in its master
      placement and respawn paths, so those spawns ran outside the Tools ports and their recorded deadlines. Take the
      lease through the coordination port and fence through the runtime port: tools.runtime.fence(held, deployment,
      deadline=...).
    paths:
      include:
        - /scripts/tick/
        - tick-fenced-runtime.py
    pattern-regex: \bFencedRuntime\b
