rules:
  - id: tick-site-hook-waits-on-future
    languages: [python]
    severity: ERROR
    message: >-
      A tick site hook runs inline on the thread that schedules every step of the pass, so a hook that waits on a
      future, such as the pass view build through pass_view, submits and reaps no step until the wait ends; outbox
      migration sat ready at four seconds and started at thirty nine behind the relay hook's view wait. Wait in a
      tick step on its own step thread, as the view wait step does, and keep the hook to work that answers at once.
    paths:
      include:
        - /scripts/swarm/cli.py
        - /scripts/tick/sites.py
        - tick-site-hook-waits-on-future.py
    patterns:
      - pattern-either:
          - pattern-inside: |
              class $CLASS:
                  ...
          - pattern-inside: |
              class $CLASS(...):
                  ...
      - pattern-either:
          - pattern: $MODULE.pass_view(...)
          - pattern: pass_view(...)
          - pattern: $FUTURE.result(...)
          - pattern: concurrent.futures.wait(...)
          - pattern: wait(...)
