rules:
  - id: export-read-with-write-timeout
    languages: [python]
    severity: ERROR
    message: >-
      A full ledger export read runs under the 10 second request timeout meant for writes and small reads, and a
      large export never finishes inside it. Read a full export under EXPORT_TIMEOUT.
    paths:
      include:
        - /scripts/
        - export-read-with-write-timeout.py
    pattern-either:
      - pattern: ResourceClient($BASE, $CREDENTIALS, REQUEST_TIMEOUT).request($SLUG, "export", ...)
      - pattern: ResourceClient($BASE, $CREDENTIALS, $LEDGER.REQUEST_TIMEOUT).request($SLUG, "export", ...)
  - id: view-start-without-export-retry
    languages: [python]
    severity: ERROR
    message: >-
      The tick view is read under the short snapshot timeout and a timeout falls straight to the stored view, so a
      full export after a restart or a stale view never fits and no pass ever stores a view. Hand a failed short
      read to _read_long_or_hold_stored, which reads again under EXPORT_TIMEOUT_S.
    paths:
      include:
        - /scripts/swarm/cli.py
        - export-read-with-write-timeout.py
    patterns:
      - pattern: |
          try:
              ...
              $VIEW.start($SLUG, $SERVICE, $CLIENT.SNAPSHOT_TIMEOUT_S)
              ...
          except OSError as $EXC:
              ...
      - pattern-not: |
          try:
              ...
          except OSError as $EXC:
              ...
              _read_long_or_hold_stored(...)
  - id: offline-write-queued-without-send
    languages: [python]
    severity: ERROR
    message: >-
      A ledger write in a pass that runs from its last good view is queued in the outbox without being sent, so a
      server that is only slow while it serves a full export to another client never takes a controller write.
      Queue without sending only when slow() is false, and queue after a send only when that send went unanswered.
    paths:
      include:
        - /scripts/swarm/ledger_client.py
        - export-read-with-write-timeout.py
    patterns:
      - pattern-inside: |
          def _call(...):
              ...
      - pattern-either:
          - pattern: $LEDGER.queue(...)
          - pattern: _offline_write(...)
      - pattern-not-inside: |
          if <... slow() ...>:
              ...
      - pattern-not-inside: |
          if <... unreachable ...>:
              ...
