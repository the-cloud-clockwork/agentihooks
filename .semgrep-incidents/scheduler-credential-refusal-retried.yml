rules:
  - id: scheduler-credential-refusal-retried
    languages: [python]
    severity: ERROR
    message: >-
      The scheduler run loop catches the state store's unanswered errors without first ending on a credential
      refusal. redis AuthenticationError subclasses ConnectionError and NoPermissionError is a ResponseError, so a
      revoked login or an ACL denial is retried every second forever. Catch the state.refused() result ahead of the
      unanswered and transient handlers and raise Refused from it so the runner exits with its refused code.
    paths:
      include:
        - /scripts/scheduler/service.py
        - scheduler-credential-refusal-retried.py
    patterns:
      - pattern-inside: |
          $SILENCE = state.unanswered(...)
          ...
      - pattern-inside: |
          while ...:
              ...
      - pattern: |
          try:
              ...
          except $SILENCE:
              ...
      - pattern-not: |
          try:
              ...
          except $REFUSED as $EXC:
              ...
              raise $ERR(...) from $EXC
          except $SILENCE:
              ...
