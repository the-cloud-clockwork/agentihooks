rules:
  - id: quick-authentication-unconditional-route
    languages: [python]
    severity: ERROR
    message: Quick launch must choose its routing arguments from the saved seat authentication.
    paths:
      include:
        - /scripts/quick/launch.py
        - quick-authentication-unconditional-route.py
    patterns:
      - pattern-inside: |
          def argv(...):
              ...
      - pattern: return [..., "--routed-only", ...]
