rules:
  - id: credential-guard-offers-describe-secret
    languages: [python]
    severity: ERROR
    message: >-
      The credential guard offered kubectl describe secret as the leak free way to read a Kubernetes Secret, and
      describe prints the token of a service account token Secret in full, so an agent that followed the advice put
      the token in its transcript. Never offer describe as a block alternative; list the key names with a go-template
      over .data instead.
    paths:
      include:
        - /hooks/
        - credential-guard-offers-describe-secret.py
    pattern-either:
      - patterns:
          - pattern: block(...) + "$ALTERNATIVE"
          - metavariable-regex:
              metavariable: $ALTERNATIVE
              regex: (?is).*kubectl\s+describe\s+secrets?\b
      - patterns:
          - pattern: $NAME = "$ALTERNATIVE"
          - metavariable-regex:
              metavariable: $ALTERNATIVE
              regex: (?is).*kubectl\s+describe\s+secrets?\b
