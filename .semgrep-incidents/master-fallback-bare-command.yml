rules:
  - id: master-fallback-bare-command
    languages: [python]
    severity: ERROR
    message: >-
      The master fallback runs a bare agentihooks command, which a systemd user unit cannot find because its PATH
      has no user bin folder. Build the command with master_up, which runs this interpreter with -m scripts.install,
      and launch it with launch_env.
    paths:
      include:
        - /scripts/swarm/master_fallback.py
        - /scripts/swarm/master_critical.py
        - master-fallback-bare-command.py
    pattern: '["agentihooks", ...]'
