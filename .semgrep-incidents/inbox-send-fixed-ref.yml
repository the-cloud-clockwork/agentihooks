rules:
  - id: inbox-send-fixed-ref
    languages: [python]
    severity: ERROR
    message: >-
      An inbox item is sent with a fixed string ref. The seen marks record every ref a recipient was shown, so each
      later item with the same ref is closed as already shown through the ledger the moment it is delivered.
      Automated agent collection sent every activity question with one ref; the dispatcher's second question closed
      26 ms after delivery and the dispatcher was never collected. Give each item its own ref: the notice name
      followed by what makes this item distinct.
    paths:
      include:
        - /scripts/
        - /hooks/
        - inbox-send-fixed-ref.py
    patterns:
      - pattern: $INBOX.send(..., ref="...", ...)
      - pattern-not: $INBOX.send(..., ref="", ...)
