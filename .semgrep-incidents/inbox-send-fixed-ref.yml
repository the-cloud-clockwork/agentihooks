rules:
  - id: inbox-send-fixed-ref
    languages: [python]
    severity: ERROR
    message: >-
      An inbox item is sent with a ref that repeats from one send to the next: a string literal, a module constant,
      or a formatted string built only from constants, the swarm slug or the recipient's name and seat. The seen
      marks record every ref a recipient was shown, so each later item with the same ref is closed as already shown
      through the ledger the moment it is delivered. Automated agent collection sent every activity question with
      one ref, the master backstop one ref per master and the master retire ask one constant ref, and each later item
      closed on delivery. Give each item its own ref: the notice name followed by what makes this item distinct,
      such as its send time.
    paths:
      include:
        - /scripts/
        - /hooks/
        - inbox-send-fixed-ref.py
    patterns:
      - pattern: $INBOX.send(..., ref=$REF, ...)
      - metavariable-regex:
          metavariable: $REF
          regex: >-
            ^(?:"[^"]+"|'[^']+'|(?:\w+\.)*[A-Z][A-Z0-9_]*|f"(?:[^"{}]|\{(?:(?:\w+\.)*[A-Z][A-Z0-9_]*|(?:\w+\.)*(?:slug|name|seat|address|master))\})+")$
