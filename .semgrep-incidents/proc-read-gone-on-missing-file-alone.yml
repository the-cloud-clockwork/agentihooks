rules:
  - id: proc-read-gone-on-missing-file-alone
    languages: [python]
    severity: ERROR
    message: >-
      A per pid proc file is read inside a try that catches FileNotFoundError alone. The open succeeds while the
      process lives; once the process is reaped the read fails with ESRCH, which Python raises as ProcessLookupError,
      so a probe raises where it should answer gone. Catch ProcessLookupError beside FileNotFoundError, or OSError.
    patterns:
      - pattern-inside: |
          try:
              ...
          except FileNotFoundError:
              ...
      - pattern-either:
          - pattern-regex: /proc/(\{[^}]+\}|%[ds])/\w+
          - pattern-regex: /proc/"\s*\+
          - patterns:
              - pattern-inside: |
                  $FILE = $BUILT
                  ...
              - metavariable-regex:
                  metavariable: $BUILT
                  regex: (?s).*/proc/(\{[^}]+\}|%[ds]|"\s*\+).*
              - pattern-either:
                  - pattern: $FILE.$READ(...)
                  - pattern: open($FILE, ...)
