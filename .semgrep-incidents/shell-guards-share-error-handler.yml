rules:
  - id: shell-guards-share-error-handler
    languages: [python]
    severity: ERROR
    message: >-
      Give each shell guard its own exception handler so an unexpected failure
      cannot skip another guard or report the wrong guard name.
    paths:
      include:
        - /hooks/hook_manager.py
        - shell-guards-share-error-handler.py
    patterns:
      - pattern-inside: |
          def $GUARDS(...):
              ...
      - metavariable-regex:
          metavariable: $GUARDS
          regex: ^_check_shell_guards
      - pattern-either:
          - pattern: |
              try:
                  ...
                  $FIRST(...)
                  ...
                  $SECOND(...)
                  ...
              except ...:
                  ...
          - pattern: |
              try:
                  ...
                  $FIRST(...)
                  ...
                  if $REFUSAL := $SECOND(...):
                      ...
                  ...
              except ...:
                  ...
          - pattern: |
              try:
                  ...
                  if $REFUSAL := $FIRST(...):
                      ...
                  ...
                  $SECOND(...)
                  ...
              except ...:
                  ...
          - pattern: |
              with $HANDLER:
                  ...
                  $FIRST(...)
                  ...
                  $SECOND(...)
                  ...
          - pattern: |
              with $HANDLER:
                  ...
                  $FIRST(...)
                  ...
                  if $REFUSAL := $SECOND(...):
                      ...
                  ...
          - pattern: |
              with $HANDLER:
                  ...
                  if $REFUSAL := $FIRST(...):
                      ...
                  ...
                  $SECOND(...)
                  ...
      - metavariable-regex:
          metavariable: $FIRST
          regex: ^(check_branch_guard|check_commit_on_main|protection_refusal|check_venv_guard)$
      - metavariable-regex:
          metavariable: $SECOND
          regex: ^(check_branch_guard|check_commit_on_main|protection_refusal|check_venv_guard)$
      - metavariable-comparison:
          comparison: str($FIRST) != str($SECOND)
