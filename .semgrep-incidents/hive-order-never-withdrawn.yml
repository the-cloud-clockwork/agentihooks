rules:
  - id: hive-order-never-withdrawn
    languages: [python]
    severity: ERROR
    message: >-
      A hive drain sends hand off orders with _order but never withdraws them with _withdraw when it stops waiting.
      The orders go to each agent's seat, so they stay open after the drain ends and the seat's next occupant, on
      another hive, reads an order that no longer applies and hands off for nothing. Call _withdraw with the same
      inbox and ordered map once the drain loop ends.
    patterns:
      - pattern-inside: |
          def $F(...):
              ...
      - pattern-not-inside: |
          def $G(...):
              ...
              _withdraw($INBOX, $ORDERED, ...)
              ...
      - pattern: _order($INBOX, $ORDERED, $REMAINING, $TEXT, $HIVE)
