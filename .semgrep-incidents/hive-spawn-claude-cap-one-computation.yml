rules:
  - id: hive-spawn-claude-cap-one-computation
    languages: [python]
    severity: ERROR
    message: A hive spawn runtime reads the Claude cap the hub admits by. Build it from runtime.worker_runtime and compute a worker Claude cap only through session_bands.worker_cap, or the hub admits seats the hive spawn refuses.
    paths:
      include:
        - /scripts/hive/
        - /scripts/hub/
        - /scripts/routing/
        - /scripts/swarm/capacity.py
        - /scripts/swarm/runtime.py
        - /scripts/claude_quota_balancer.py
        - hive-spawn-claude-cap-one-computation.py
    pattern-either:
      - pattern: LocalHerdrRuntime(HerdrRuntime(...))
      - pattern: |
          $HERDR = HerdrRuntime(...)
          ...
          LocalHerdrRuntime($HERDR)
      - pattern: session_bands.scaled_cap(...)
      - pattern: session_bands.hive_ceiling(...)
