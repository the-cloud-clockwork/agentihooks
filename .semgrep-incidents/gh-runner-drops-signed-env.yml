rules:
  - id: gh-runner-drops-signed-env
    languages: [python]
    severity: ERROR
    message: >-
      A gh runner handed to the GitHub adapter calls the caller's runner without the env option it received.
      github_reads signs a call in a process holding the App key by switching the command to the bare gh client
      and putting the installation token in env; a runner that drops env runs gh with no token, so on 18
      November every merge queue read in the swarm controller failed with gh auth login and the merge pass
      never queued a released green pull request. Forward env when the options carry it.
    paths:
      include:
        - /scripts/swarm/merge_queue.py
        - gh-runner-drops-signed-env.py
    patterns:
      - pattern-inside: |
          def $GH($ARGV, **$OPTIONS):
              ...
      - pattern: $RUN($ARGV, ..., timeout=$TIMEOUT, ...)
      - pattern-not: $RUN($ARGV, ..., env=$ENV, ...)
      - pattern-not: $RUN($ARGV, ..., **$SIGNED)
