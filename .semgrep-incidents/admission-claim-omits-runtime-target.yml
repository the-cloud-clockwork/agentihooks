rules:
  - id: admission-claim-omits-runtime-target
    languages: [python]
    severity: ERROR
    message: >-
      An AgentRecord built in scripts/hub/ without runtime_target leaves scripts/hive/launch_logs.py:main() reading
      agent.runtime_target["host_id"] on a hub admitted execution, raising KeyError and never starting serve. Add
      runtime_target={"host_id": $HIVE} to the AgentRecord call.
    paths:
      include:
        - /scripts/hub/
        - admission-claim-omits-runtime-target.py
    patterns:
      - pattern: AgentRecord(...)
      - pattern-not: AgentRecord(..., runtime_target=$TARGET, ...)
      - pattern-not: AgentRecord(**$KWARGS)
