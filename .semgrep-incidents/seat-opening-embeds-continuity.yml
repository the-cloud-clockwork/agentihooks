rules:
  - id: seat-opening-embeds-continuity
    languages: [python]
    severity: ERROR
    message: Seated opening and transfer priming defer continuity bodies to agentihooks seat brief.
    paths:
      include:
        - /scripts/swarm/prompt.py
        - /scripts/handoff/transfers.py
        - seat-opening-embeds-continuity.py
    patterns:
      - pattern-not-inside: |
          if not seated:
              ...
      - pattern-either:
          - pattern-inside: |
              def priming_lines(...):
                  ...
          - pattern-inside: |
              def handoff_lines(...):
                  ...
          - pattern-inside: |
              def priming(...):
                  ...
      - pattern-either:
          - pattern: $OUT.append($TASK["handoff"])
          - pattern: $OUT += [..., $TASK["handoff"], ...]
          - pattern: f"...{$TASK['handoff']}..."
