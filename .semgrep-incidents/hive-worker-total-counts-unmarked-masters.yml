rules:
  - id: hive-worker-total-counts-unmarked-masters
    languages: [python]
    severity: ERROR
    message: >-
      A hive worker total that subtracts only sessions carrying the interactive login marker keeps a master on the
      subscription or api route counted as a worker, so placement refuses a hive the hub still admits. Subtract the
      masters the hive lists with _unmarked_masters inside the worker total.
    paths:
      include:
        - /scripts/hive/launch.py
        - hive-worker-total-counts-unmarked-masters.py
    patterns:
      - pattern: $HIVE["agents"] = max(0, $TOTAL) + $PENDING
      - pattern-not: $HIVE["agents"] = max(0, <... _unmarked_masters(...) ...>) + $PENDING
