rules:
  - id: tick-free-skips-execution-stop
    languages: [python]
    severity: ERROR
    message: >-
      A tick path that retires an agent through retire_unless_gone and then drops it with a claim refund must pass the
      drop through the tick hive stop helper _stop_hive, so a hub admitted agent freed for a revoked account, repeated
      content refusals or a stuck provider error also ends on its hive. Without the stop the hive keeps the execution
      running after the swarm released its seat.
    paths:
      include:
        - /scripts/tick/
        - tick-free-skips-execution-stop.py
    patterns:
      - pattern-inside: |
          def $FREE(...):
              ...
              if not $T.retire_watch.retire_unless_gone(...):
                  ...
              ...
      - pattern-either:
          - pattern: $T._drop(..., refund=True)
          - pattern: $T.timing.timed($T._drop, ..., refund=True)
      - pattern-not-inside: $T._stop_hive(..., $T._drop(...))
      - pattern-not-inside: $T.timing.timed($T._stop_hive, ..., $T._drop(...))
      - pattern-not-inside: |
          def $FREE(...):
              ...
              $DROPPED = $T._drop(...)
              ...
              $T._stop_hive(..., $DROPPED)
              ...
      - pattern-not-inside: |
          def $FREE(...):
              ...
              $DROPPED = $T.timing.timed($T._drop, ...)
              ...
              $T._stop_hive(..., $DROPPED)
              ...
      - pattern-not-inside: |
          def $FREE(...):
              ...
              $DROPPED = $T.timing.timed($T._drop, ...)
              ...
              $T.timing.timed($T._stop_hive, ..., $DROPPED)
              ...
