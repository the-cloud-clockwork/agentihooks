rules:
  - id: render-links-login-credentials
    languages: [python]
    severity: ERROR
    message: >-
      The Claude profile render linked the login credentials file into every rendered profile home, so engineer, ci
      and planner sessions could read the master claude ai login. Never add the credentials file to the shared names a
      render links; only the master profile home links it.
    paths:
      include:
        - /scripts/profiles/
        - render-links-login-credentials.py
    pattern-either:
      - pattern: $NAME = (..., ".credentials.json", ...)
      - pattern: $LINK.symlink_to(<... ".credentials.json" ...>)
      - pattern: (<... ".credentials.json" ...>).symlink_to(...)
