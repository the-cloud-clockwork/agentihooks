rules:
  - id: lane-model-before-harness
    languages: [python]
    severity: ERROR
    message: Resolve Claude only lane models for Codex before returning an explicit effort; otherwise engineer launches fail before their profile canary.
    paths:
      include:
        - /scripts/swarm/model_pick.py
        - lane-model-before-harness.py
    pattern: |
      $DEFAULT = ModelPick(...)
      if $DEFAULT.effort != AUTO or $HARNESS not in EFFORTS:
          return $DEFAULT
