rules:
  - id: hub-admission-answer-ms-from-slot-timeout
    languages: [python]
    severity: ERROR
    message: >-
      The hub's admission answer budget is derived from account_slots.REQUEST_TIMEOUT_MS, the timeout sized for the
      fast take/heartbeat/release account-slot ops. The hosted ledger claim write the admission path performs can
      run past that budget by itself, so the hub proactively reopens and refuses admissions the hive would still
      have accepted. Derive it from account_slots.ADMISSION_REQUEST_TIMEOUT_MS instead.
    paths:
      include:
        - /scripts/hub/admission.py
        - hub-admission-answer-ms-from-slot-timeout.py
    pattern-either:
      - pattern: account_slots.REQUEST_TIMEOUT_MS
      - pattern: scripts.hive.account_slots.REQUEST_TIMEOUT_MS
