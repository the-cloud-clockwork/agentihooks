rules:
  - id: panic-sweep-rereads-merged-fixes
    languages: [python]
    severity: ERROR
    message: >-
      The panic cancel sweep runs in every tick pass. Reading each fix pull request through fix_change on every
      sweep re-read sixty fixes, fifty three of them merged, one gh call at a time on the pass thread, and held each
      controller pass about ninety seconds after its graph (issue 11670). Read fix pull requests in the panic module
      through fix_state with the swarm store, which keeps a merged one once read; only the registration check reads
      a fix directly.
    paths:
      include:
        - /scripts/swarm/panic.py
        - panic-sweep-rereads-merged-fixes.py
    patterns:
      - pattern-either:
          - pattern: fix_change(...)
          - pattern: fix_branch(...)
          - pattern: stack.change(...)
      - pattern-not-inside: |
          def fix_change(...):
            ...
      - pattern-not-inside: |
          def fix_state(...):
            ...
      - pattern-not-inside: |
          def fix_branch(...):
            ...
      - pattern-not-inside: |
          def check_fix(...):
            ...
