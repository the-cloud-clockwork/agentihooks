rules:
  - id: hub-free-seat-skips-launch-assignment
    languages: [python]
    severity: ERROR
    message: >-
      A hub events claim picks a free seat without reading the task's saved launch assignment, so a reclaimed task's
      successor lands in the lowest free seat instead of the leaver's seat and its mail is stranded. Read the saved
      launch assignment and prefer its seat, then the handoff seat, before calling the free seat pick.
    paths:
      include:
        - /scripts/hub/
        - hub-free-seat-skips-launch-assignment.py
    patterns:
      - pattern-inside: |
          def $CLAIM(...):
              ...
      - pattern: tick._free_seat(...)
      - pattern-not-inside: |
          def $CLAIM(...):
              ...
              $STORE.key($SLUG, "launch-assignments", ...)
              ...
