name: Test environment key
description: Stamp the day and name the shared test environment cache key. Every workflow that restores or saves the venv the Tests jobs share reads its key here, so the key has one definition.
inputs:
  python-version:
    description: Interpreter version setup-python resolved
    required: true
outputs:
  date:
    description: UTC day the key is stamped with
    value: ${{ steps.key.outputs.date }}
  key:
    description: Cache key of the shared test environment
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - name: Name the test environment key
      id: key
      shell: bash
      env:
        KEY_PREFIX: venv-${{ runner.os }}-${{ inputs.python-version }}
        KEY_INPUTS: ${{ hashFiles('pyproject.toml', '.github/test-excludes.txt') }}-${{ hashFiles('.github/test-constraints.txt') }}-${{ hashFiles('.github/test-requirements.lock') }}
      run: |
        date=$(date -u +%F)
        echo "date=$date" >> "$GITHUB_OUTPUT"
        echo "key=$KEY_PREFIX-$date-$KEY_INPUTS" >> "$GITHUB_OUTPUT"
