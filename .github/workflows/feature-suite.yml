name: Feature suite

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Feature suite' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('feature-suite-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Feature suite' && 'max' || 'single' }}

jobs:
  features:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && (github.event_name == 'merge_group' && 'anton-oss-queue' || 'anton-oss') || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      AGENTIHOOKS_FEATURE_SUITE: "1"
      AGENTIHOOKS_SWARM_REDIS_URL: redis://127.0.0.1:6380/0
      AGENTIHOOKS_SWARM_DATABASE_URL: postgresql://postgres@127.0.0.1:5434/ledger
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Start Redis and Postgres from retried pulls
        run: |
          bash scripts/packaging/pull-runtime-image.sh public.ecr.aws/docker/library/redis:7-alpine
          bash scripts/packaging/pull-runtime-image.sh public.ecr.aws/docker/library/postgres:16
          docker run --pull never --rm -d --name "feature-redis-$GITHUB_RUN_ID" -p 127.0.0.1:6380:6379 public.ecr.aws/docker/library/redis:7-alpine
          docker run --pull never --rm -d --name "feature-postgres-$GITHUB_RUN_ID" -p 127.0.0.1:5434:5432 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=ledger public.ecr.aws/docker/library/postgres:16
          timeout 30 bash -c "until docker exec feature-redis-$GITHUB_RUN_ID redis-cli ping; do sleep 1; done"
          timeout 60 bash -c "until docker exec feature-postgres-$GITHUB_RUN_ID pg_isready -h 127.0.0.1 -p 5432 -d ledger; do sleep 1; done"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false

      - name: Install dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AGENTIHOOKS: 0.dev${{ github.run_number }}
        run: uv pip install --system --constraint .github/test-requirements.lock --excludes .github/test-excludes.txt -e '.[dev,all]'

      - name: Run the feature suite against the services
        run: |
          python -m pytest tests/features --confcutdir=tests/features -m feature -n 0 -v -rs --tb=long --basetemp="$RUNNER_TEMP/feature-suite" --junitxml="$RUNNER_TEMP/feature-suite.xml"

      - name: Install the browser that mapped page tests drive
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        uses: ./.github/actions/browser-cache

      - name: Fetch dev for the mapped tests that grade against their base
        if: ${{ !cancelled() }}
        run: git fetch --no-tags --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev

      - name: Run the mapped tests outside the feature suite
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
        run: |
          python -m scripts.feature_map --nodes > "$RUNNER_TEMP/mapped-nodes.txt"
          mapfile -t nodes < <(grep -v '^tests/features/' "$RUNNER_TEMP/mapped-nodes.txt")
          (( ${#nodes[@]} > 0 ))
          env -u AGENTIHOOKS_FEATURE_SUITE -u AGENTIHOOKS_SWARM_REDIS_URL -u AGENTIHOOKS_SWARM_DATABASE_URL python -m pytest "${nodes[@]}" -n "$(python -m scripts.ci_cpu_quota)" --dist loadgroup -v -rs --tb=short --timeout=60 --timeout-method=thread -p no:cacheprovider --junitxml="$RUNNER_TEMP/feature-mapped.xml"

      - name: Fail on a mapped test missing, skipped or xfailed at run time
        if: ${{ !cancelled() }}
        run: python -m scripts.feature_map --junit "$RUNNER_TEMP/feature-suite.xml" --junit "$RUNNER_TEMP/feature-mapped.xml"

      - name: Upload the feature suite junit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-suite-junit
          path: |
            ${{ runner.temp }}/feature-suite.xml
            ${{ runner.temp }}/feature-mapped.xml
          retention-days: 14

      - name: Print the service, ledger server and scripted agent logs
        if: failure()
        run: |
          docker logs --tail 100 "feature-postgres-$GITHUB_RUN_ID" || true
          docker logs --tail 50 "feature-redis-$GITHUB_RUN_ID" || true
          find "$RUNNER_TEMP/feature-suite" -name '*.log' -print -exec tail -n 200 {} \;

      - name: Stop the services
        if: always()
        run: docker rm -f "feature-redis-$GITHUB_RUN_ID" "feature-postgres-$GITHUB_RUN_ID" || true
