name: Retained mutation replay

on:
  workflow_call:
    inputs:
      case:
        type: string
        required: true

permissions:
  contents: read
  actions: read

env:
  PYTHONNOUSERSITE: "1"

jobs:
  plan:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false
      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Preserve retained scope and refine its mutation plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CASE: ${{ inputs.case }}
          MUTATION_SHARD_CPU_QUOTA: "3"
        run: python -m scripts.ci_mutation.replay prepare --case "$CASE"
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-replay-input
          path: |
            .mutation-replay/source
            .mutation-replay/stats
            .mutation-replay/scope.json
            .mutation-replay/manifest.json
          include-hidden-files: true
          retention-days: 7

  grade:
    needs: plan
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-batch' || 'ubuntu-latest' }}
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false
      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - uses: actions/download-artifact@v4
        with:
          name: mutation-replay-input
          path: .mutation-replay
      - name: Grade retained mutants within the unchanged budget
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          PYTHONUNBUFFERED: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m scripts.ci_mutation.replay grade --shard "$SHARD" --shards "$SHARDS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-replay-grade-${{ matrix.shard }}
          path: .mutation-replay/grade-${{ matrix.shard }}/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [plan, grade]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false
      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - uses: actions/download-artifact@v4
        with:
          name: mutation-replay-input
          path: .mutation-replay
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-replay-grade-*
          path: .mutation-replay/grades
      - name: Verify complete grading and retained survivor failures
        run: python -m scripts.ci_mutation.replay verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-replay-proof
          path: |
            .mutation-replay/manifest.json
            .mutation-replay/stats/plan.json
            .mutation-replay/replay-proof.json
          include-hidden-files: true
          retention-days: 7
