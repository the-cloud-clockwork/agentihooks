name: Tests

on:
  pull_request:
    branches: [dev, main]
  # dev is the deploy source and the only branch agents commit to, so it is the
  # branch that most needs gating. Without this every dev commit shipped
  # untested and only a snapshot PR to main ever ran the suite.
  push:
    branches: [dev]
  merge_group:
    types: [checks_requested]

  workflow_dispatch:
    inputs:
      base:
        description: Base revision for mutation scope
        required: true
        default: origin/dev

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  swarm-image:
    uses: ./.github/workflows/swarm-smoke.yml
  semgrep:
    uses: ./.github/workflows/semgrep.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}

  brain-smoke:
    uses: ./.github/workflows/brain-smoke.yml

  wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install "pyyaml>=6.0"

      - name: Check every pull request job is a need of Gate Required
        run: python -m scripts.ci_wiring

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - {python-version: "3.11", shard: 5}
          - {python-version: "3.11", shard: 6}
          - {python-version: "3.11", shard: 7}
          - {python-version: "3.11", shard: 8}
    steps:
      # A squash merge into an unmoved dev has the same tree as the merge commit
      # its pull request tested, so the dev push run would repeat a passed run.
      - &lookup
        name: Look up a passed pull request run of this tree
        id: lookup
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tests-passed-$TREE" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | length') || n=0
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.lookup.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - &python
        name: Set up Python ${{ matrix.python-version }}
        if: steps.lookup.outputs.skip != 'true'
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Dependencies resolve unpinned (no lock file is tracked), so the key rolls
      # daily to pick up new releases. The venv lives outside the checkout: tests
      # scan modules loaded from the repo root.
      - &day
        name: Stamp the day
        if: steps.lookup.outputs.skip != 'true'
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - &venv
        name: Restore the test environment
        if: steps.lookup.outputs.skip != 'true'
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ steps.day.outputs.date }}-${{ hashFiles('pyproject.toml', '.github/test-excludes.txt') }}

      - &uv
        name: Set up uv
        if: steps.lookup.outputs.skip != 'true' && steps.venv.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          # Downloading the wheels is faster than restoring a cache of them unpacked.
          enable-cache: false

      # Everything below runs as `python -m <tool>`, never the bare console
      # script. pip on the self-hosted runner installs into the user site
      # (~/.local), whose bin dir is not on PATH, so `pytest` and `ruff`
      # resolved to "command not found" while the packages were installed fine.
      - &install
        name: Install dependencies
        if: steps.lookup.outputs.skip != 'true' && steps.venv.outputs.cache-hit != 'true'
        run: |
          uv venv --python "${{ steps.python.outputs.python-path }}" "$HOME/venv"
          uv pip install --python "$HOME/venv/bin/python" --excludes .github/test-excludes.txt -e ".[dev,all]"

      - &use-venv
        name: Use the test environment
        if: steps.lookup.outputs.skip != 'true'
        run: echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Restore latest dev durations
        if: steps.lookup.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/dev-durations
          key: durations-merged-${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}

      - name: Adopt latest dev durations
        if: steps.lookup.outputs.skip != 'true'
        run: python -m tests.dev_durations ${{ matrix.python-version }} ~/dev-durations

      # NOT `-m unit`: only 439 of 999 tests carry that marker, so 560 —
      # including every ownership-scope test guarding what uninstall and prune
      # are allowed to delete — never ran in CI at all.
      - name: Run tests
        if: steps.lookup.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: ${{ matrix.python-version == '3.12' && format('--cov=hooks --cov=scripts --cov-report= --cov-config={0}/.github/coverage/coverage.ini', github.workspace) || '-p no:pytest_cov' }}
        run: python -c 'import os, shlex, sys, pytest; sys.exit(pytest.main(shlex.split(os.environ.pop("PYTEST_ADDOPTS", "")) + sys.argv[1:]))' tests/ -v -n auto --dist loadgroup --shard ${{ matrix.shard }}/${{ matrix.python-version == '3.12' && 8 || 4 }} --tb=short --store-durations --durations-path durations.json -p no:anyio -p no:xdist.looponfail -p no:legacypath -p no:doctest -p no:pastebin -p no:junitxml

      # Shards balance on these: per-test times here differ from a local run.
      - name: Upload durations
        if: steps.lookup.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: durations-${{ matrix.python-version }}-${{ matrix.shard }}
          path: durations.json
          retention-days: 14
          overwrite: true

      - name: Upload coverage
        if: steps.lookup.outputs.skip != 'true' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  shard-check:
    needs: [unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Skips only when unit skipped too: a passed record landing mid-run must not skip the check of shards that ran.
      - name: Look up whether unit skipped a passed tree
        id: lookup
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
          VERSION: ${{ matrix.python-version }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tests-passed-$TREE" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)] | length') || passed=0
          ran=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq "[.artifacts[].name | select(startswith(\"durations-$VERSION-\"))] | length")
          if [ "${passed:-0}" -gt 0 ] && [ "$ran" -eq 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.lookup.outputs.skip != 'true'

      - *python
      - *day
      - *venv
      - *uv
      - *install
      - *use-venv

      - name: Download shard durations
        if: steps.lookup.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: durations-${{ matrix.python-version }}-*
          path: shard-durations

      - name: Check every collected test ran in exactly one shard
        if: steps.lookup.outputs.skip != 'true'
        run: python -m tests.shard_check shard-durations/*/durations.json

  test-count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - *lookup

      - uses: actions/checkout@v4
        if: steps.lookup.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - *python
      - *day
      - *venv
      - *uv
      - *install
      - *use-venv

      - name: Check out the base revision
        if: steps.lookup.outputs.skip != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"

      # The base revision's copy grades, so a pull request cannot loosen its own floor.
      - name: Hold the base revision's test count
        if: steps.lookup.outputs.skip != 'true'
        run: |
          grader="$RUNNER_TEMP/base"
          [[ -f "$grader/tests/count_floor.py" ]] || grader="$GITHUB_WORKSPACE"
          cd "$grader"
          python -m tests.count_floor --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE"

  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - *lookup

      - uses: actions/checkout@v4
        if: steps.lookup.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.lookup.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install ruff
        if: steps.lookup.outputs.skip != 'true'
        run: python -m pip install ruff==0.15.12

      - name: Check out the base revision
        if: steps.lookup.outputs.skip != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"

      - name: Check out the protected grader
        if: steps.lookup.outputs.skip != 'true'
        run: |
          git fetch --no-tags origin dev
          git worktree add --detach "$RUNNER_TEMP/grader" FETCH_HEAD

      # dev's copy grades against the base's allowlist, so a pull request cannot loosen its own limits or allowlist.
      # The bootstrap branch runs only while dev's history has never carried the grader.
      - name: Hold the size and complexity limits
        if: steps.lookup.outputs.skip != 'true'
        run: |
          if [[ -f "$RUNNER_TEMP/grader/scripts/size_limits.py" ]]; then
            cd "$RUNNER_TEMP/grader"
            python -m scripts.size_limits --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE"
          elif [[ -z "$(git -C "$RUNNER_TEMP/grader" log -1 --format=%H -- scripts/size_limits.py)" ]]; then
            python -m scripts.size_limits --bootstrap --head "$GITHUB_WORKSPACE"
          else
            echo "::error::dev once carried scripts/size_limits.py and no longer does, so nothing trusted can grade."
            exit 1
          fi

  sonar:
    runs-on: ubuntu-latest
    # Covers the 18 minute dev push wait, the 20 minute coverage deadline, the scan and the gate.
    timeout-minutes: 45
    env:
      SONAR_SCANNER_VERSION: 7.2.0.5079
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install "coverage>=7.4"

      - name: Start Cloudflare Access proxy
        id: proxy
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          python .github/coverage/proxy.py > sonar-proxy.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          for attempt in {1..5}; do
            if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:9000/api/system/status; then
              version=$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:9000/api/server/version)
              test -n "$version"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Restore Sonar downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.sonar/cache
            ${{ runner.tool_cache }}/sonar-scanner-cli
          key: sonar-${{ runner.os }}-${{ runner.arch }}-${{ env.SONAR_SCANNER_VERSION }}-${{ steps.proxy.outputs.version }}

      # Sonar names a branch analysis after the ref, so a queue run would open a throwaway gh-readonly-queue branch.
      - name: Name the queued pull request
        id: queued
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          [[ "$HEAD_REF" =~ ^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$ ]]
          number="${BASH_REMATCH[1]}"
          branch=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .head.ref)
          echo "args=-Dsonar.pullrequest.key=$number -Dsonar.pullrequest.branch=$branch -Dsonar.pullrequest.base=${BASE_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

      # Sonar refuses an analysis dated before the project's latest one, so dev push scans run one at a time in push order.
      - name: Wait for older dev analyses
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          for poll in {1..36}; do
            waiting=""
            unread=""
            if runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?event=push&branch=dev&per_page=100" \
              | jq -r --argjson number "$RUN_NUMBER" '.workflow_runs[] | select(.run_number < $number and .status != "completed") | .id'); then
              for run in $runs; do
                sonar=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
                  | jq -r '[.jobs[] | select(.name == "sonar") | .status][0] // "absent"') || unread=yes
                if [[ "$sonar" != "completed" ]]; then waiting="$waiting $run"; fi
              done
            else
              unread=yes
            fi
            if [[ -z "$waiting" && -z "$unread" ]]; then exit 0; fi
            echo "Waiting for the Sonar analysis of older dev runs:$waiting${unread:+ (runs API unreadable)}"
            sleep 30
          done
          if [[ -n "$unread" ]]; then
            echo "::error::The runs API stayed unreadable for 18 minutes."
            exit 1
          fi
          echo "::warning::Older dev runs still hold Sonar after 18 minutes:$waiting; scanning anyway."

      # Placed after every step that needs no coverage, so those overlap the unit shards.
      - name: Merge shard coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/coverage/combine.sh "$GITHUB_RUN_ID" 8

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          scannerVersion: ${{ env.SONAR_SCANNER_VERSION }}
          args: ${{ steps.queued.outputs.args }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000

      - name: SonarQube Quality Gate
        id: gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000

      # The gate action grades against whatever gate the server binds, so a silent rebind would loosen it.
      - name: Hold the Delivery L2 conditions
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -o pipefail
          api() { curl --fail --silent --show-error --max-time 10 -H "Authorization: Bearer $SONAR_TOKEN" "http://127.0.0.1:9000/api/$1"; }
          expected=$(printf '%s\n' "new_bugs GT 0" "new_coverage LT 80" "new_duplicated_lines_density GT 3" \
            "new_security_hotspots_reviewed LT 100" "new_vulnerabilities GT 0" | sort)
          defined=$(api "qualitygates/show?name=Delivery%20L2" | jq -er '.conditions[] | "\(.metric) \(.op) \(.error)"' | sort)
          if [[ "$defined" != "$expected" ]]; then
            echo "::error::The Delivery L2 gate on the server differs from its antoncore definition."
            printf 'Expected:\n%s\nDefined:\n%s\n' "$expected" "$defined"
            exit 1
          fi
          task=$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)
          [[ -n "$task" ]] || { echo "::error::No Sonar task id in report-task.txt."; exit 1; }
          analysis=$(api "ce/task?id=$task" | jq -er .task.analysisId)
          status=$(api "qualitygates/project_status?analysisId=$analysis")
          jq -c .projectStatus <<<"$status"
          graded=$(jq -er '.projectStatus.conditions[] | "\(.metricKey) \(.comparator) \(.errorThreshold)"' <<<"$status" | sort)
          required=$(printf '%s\n' "new_bugs GT 0" "new_vulnerabilities GT 0")
          foreign=$(comm -13 <(echo "$expected") <(echo "$graded"))
          missing=$(comm -23 <(echo "$required") <(echo "$graded"))
          if [[ -n "$foreign$missing" ]]; then
            echo "::error::The analysis was not graded on the Delivery L2 conditions. Foreign: ${foreign:-none}. Missing: ${missing:-none}."
            exit 1
          fi

      - name: Upload coverage and analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: |
            coverage.xml
            .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Stop the proxy
        if: always() && steps.proxy.outputs.pid != ''
        env:
          PROXY_PID: ${{ steps.proxy.outputs.pid }}
        run: kill "$PROXY_PID"

  lint:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    permissions:
      contents: read
      actions: read
    steps:
      - *lookup

      - uses: actions/checkout@v4
        if: steps.lookup.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.lookup.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        if: steps.lookup.outputs.skip != 'true'
        run: python -m pip install ruff>=0.4

      - name: Lint check
        if: steps.lookup.outputs.skip != 'true'
        run: python -m ruff check hooks/ scripts/ tests/

      - name: Format check
        if: steps.lookup.outputs.skip != 'true'
        run: python -m ruff format --check hooks/ scripts/ tests/

      - name: Select docs build
        id: docs
        if: steps.lookup.outputs.skip != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: |
          git diff --name-only "$BASE" HEAD -- docs index.md _config.yml assets .github/workflows/test.yml > "$RUNNER_TEMP/docs-changes"
          if [[ -s "$RUNNER_TEMP/docs-changes" ]]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build docs with Jekyll
        if: steps.lookup.outputs.skip != 'true' && steps.docs.outputs.build == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Select artifact browser checks
        id: artifacts
        if: steps.lookup.outputs.skip != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: bash .github/actions/browser-cache/select-artifacts.sh

      - name: Install Playwright for artifact checks
        if: steps.lookup.outputs.skip != 'true' && steps.artifacts.outputs.browser == 'true'
        run: python -m pip install "playwright>=1.44.0"

      - name: Install the artifact viewer browser
        if: steps.lookup.outputs.skip != 'true' && steps.artifacts.outputs.browser == 'true'
        timeout-minutes: 2
        uses: ./.github/actions/browser-cache

      - name: Artifact sanity checks
        if: steps.lookup.outputs.skip != 'true' && steps.artifacts.outputs.browser == 'true'
        run: python -m scripts.swarm_ledger.artifact_sanity tests/fixtures/artifacts/*

  gate-required:
    name: Gate — Required
    needs: [unit, shard-check, test-count, size, lint, sonar, mutation, swarm-image, brain-smoke, wiring, semgrep]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          MUTATION: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "$NEEDS"
          if ! jq -e --arg mutation "$MUTATION" 'all(to_entries[]; .value.result == "success" or (.key == "mutation" and .value.result == "skipped" and $mutation == "false"))' <<< "$NEEDS"; then
            echo "::error::Every required gate must succeed."
            exit 1
          fi

  refresh-durations:
    needs: [unit, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install duration collection dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Refresh measured durations
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          source_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=tests-passed-$TREE" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_repository_id == .workflow_run.repository_id)][0].workflow_run.id // empty')
          python -m tests.refresh_durations --ci-run "${source_run:-$GITHUB_RUN_ID}" --ci 5
          test -s .test_durations

      - name: Publish merged durations
        uses: actions/upload-artifact@v4
        with:
          name: durations-merged
          path: .test_durations*
          include-hidden-files: true
          retention-days: 14
          overwrite: true

      - name: Stage merged durations for the cache
        run: mkdir -p ~/dev-durations && cp .test_durations* ~/dev-durations/

      - name: Save merged durations to the cache
        uses: actions/cache/save@v4
        with:
          path: ~/dev-durations
          key: durations-merged-${{ github.sha }}

  record-pass:
    needs: [unit, lint, shard-check, test-count]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.unit.result == 'success' && needs.lint.result == 'success' && needs.shard-check.result == 'success' && needs.test-count.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tested tree
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          echo "sha=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > tree.txt

      - name: Record the passed tree
        uses: actions/upload-artifact@v4
        with:
          name: tests-passed-${{ steps.tree.outputs.sha }}
          path: tree.txt
          retention-days: 7
          overwrite: true

  mutation:
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Select mutation tests before browser setup
        id: selection
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: python -m scripts.ci_mutation.browser --base "$BASE"

      - name: Install the browser that page tests drive
        id: browser
        if: steps.selection.outputs.browser == 'true'
        timeout-minutes: 2
        uses: ./.github/actions/browser-cache

      - name: Report browser setup failure
        if: failure() && steps.browser.outcome == 'failure'
        run: |
          echo "::error::Chromium setup failed or exceeded its two minute timeout; mutation tests cannot run."
          exit 1

      - name: Mutate changed Python files
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PYTHONUNBUFFERED: "1"
        run: python -m scripts.ci_mutation --base "$BASE" --budget 1080

      - name: Mutate dispatched Python files
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE: ${{ inputs.base }}
          PYTHONUNBUFFERED: "1"
        run: python -m scripts.ci_mutation --base "$BASE" --budget 1080

      - name: Upload complete mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: .mutation-gate/
          include-hidden-files: true
          retention-days: 7
