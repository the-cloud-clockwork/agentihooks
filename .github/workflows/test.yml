name: Tests

on:
  pull_request:
    branches: [dev, main]
  # dev is the deploy source and the only branch agents commit to, so it is the
  # branch that most needs gating. Without this every dev commit shipped
  # untested and only a snapshot PR to main ever ran the suite.
  push:
    branches: [dev]
  merge_group:
    types: [checks_requested]

  workflow_dispatch:
    inputs:
      base:
        description: Base revision for mutation scope
        required: true
        default: origin/dev

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mutation-plan:
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      stats_parts: ${{ steps.plan.outputs.stats_parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Size mutation shards from stored timings
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: python -m scripts.ci_mutation.plan --base "$BASE"

  mutation-stats:
    needs: mutation-plan
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.mutation-plan.outputs.stats_parts) }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Plant stats collected for the previous commit
        run: git checkout -q HEAD^

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Select mutation tests before browser setup
        id: selection
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: python -m scripts.ci_mutation.browser --base "$BASE"

      - name: Install the browser that page tests drive
        id: browser
        if: steps.selection.outputs.browser == 'true'
        timeout-minutes: 2
        uses: ./.github/actions/browser-cache

      - name: Report browser setup failure
        if: failure() && steps.browser.outcome == 'failure'
        run: |
          echo "::error::Chromium setup failed or exceeded its two minute timeout; mutation tests cannot run."
          exit 1

      - name: Collect one stats part for every mutation shard
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          PYTHONUNBUFFERED: "1"
          PART: ${{ matrix.part }}
          PARTS: ${{ strategy.job-total }}
        run: python -m scripts.ci_mutation --base "$BASE" --budget 1080 --stats .mutation-stats --stats-part "$PART" --stats-parts "$PARTS"

      - name: Upload mutation stats part
        uses: actions/upload-artifact@v4
        with:
          name: mutation-stats-${{ matrix.part }}
          path: .mutation-stats/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload stats evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-evidence-stats-${{ matrix.part }}
          path: .mutation-gate/
          include-hidden-files: true
          retention-days: 7

  mutation:
    needs: [mutation-plan, mutation-stats]
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Select mutation tests before browser setup
        id: selection
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: python -m scripts.ci_mutation.browser --base "$BASE"

      - name: Install the browser that page tests drive
        id: browser
        if: steps.selection.outputs.browser == 'true'
        timeout-minutes: 2
        uses: ./.github/actions/browser-cache

      - name: Report browser setup failure
        if: failure() && steps.browser.outcome == 'failure'
        run: |
          echo "::error::Chromium setup failed or exceeded its two minute timeout; mutation tests cannot run."
          exit 1

      - name: Download the shared mutation stats
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-stats-*
          path: .mutation-stats
          merge-multiple: true

      - name: Mutate changed Python files
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PYTHONUNBUFFERED: "1"
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: python -m scripts.ci_mutation --base "$BASE" --budget 1080 --shard "$SHARD" --shards "$SHARDS" --stats .mutation-stats

      - name: Mutate dispatched Python files
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE: ${{ inputs.base }}
          PYTHONUNBUFFERED: "1"
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: python -m scripts.ci_mutation --base "$BASE" --budget 1080 --shard "$SHARD" --shards "$SHARDS" --stats .mutation-stats

      - name: Upload complete mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: .mutation-gate/
          include-hidden-files: true
          retention-days: 7
