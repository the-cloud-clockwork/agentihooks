name: Tests

on:
  pull_request:
    branches: [dev, main]
  # dev is the deploy source and the only branch agents commit to, so it is the
  # branch that most needs gating. Without this every dev commit shipped
  # untested and only a snapshot PR to main ever ran the suite.
  push:
    branches: [dev]
  merge_group:
    types: [checks_requested]

  workflow_dispatch:
    inputs:
      base:
        description: Base revision for mutation scope
        required: true
        default: origin/dev

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  swarm-image:
    uses: ./.github/workflows/swarm-smoke.yml
  semgrep:
    uses: ./.github/workflows/semgrep.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}

  brain-smoke:
    uses: ./.github/workflows/brain-smoke.yml

  wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install "pyyaml>=6.0"

      - name: Check every pull request job is a need of Gate Required
        run: python -m scripts.ci_wiring

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Check out the base revision
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"

      # The base revision's copy grades once the base has one, so a pull request cannot loosen its own audit.
      - name: Fail on known vulnerabilities new against the base
        run: |
          grader="$RUNNER_TEMP/base"
          [[ -f "$grader/scripts/ci_dependency_audit.py" ]] || grader="$GITHUB_WORKSPACE"
          cd "$grader"
          python -m scripts.ci_dependency_audit --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE"

  # Every shard restores this one key, or nothing when the lookup found none, so all shards of a run split alike.
  durations:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch') && 4 || 2 }}
    permissions:
      contents: read
    outputs:
      key: ${{ steps.stored.outputs.cache-matched-key }}
      queued: ${{ steps.republished.outputs.queued }}
    steps:
      - name: Look up the base revision's dev durations
        id: stored
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: ~/dev-durations
          key: durations-merged-${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          lookup-only: true

      # Queue refs and dispatched branches cannot read caches saved on dev, so they fetch dev's artifacts on the App's own API quota.
      - name: Mint the tcc main ci App token
        id: app-token
        if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read

      - name: Find the latest passed dev push run
        id: dev-run
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?branch=dev&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run" ]]; then
            echo "::error::No dev push Tests run passed, so the queue run has no dev durations."
            exit 1
          fi
          kept=" $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")') "
          if [[ "$kept" != *" durations-merged "* ]]; then
            echo "::error::Dev push run $run kept no live durations-merged artifact."
            exit 1
          fi
          echo "Restoring dev durations from dev push run $run"
          echo "id=$run" >> "$GITHUB_OUTPUT"

      - name: Find the dev push run of the dispatched base
        id: base-run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ inputs.base }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/${BASE#origin/}" --jq .sha)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?branch=dev&event=push&head_sha=$sha&per_page=20" --jq '.workflow_runs[].id')
          for run in $runs; do
            kept=" $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired | not) | .name] | join(" ")') "
            if [[ "$kept" == *" durations-merged "* && "$kept" == *" coverage-baseline "* ]]; then
              echo "Restoring dev durations and the coverage baseline of base $sha from dev push run $run"
              echo "id=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No dev push Tests run on base $BASE ($sha) kept live durations-merged and coverage-baseline artifacts; pin a base whose dev push run passed and finished."
          exit 1

      - name: Download the dev durations
        if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: durations-merged
          path: ~/dev-durations
          run-id: ${{ steps.dev-run.outputs.id || steps.base-run.outputs.id }}
          repository: ${{ github.repository }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Download the dispatched base's coverage baseline
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: coverage-baseline
          path: ~/coverage-baseline
          run-id: ${{ steps.base-run.outputs.id }}
          repository: ${{ github.repository }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Republish the dev durations
        if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dev-durations
          path: ~/dev-durations/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Republish the dispatched base's coverage baseline
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: queue-coverage-baseline
          path: ~/coverage-baseline/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Mark the dev artifacts restored
        id: republished
        if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
        run: |
          ls -A ~/dev-durations
          echo "queued=true" >> "$GITHUB_OUTPUT"

  unit:
    needs: [durations]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        exclude:
          - {python-version: "3.11", shard: 5}
          - {python-version: "3.11", shard: 6}
          - {python-version: "3.11", shard: 7}
          - {python-version: "3.11", shard: 8}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - &python
        name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Dependencies resolve unpinned (no lock file is tracked), so the key rolls
      # daily to pick up new releases. The venv lives outside the checkout: tests
      # scan modules loaded from the repo root.
      - &day
        name: Stamp the day
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - &venv
        name: Restore the test environment
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ steps.day.outputs.date }}-${{ hashFiles('pyproject.toml', '.github/test-excludes.txt') }}

      - &uv
        name: Set up uv
        if: steps.venv.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          # Downloading the wheels is faster than restoring a cache of them unpacked.
          enable-cache: false

      # Everything below runs as `python -m <tool>`, never the bare console
      # script. pip on the self-hosted runner installs into the user site
      # (~/.local), whose bin dir is not on PATH, so `pytest` and `ruff`
      # resolved to "command not found" while the packages were installed fine.
      - &install
        name: Install dependencies
        if: steps.venv.outputs.cache-hit != 'true'
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          uv venv --python "$PYTHON_PATH" "$HOME/venv"
          uv pip install --python "$HOME/venv/bin/python" --excludes .github/test-excludes.txt -e ".[dev,all]"

      - &use-venv
        name: Use the test environment
        run: echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Download the queued run's dev durations
        if: needs.durations.outputs.queued == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dev-durations
          path: ~/dev-durations

      - name: Restore latest dev durations
        if: needs.durations.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/dev-durations
          key: ${{ needs.durations.outputs.key }}
          fail-on-cache-miss: true

      - name: Adopt latest dev durations
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: python -m tests.dev_durations "$PYTHON_VERSION" ~/dev-durations --hash durations.sha256

      # NOT `-m unit`: only 439 of 999 tests carry that marker, so 560 —
      # including every ownership-scope test guarding what uninstall and prune
      # are allowed to delete — never ran in CI at all.
      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
          PYTEST_ADDOPTS: ${{ matrix.python-version == '3.12' && format('--cov=hooks --cov=scripts --cov-report= --cov-config={0}/.github/coverage/coverage.ini', github.workspace) || '-p no:pytest_cov' }}
          SHARD: ${{ matrix.shard }}/${{ matrix.python-version == '3.12' && 8 || 4 }}
        run: python -c 'import os, shlex, sys, pytest; sys.exit(pytest.main(shlex.split(os.environ.pop("PYTEST_ADDOPTS", "")) + sys.argv[1:]))' tests/ -v -n auto --dist loadgroup --shard "$SHARD" --tb=short --store-durations --durations-path durations.json -p no:anyio -p no:xdist.looponfail -p no:legacypath -p no:doctest -p no:pastebin -p no:junitxml

      # Shards balance on these: per-test times here differ from a local run.
      - name: Upload durations
        uses: actions/upload-artifact@v4
        with:
          name: durations-${{ matrix.python-version }}-${{ matrix.shard }}
          path: |
            durations.json
            durations.sha256
          retention-days: 14
          overwrite: true

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.shard }}
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  shard-check:
    needs: [unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - *python
      - *day
      - *venv
      - *uv
      - *install
      - *use-venv

      - name: Download shard durations
        uses: actions/download-artifact@v4
        with:
          pattern: durations-${{ matrix.python-version }}-*
          path: shard-durations

      - name: Check every collected test ran in exactly one shard
        run: python -m tests.shard_check shard-durations/*/durations.json

      - name: Check every shard's test time fits the fifteen minute budget
        run: python -m tests.shard_budget shard-durations/*/durations.json

  test-count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - *python
      - *day
      - *venv
      - *uv
      - *install
      - *use-venv

      - name: Check out the base revision
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"

      # The base revision's copy grades, so a pull request cannot loosen its own floor.
      - name: Hold the base revision's test count
        run: |
          if [[ ! -f "$RUNNER_TEMP/base/tests/count_floor.py" ]]; then
            echo "::error::The base carries no tests/count_floor.py, so nothing trusted can grade."
            exit 1
          fi
          cd "$RUNNER_TEMP/base"
          python -m tests.count_floor --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE"

  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff==0.15.12

      - name: Check out the base revision
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"

      - name: Check out the protected grader
        run: |
          git fetch --no-tags origin dev
          git worktree add --detach "$RUNNER_TEMP/grader" FETCH_HEAD

      # dev's copy grades against the base's allowlist, so a pull request cannot loosen its own limits or allowlist.
      - name: Hold the size and complexity limits
        run: |
          if [[ -f "$RUNNER_TEMP/grader/scripts/size_limits.py" ]]; then
            cd "$RUNNER_TEMP/grader"
            python -m scripts.size_limits --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE"
          else
            echo "::error::dev carries no scripts/size_limits.py, so nothing trusted can grade."
            exit 1
          fi

  sonar:
    # Waits for the shards' coverage through needs; the API that could poll for it has an hourly quota every run shares.
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_SCANNER_VERSION: 7.2.0.5079
      SONAR_SCANNER_SHA256: da9f4e64a3d555f08ce38b5469ebd91fe2b311af473f7001a5ee5c1fd58b004b
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install "coverage>=7.4"

      # Sonar refuses an analysis dated before the project's latest one, so a dev push run that dev already moved past leaves the analysis to the newer run.
      - name: Check dev still points at this commit
        id: current
        if: github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
        run: |
          dev=$(git ls-remote origin refs/heads/dev)
          [[ -n "$dev" ]]
          if [[ "${dev%%[[:space:]]*}" == "$SHA" ]]; then echo "superseded=false" >> "$GITHUB_OUTPUT"; else echo "superseded=true" >> "$GITHUB_OUTPUT"; fi

      - name: Download shard coverage
        if: steps.current.outputs.superseded != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-3.12-*
          path: .coverage-shards

      # The merge runs while the proxy starts and the downloads restore; the scan waits for it below.
      - name: Merge shard coverage
        id: merge
        if: steps.current.outputs.superseded != 'true'
        run: |
          (
            status=0
            bash .github/coverage/combine.sh --downloaded 8 || status=$?
            echo "$status" > "$RUNNER_TEMP/combine.next"
            mv "$RUNNER_TEMP/combine.next" "$RUNNER_TEMP/combine.status"
          ) < /dev/null > "$RUNNER_TEMP/combine.log" 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"

      - name: Start Cloudflare Access proxy
        id: proxy
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          python .github/coverage/proxy.py > sonar-proxy.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          for attempt in {1..5}; do
            if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:9000/api/system/status; then
              version=$(curl --fail --silent --show-error --max-time 10 http://127.0.0.1:9000/api/server/version)
              test -n "$version"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Hold the Delivery L2 binding
        if: steps.current.outputs.superseded != 'true'
        env:
          SONAR_READ_TOKEN: ${{ secrets.SONAR_READ_TOKEN }}
        run: |
          set -o pipefail
          bound=$(curl --fail --silent --show-error --max-time 10 \
            -H "Authorization: Bearer $SONAR_READ_TOKEN" \
            "http://127.0.0.1:9000/api/qualitygates/get_by_project?project=agentihooks" | jq -er .qualityGate.name)
          if [[ "$bound" != 'Delivery L2' ]]; then
            echo "::error::Project agentihooks is bound to $bound; required Delivery L2."
            exit 1
          fi
          echo "Project agentihooks is bound to Delivery L2"

      - name: Restore Sonar downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.sonar/cache
            ${{ runner.tool_cache }}/sonar-scanner-cli
          key: sonar-${{ runner.os }}-${{ runner.arch }}-${{ env.SONAR_SCANNER_VERSION }}-${{ steps.proxy.outputs.version }}

      # Its own entry, since a changed path list gives a cache a new version that only a dev push that scans can save.
      - name: Restore the SonarJS Node runtime
        uses: actions/cache@v4
        with:
          path: ~/.sonar/js/node-runtime
          key: sonar-node-${{ runner.os }}-${{ runner.arch }}-${{ steps.proxy.outputs.version }}

      # Sonar names a branch analysis after the ref, so a queue run would open a throwaway gh-readonly-queue branch.
      - name: Name the queued pull request
        id: queued
        if: github.event_name == 'merge_group'
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          [[ "$HEAD_REF" =~ ^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$ ]]
          number="${BASH_REMATCH[1]}"
          pull=$(git ls-remote origin "refs/pull/$number/head")
          head="${pull%%[[:space:]]*}"
          [[ -n "$head" ]]
          heads=$(git ls-remote --heads origin)
          branch=$(awk -v head="$head" '$1 == head { sub("refs/heads/", "", $2); print $2 }' <<< "$heads")
          [[ -n "$branch" && "$branch" != *$'\n'* ]] || branch="pr-$number"
          echo "args=-Dsonar.pullrequest.key=$number -Dsonar.pullrequest.branch=$branch -Dsonar.pullrequest.base=${BASE_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

      # A first branch analysis has no new code baseline, so a dispatch graded as a branch drops every Delivery L2 condition.
      - name: Name the dispatched branch as a pull request
        id: dispatched
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'dev'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "args=-Dsonar.pullrequest.key=dispatch-${REF_NAME//\//-} -Dsonar.pullrequest.branch=$REF_NAME -Dsonar.pullrequest.base=dev" >> "$GITHUB_OUTPUT"

      - name: Wait for the coverage merge
        if: always() && steps.current.outputs.superseded != 'true'
        timeout-minutes: 5
        env:
          MERGE_PID: ${{ steps.merge.outputs.pid }}
        run: |
          until [[ -s "$RUNNER_TEMP/combine.status" ]]; do
            if ! kill -0 "$MERGE_PID" 2> /dev/null && [[ ! -s "$RUNNER_TEMP/combine.status" ]]; then
              echo "::error::The coverage merge ended without a status."
              cat "$RUNNER_TEMP/combine.log" 2> /dev/null || true
              exit 1
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/combine.log"
          exit "$(< "$RUNNER_TEMP/combine.status")"

      # Runs the CLI directly: sonarqube-scan-action never finds its tool cache entry, since a four part version is not semver.
      - name: SonarQube Scan
        if: steps.current.outputs.superseded != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://127.0.0.1:9000
          ARGS: ${{ steps.queued.outputs.args || steps.dispatched.outputs.args }}
        run: |
          scanner="$RUNNER_TOOL_CACHE/sonar-scanner-cli/$SONAR_SCANNER_VERSION/linux-x64"
          if [[ ! -x "$scanner/bin/sonar-scanner" ]]; then
            archive="$RUNNER_TEMP/sonar-scanner.zip"
            curl --fail --silent --show-error --location --retry 3 -o "$archive" \
              "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$SONAR_SCANNER_VERSION-linux-x64.zip"
            sha256sum --check --strict <<< "$SONAR_SCANNER_SHA256  $archive"
            unzip -q -o "$archive" -d "$RUNNER_TEMP"
            mkdir -p "$scanner"
            cp -a "$RUNNER_TEMP/sonar-scanner-$SONAR_SCANNER_VERSION-linux-x64/." "$scanner/"
          fi
          read -ra extra <<< "$ARGS"
          "$scanner/bin/sonar-scanner" -Dsonar.projectBaseDir=. "${extra[@]}"

      - name: Upload coverage and analysis evidence
        if: always() && steps.current.outputs.superseded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: |
            coverage.xml
            .coverage-shards/
            .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: SonarQube Quality Gate
        id: gate
        if: steps.current.outputs.superseded != 'true'
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -o pipefail
          api() { curl --fail --silent --show-error --max-time 10 --retry 2 --retry-all-errors -H "Authorization: Bearer $SONAR_TOKEN" "http://127.0.0.1:9000/api/$1"; }
          task=$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)
          [[ -n "$task" ]] || { echo "::error::No Sonar task id in report-task.txt."; exit 1; }
          while true; do
            report=$(api "ce/task?id=$task")
            status=$(jq -er .task.status <<<"$report")
            [[ "$status" == PENDING || "$status" == IN_PROGRESS ]] || break
            sleep 1
          done
          if [[ "$status" != SUCCESS ]]; then
            echo "::error::The Sonar background task ended $status: $(jq -r '.task.errorMessage // "no message"' <<<"$report")"
            exit 1
          fi
          analysis=$(jq -er .task.analysisId <<<"$report")
          gate=$(api "qualitygates/project_status?analysisId=$analysis" | jq -er .projectStatus.status)
          dashboard=$(sed -n 's/^dashboardUrl=//p' .scannerwork/report-task.txt)
          if [[ "$gate" != OK ]]; then
            echo "::error::Quality Gate has FAILED ($gate). Detailed information can be found at: $dashboard"
            exit 1
          fi
          echo "Quality Gate has PASSED. $dashboard"

      # The gate step grades against whatever gate the server binds, so a silent rebind would loosen it.
      - name: Hold the Delivery L2 conditions
        if: always() && steps.current.outputs.superseded != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -o pipefail
          api() { curl --fail --silent --show-error --max-time 10 -H "Authorization: Bearer $SONAR_TOKEN" "http://127.0.0.1:9000/api/$1"; }
          expected=$(printf '%s\n' "new_bugs GT 0" "new_coverage LT 80" "new_duplicated_lines_density GT 3" \
            "new_security_hotspots_reviewed LT 100" "new_vulnerabilities GT 0" | sort)
          defined=$(api "qualitygates/show?name=Delivery%20L2" | jq -er '.conditions[] | "\(.metric) \(.op) \(.error)"' | sort)
          if [[ "$defined" != "$expected" ]]; then
            echo "::error::The Delivery L2 gate on the server differs from its antoncore definition."
            printf 'Expected:\n%s\nDefined:\n%s\n' "$expected" "$defined"
            exit 1
          fi
          task=$(sed -n 's/^ceTaskId=//p' .scannerwork/report-task.txt)
          [[ -n "$task" ]] || { echo "::error::No Sonar task id in report-task.txt."; exit 1; }
          analysis=$(api "ce/task?id=$task" | jq -er .task.analysisId)
          status=$(api "qualitygates/project_status?analysisId=$analysis")
          jq -c .projectStatus <<<"$status"
          graded=$(jq -er '.projectStatus.conditions[] | "\(.metricKey) \(.comparator) \(.errorThreshold)"' <<<"$status" | sort)
          required=$(printf '%s\n' "new_bugs GT 0" "new_vulnerabilities GT 0")
          foreign=$(comm -13 <(echo "$expected") <(echo "$graded"))
          missing=$(comm -23 <(echo "$required") <(echo "$graded"))
          if [[ -n "$foreign$missing" ]]; then
            echo "::error::The analysis was not graded on the Delivery L2 conditions. Foreign: ${foreign:-none}. Missing: ${missing:-none}."
            exit 1
          fi

      - name: Stop the proxy
        if: always() && steps.proxy.outputs.pid != ''
        env:
          PROXY_PID: ${{ steps.proxy.outputs.pid }}
        run: kill "$PROXY_PID"

  lint:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: python -m pip install ruff>=0.4

      - name: Lint check
        run: python -m ruff check hooks/ scripts/ tests/

      - name: Format check
        run: python -m ruff format --check hooks/ scripts/ tests/

      - name: Select docs build
        id: docs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: |
          git diff --name-only "$BASE" HEAD -- docs index.md _config.yml assets .github/workflows/test.yml > "$RUNNER_TEMP/docs-changes"
          if [[ -s "$RUNNER_TEMP/docs-changes" ]]; then echo "build=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build docs with Jekyll
        if: steps.docs.outputs.build == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Select artifact browser checks
        id: artifacts
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: bash .github/actions/browser-cache/select-artifacts.sh

      - name: Install Playwright for artifact checks
        if: steps.artifacts.outputs.browser == 'true'
        run: python -m pip install "playwright>=1.44.0" "orjson>=3.10"

      - name: Install the artifact viewer browser
        if: steps.artifacts.outputs.browser == 'true'
        timeout-minutes: 2
        uses: ./.github/actions/browser-cache

      - name: Artifact sanity checks
        if: steps.artifacts.outputs.browser == 'true'
        run: python -m scripts.swarm_ledger.artifact_sanity tests/fixtures/artifacts/*

  gate-required:
    name: Gate — Required
    needs: [durations, unit, shard-check, test-count, size, lint, sonar, mutation, swarm-image, brain-smoke, wiring, semgrep, dependency-audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          MUTATION: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "$NEEDS"
          if ! jq -e --arg mutation "$MUTATION" 'all(to_entries[]; .value.result == "success" or (.key == "mutation" and .value.result == "skipped" and $mutation == "false"))' <<< "$NEEDS"; then
            echo "::error::Every required gate must succeed."
            exit 1
          fi

  refresh-durations:
    needs: [unit, lint, shard-check]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install duration collection dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Restore recent shard durations
        uses: actions/cache/restore@v4
        with:
          path: ~/durations-samples
          key: durations-samples-${{ github.sha }}
          restore-keys: durations-samples-

      - name: Download this run's shard durations
        uses: actions/download-artifact@v4
        with:
          pattern: durations-3.*
          path: ~/durations-samples/${{ github.run_id }}

      - name: Refresh measured durations
        run: |
          python -m tests.refresh_durations --samples ~/durations-samples --ci-run "$GITHUB_RUN_ID" --ci 5
          test -s .test_durations

      - name: Publish merged durations
        uses: actions/upload-artifact@v4
        with:
          name: durations-merged
          path: .test_durations*
          include-hidden-files: true
          retention-days: 14
          overwrite: true

      - name: Stage merged durations for the cache
        run: mkdir -p ~/dev-durations && cp .test_durations* ~/dev-durations/

      - name: Save merged durations to the cache
        uses: actions/cache/save@v4
        with:
          path: ~/dev-durations
          key: durations-merged-${{ github.sha }}

      - name: Save recent shard durations
        uses: actions/cache/save@v4
        with:
          path: ~/durations-samples
          key: durations-samples-${{ github.sha }}

  coverage-baseline:
    needs: [gate-required, sonar]
    if: ${{ !cancelled() && github.event_name == 'push' && needs['gate-required'].result == 'success' && needs.sonar.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install "coverage>=7.4"

      - name: Resolve baseline trees
        id: tree
        env:
          PREVIOUS: ${{ github.event.before }}
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "previous=$(git rev-parse "$PREVIOUS^{tree}")" >> "$GITHUB_OUTPUT"

      - name: Restore measured coverage history
        uses: actions/cache/restore@v4
        with:
          path: ~/coverage-baseline
          key: coverage-baseline-${{ steps.tree.outputs.previous }}

      - name: Download this run's measured coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-3.12-*
          path: baseline-coverage

      - name: Compute the coverage baseline
        run: |
          python -m tests.coverage_baseline --shards 8 \
            --head-shards baseline-coverage \
            --out "$HOME/coverage-baseline/baseline.json" \
            --previous "$HOME/coverage-baseline/baseline.json"

      - name: Save the passed dev coverage baseline
        uses: actions/cache/save@v4
        with:
          path: ~/coverage-baseline
          key: coverage-baseline-${{ steps.tree.outputs.tree }}

      - name: Publish the passed dev coverage baseline
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: ~/coverage-baseline
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  # A later queue entry's base is the earlier entry's merge commit, so the run that measured it may still be finishing.
  queue-baseline:
    needs: [unit]
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install "coverage>=7.4"

      - name: Download this run's shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-3.12-*
          path: .coverage-shards

      # Later queue entries wait on this upload, so it runs before Sonar and the gate rather than after them.
      - name: Record this run's coverage baseline
        run: python -m tests.coverage_baseline --shards 8 --head-shards .coverage-shards --out "$RUNNER_TEMP/own-baseline/baseline.json"

      - name: Publish this run's coverage baseline
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: ${{ runner.temp }}/own-baseline/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Mint the tcc main ci App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read

      - name: Find the run that measured the base tree
        id: base-run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_SHA" --jq '.commit.tree.sha')
          wait="${WAIT_SECONDS:-600}"
          deadline=$((SECONDS + wait))
          while true; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$BASE_SHA&per_page=20" --jq '.workflow_runs[].id')
            for run in $runs; do
              kept=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=coverage-baseline" --jq '[.artifacts[] | select(.expired | not)] | length')
              if [[ "$kept" -gt 0 ]]; then
                echo "Restoring the coverage baseline of base $BASE_SHA tree $tree from run $run"
                echo "id=$run" >> "$GITHUB_OUTPUT"
                echo "tree=$tree" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            if (( SECONDS >= deadline )); then
              echo "::error::No run kept a coverage baseline for base $BASE_SHA within $wait seconds."
              exit 1
            fi
            sleep "${POLL_SECONDS:-30}"
          done

      - name: Download the base tree's coverage baseline
        uses: actions/download-artifact@v4
        with:
          name: coverage-baseline
          path: ~/coverage-baseline
          run-id: ${{ steps.base-run.outputs.id }}
          repository: ${{ github.repository }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Hold the base tree
        env:
          BASE_TREE: ${{ steps.base-run.outputs.tree }}
        run: |
          tree=$(jq -r .tree ~/coverage-baseline/baseline.json)
          if [[ "$tree" != "$BASE_TREE" ]]; then
            echo "::error::The restored coverage baseline measured tree $tree, not the base tree $BASE_TREE."
            exit 1
          fi
          echo "Restored the coverage baseline of base tree $tree"

      - name: Publish the base tree's coverage baseline
        uses: actions/upload-artifact@v4
        with:
          name: queue-coverage-baseline
          path: ~/coverage-baseline/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  mutation:
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Select mutation tests before browser setup
        id: selection
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: python -m scripts.ci_mutation.browser --base "$BASE"

      - name: Install the browser that page tests drive
        id: browser
        if: steps.selection.outputs.browser == 'true'
        timeout-minutes: 2
        uses: ./.github/actions/browser-cache

      - name: Report browser setup failure
        if: failure() && steps.browser.outcome == 'failure'
        run: |
          echo "::error::Chromium setup failed or exceeded its two minute timeout; mutation tests cannot run."
          exit 1

      - name: Mutate changed Python files
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PYTHONUNBUFFERED: "1"
        run: python -m scripts.ci_mutation --base "$BASE" --budget 1080

      - name: Mutate dispatched Python files
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE: ${{ inputs.base }}
          PYTHONUNBUFFERED: "1"
        run: python -m scripts.ci_mutation --base "$BASE" --budget 1080

      - name: Upload complete mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: .mutation-gate/
          include-hidden-files: true
          retention-days: 7
