      - name: Save the flake history
        uses: actions/cache/save@v4
        with:
          path: ~/flake-history
          key: flake-history-${{ github.run_id }}-${{ github.run_attempt }}

  coverage-baseline:
    needs: [unit, gate-required]
    # Any measured dev push publishes: a skipped one leaves the next head with no base to grade against.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.unit.result == 'success' }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install "coverage>=7.4"

      - name: Resolve baseline trees
        id: tree
        env:
          PREVIOUS: ${{ github.event.before }}
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "previous=$(git rev-parse "$PREVIOUS^{tree}")" >> "$GITHUB_OUTPUT"

      - name: Restore measured coverage history
        uses: actions/cache/restore@v4
        with:
          path: ~/coverage-baseline
          key: coverage-baseline-${{ steps.tree.outputs.previous }}

      - name: Download this run's measured coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-3.12-*
          path: baseline-coverage

      - name: Compute the coverage baseline
        run: |
          python -m tests.coverage_baseline --shards 12 \
            --head-shards baseline-coverage \
            --out "$HOME/coverage-baseline/baseline.json" \
            --previous "$HOME/coverage-baseline/baseline.json"

      - name: Save the passed dev coverage baseline
        uses: actions/cache/save@v4
        with:
          path: ~/coverage-baseline
          key: coverage-baseline-${{ steps.tree.outputs.tree }}

      - name: Publish the passed dev coverage baseline
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: ~/coverage-baseline
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  queue-baseline:
    needs: [unit, reuse]
    # The record step refuses a missing 3.12 shard, so a run red only on another shard still publishes what later entries wait on.
    if: false
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install "coverage>=7.4"

      - name: Mint the token that reads the reused run
        if: needs.reuse.outputs.reused == 'true'
        id: reuse-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read

      - name: Download this run's shard coverage
        if: needs.reuse.outputs.reused != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-3.12-*
          path: .coverage-shards

      - name: Download the reused run's shard coverage
        if: needs.reuse.outputs.reused == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-3.12-*
          path: .coverage-shards
          run-id: ${{ needs.reuse.outputs.run }}
          repository: ${{ github.repository }}
          github-token: ${{ steps.reuse-token.outputs.token }}

      # Later queue entries wait on this upload, so it runs before Sonar and the gate rather than after them.
      - name: Record this run's coverage baseline
        run: python -m tests.coverage_baseline --shards 12 --head-shards .coverage-shards --out "$RUNNER_TEMP/own-baseline/baseline.json"

      - name: Publish this run's coverage baseline
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: ${{ runner.temp }}/own-baseline/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Stop when this run's unit shards failed
        if: needs.unit.result != 'success' && needs.reuse.outputs.reused != 'true'
        run: |
          echo "::error::A unit shard failed; this run published its 3.12 baseline for later queue entries and grades nothing."
          exit 1

      - name: Mint the tcc main ci App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read

      - name: Find the run that measured the base tree
        if: needs.reuse.outputs.reused != 'true'
        id: base-run
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_SHA" --jq '.commit.tree.sha')
          ancestry=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...dev" --jq .status)
          if [[ "$ancestry" != ahead && "$ancestry" != identical ]]; then
            ancestry=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$GITHUB_SHA" --jq .status)
          fi
          [[ "$ancestry" == ahead || "$ancestry" == identical ]] || { echo "::error::Base $BASE_SHA is outside dev and queue history."; exit 1; }
          while true; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$BASE_SHA&per_page=20" --jq '.workflow_runs[] | select((.event == "push" and .head_branch == "dev") or (.event == "merge_group" and (.head_branch | startswith("gh-readonly-queue/dev/")))) | "\(.id) \(.status) \(.event)"')
            if [[ -z "$runs" ]]; then
              echo "::error::No Tests run remains on base $BASE_SHA, so the queue entry was removed and this group is superseded."
              exit 1
            fi
            running=0
            while read -r run status event; do
              [[ -n "$run" ]] || continue
              [[ "$status" == completed ]] || running=1
              kept=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=coverage-baseline" --jq '[.artifacts[] | select(.expired | not)] | length')
              if [[ "$kept" -gt 0 ]]; then
                jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --paginate --jq '.jobs[]')
                if ! jq -s -e --arg event "$event" '
                  [.[] | select(.name | startswith("unit ("))] as $units |
                  (($units | length == 18 and all(.[]; .conclusion == "success")) or
                   ($event == "merge_group" and
                    all(.[] | select(.name == "unit" or (.name | startswith("unit ("))); .conclusion == "skipped") and
                    any(.[]; .name == "reuse" and .conclusion == "success" and
                      any(.steps[]?; .name == "Decide from protected code and record the tested tree" and .conclusion == "success")))) and
                  any(.[]; if $event == "push" then
                    .name == "coverage-baseline" and .conclusion == "success" and
                    any(.steps[]?; .name == "Compute the coverage baseline" and .conclusion == "success") and
                    any(.steps[]?; .name == "Publish the passed dev coverage baseline" and .conclusion == "success")
                  else
                    .name == "queue-baseline" and
                    any(.steps[]?; .name == "Record this run\u0027s coverage baseline" and .conclusion == "success") and
                    any(.steps[]?; .name == "Publish this run\u0027s coverage baseline" and .conclusion == "success")
                  end)' <<< "$jobs" > /dev/null; then
                  continue
                fi
                echo "Restoring the coverage baseline of base $BASE_SHA tree $tree from run $run"
                echo "id=$run" >> "$GITHUB_OUTPUT"
                echo "tree=$tree" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done <<< "$runs"
            if [[ "$running" == 0 ]]; then
              echo "::error::Every Tests run on base $BASE_SHA finished without a coverage baseline, so the queue entry it measured failed and this group is superseded."
              exit 1
            fi
            sleep "${POLL_SECONDS:-30}"
          done

      - name: Download the base tree's coverage baseline
        if: needs.reuse.outputs.reused != 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-baseline
          path: ~/coverage-baseline
          run-id: ${{ steps.base-run.outputs.id }}
          repository: ${{ github.repository }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Hold the base tree
        if: needs.reuse.outputs.reused != 'true'
        env:
          BASE_TREE: ${{ steps.base-run.outputs.tree }}
        run: |
          tree=$(jq -r .tree ~/coverage-baseline/baseline.json)
          if [[ "$tree" != "$BASE_TREE" ]]; then
            echo "::error::The restored coverage baseline measured tree $tree, not the base tree $BASE_TREE."
            exit 1
          fi
          echo "Restored the coverage baseline of base tree $tree"

      - name: Publish the base tree's coverage baseline
        if: needs.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: queue-coverage-baseline
          path: ~/coverage-baseline/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  mutation-plan:
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || needs.admission.result == 'success') && ((github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch') }}
    needs: [admission]
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
