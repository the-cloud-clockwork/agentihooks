name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reuse-command:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proof dependencies
        run: python -m pip install -e ".[dev,all]"
      - name: Exercise protected reuse command
        run: python -m pytest tests/test_ci_reuse.py -v --tb=short
