      # A failed cache download leaves the segment timer holding the step open until it fires.
      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The dashboard query step waits on both status files, so its setup overlaps the lint steps before it.
      - name: Prepare the dashboard query checker in the background
        env:
          CLICKHOUSE: swarm-columns-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # The checker's own environment carries antoncore's job pins without changing the lint interpreter.
          (python -m venv "$RUNNER_TEMP/columns" && "$RUNNER_TEMP/columns/bin/python" -m pip install --quiet PyYAML==6.0.3 jsonschema==4.25.1 orjson==3.13.0; echo $? > "$RUNNER_TEMP/columns-venv.status") > "$RUNNER_TEMP/columns-venv.log" 2>&1 < /dev/null &
          (docker run -d --rm --name "$CLICKHOUSE" clickhouse/clickhouse-server:24.1-alpine; echo $? > "$RUNNER_TEMP/clickhouse.status") > "$RUNNER_TEMP/clickhouse.log" 2>&1 < /dev/null &

      - name: Install ruff
        run: python -m pip install ruff==0.15.12

      - name: Install PyYAML
        run: python -m pip install "pyyaml>=6.0"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Check out the base revision
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && 'origin/dev' || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base "$BASE" HEAD)"

      - name: Check out the protected grader
        env:
          GRADER: ${{ github.event.pull_request.base.sha || needs.reuse.outputs.grader }}
        run: |
          git fetch --no-tags origin "$GRADER"
          git worktree add --detach "$RUNNER_TEMP/grader" FETCH_HEAD

      # Each control grades even after an earlier one is red, so one run reports every red control.
      - name: Lint check
        if: ${{ !cancelled() }}
        run: python -m ruff check hooks/ scripts/ tests/

      - name: Format check
        if: ${{ !cancelled() }}
        run: python -m ruff format --check hooks/ scripts/ tests/

      - name: Check every pull request job is a need of Gate Required
        if: ${{ !cancelled() }}
        run: python -m scripts.ci_wiring

      - name: Require wall clock markers on elapsed bounds
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/grader/scripts/ci_wall_clock.py" ]]; then
            cd "$RUNNER_TEMP/grader"
            python -m scripts.ci_wall_clock --root "$GITHUB_WORKSPACE"
          else
            python -m scripts.ci_wall_clock
          fi

      - name: Require trusted actors before private runner admission
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/grader/scripts/ci_runner_trust.py" ]]; then
            cd "$RUNNER_TEMP/grader"
            python -m scripts.gate_protected --head "$GITHUB_SHA"
          else
            python -m scripts.ci_runner_trust
          fi

      - name: Hold every job to a runner class
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/grader/scripts/ci_runner_classes.py" ]]; then
            cd "$RUNNER_TEMP/grader"
            python -m scripts.ci_runner_classes --root "$GITHUB_WORKSPACE"
          else
            python -m scripts.ci_runner_classes
          fi

      # dev's copy grades against the base's allowlist, so a pull request cannot loosen its own limits or allowlist.
      - name: Hold the size and complexity limits
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/grader/scripts/size_limits.py" ]]; then
            cd "$RUNNER_TEMP/grader"
            python -m scripts.size_limits --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE"
          else
            echo "::error::dev carries no scripts/size_limits.py, so nothing trusted can grade."
            exit 1
          fi

      # The base revision's copy grades, so a pull request cannot loosen its own audit.
      - name: Fail on known vulnerabilities new against the base
        if: ${{ !cancelled() }}
        run: |
          if [[ ! -f "$RUNNER_TEMP/base/scripts/ci_dependency_audit.py" ]]; then
            echo "::error::The base carries no scripts/ci_dependency_audit.py, so nothing trusted can grade."
            exit 1
          fi
          cd "$RUNNER_TEMP/base"
          python -m scripts.ci_dependency_audit --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE"

      - name: Mint the antoncore read token
        if: ${{ !cancelled() }}
        id: antoncore-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: antoncore
          permission-contents: read

      # antoncore dev owns the dashboard, its checker and the swarm NATS users, so the pull request head is only the data they grade.
      - name: Check out the antoncore dashboard column checker
        if: ${{ !cancelled() && steps.antoncore-token.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: the-cloud-clockwork/antoncore
          ref: dev
          path: .antoncore
          token: ${{ steps.antoncore-token.outputs.token }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/swarm_dashboard_columns.py
            stacks/observability/provisioning/dashboards/Swarm/
            k8s/values-overlays/agentihooks-swarm-nats/values.yaml
            k8s/values-overlays/agentihooks-swarm-nats/users.yaml
            k8s/values-overlays/agentihooks-swarm-nats/trust.yaml

      - name: Run every Swarm Ledger dashboard query against this head's metrics tables
        if: ${{ !cancelled() }}
        env:
          CLICKHOUSE: swarm-columns-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          trap 'docker rm -f "$CLICKHOUSE" >/dev/null 2>&1 || true' EXIT
          [[ -f .antoncore/scripts/swarm_dashboard_columns.py ]] || { echo "::error::The antoncore dashboard column checker could not be checked out."; exit 1; }
          git -C .antoncore rev-parse HEAD
          for _ in $(seq 180); do
            [[ -s "$RUNNER_TEMP/columns-venv.status" && -s "$RUNNER_TEMP/clickhouse.status" ]] && break
            sleep 1
          done
          [[ "$(cat "$RUNNER_TEMP/columns-venv.status" 2>/dev/null)" == 0 ]] || { cat "$RUNNER_TEMP/columns-venv.log" || true; echo "::error::The dashboard checker environment did not install."; exit 1; }
          [[ "$(cat "$RUNNER_TEMP/clickhouse.status" 2>/dev/null)" == 0 ]] || { cat "$RUNNER_TEMP/clickhouse.log" || true; echo "::error::The ClickHouse container did not start."; exit 1; }
          for _ in $(seq 60); do
            docker exec "$CLICKHOUSE" clickhouse-client -q 'SELECT 1' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$CLICKHOUSE" clickhouse-client -q 'SELECT 1' >/dev/null 2>&1 || { docker logs "$CLICKHOUSE"; echo "::error::ClickHouse never became ready."; exit 1; }
          status=0
          "$RUNNER_TEMP/columns/bin/python" .antoncore/scripts/swarm_dashboard_columns.py check --agentihooks "$GITHUB_WORKSPACE" --container "$CLICKHOUSE" 2> "$RUNNER_TEMP/columns.err" || status=$?
          cat "$RUNNER_TEMP/columns.err" >&2
          if (( status )); then
            missing=$(grep -oP "No module named '\K[^']+" "$RUNNER_TEMP/columns.err" | sort -u | paste -sd, - || true)
            [[ -z "$missing" ]] || echo "::error::The dashboard column checker imports $missing, which its environment lacks; pin it on the pip install line of the step that prepares the checker in the background."
            exit 1
          fi

      # The protected grader's copy grades this head's member grants against the antoncore dev hive user.
      - name: Hold the hive member NATS grants equal to the antoncore hive user
        if: ${{ !cancelled() }}
        run: |
          if [[ ! -f "$RUNNER_TEMP/grader/scripts/ci_hive_nats_grants.py" ]]; then
            echo "::error::The protected grader carries no scripts/ci_hive_nats_grants.py, so nothing trusted can grade the hive member grants."
            exit 1
          fi
          python -m pip install --quiet "cryptography>=42"
          cd "$RUNNER_TEMP/grader"
          python -m scripts.ci_hive_nats_grants --agentihooks "$GITHUB_WORKSPACE" --antoncore "$GITHUB_WORKSPACE/.antoncore"

      - name: Select artifact browser checks
        if: ${{ !cancelled() }}
        id: artifacts
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && 'origin/dev' || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: bash .github/actions/browser-cache/select-artifacts.sh

      - name: Install Playwright for artifact checks
        if: ${{ !cancelled() && steps.artifacts.outputs.browser == 'true' }}
        run: python -m pip install "playwright>=1.44.0" "orjson>=3.10"

      - name: Install the artifact viewer browser
        if: ${{ !cancelled() && steps.artifacts.outputs.browser == 'true' }}
        timeout-minutes: 6
        uses: ./.github/actions/browser-cache

      - name: Artifact sanity checks
        if: ${{ !cancelled() && steps.artifacts.outputs.browser == 'true' }}
        run: python -m scripts.swarm_ledger.artifact_sanity tests/fixtures/artifacts/*

  coverage-ratchet:
    needs: [select, unit, reuse]
    if: ${{ !cancelled() && needs.unit.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install "coverage>=7.4"

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-3.12-*
          path: head-coverage

      - name: Resolve the measured base tree
        id: base
        env:
          DISPATCHED_BASE: ${{ needs.select.outputs.base }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          base=$(git rev-parse "${QUEUE_BASE:-${DISPATCHED_BASE:-${PUSH_BEFORE:-HEAD^1}}}")
          echo "commit=$base" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse "$base^{tree}")" >> "$GITHUB_OUTPUT"

      - name: Restore the exact coverage baseline
        id: cached
        if: github.event_name != 'merge_group' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: ~/coverage-baseline
          key: coverage-baseline-${{ steps.base.outputs.tree }}
          restore-keys: coverage-baseline-

      - name: Grade from the newest dev baseline when the base run published none
        id: restored
        if: steps.cached.outputs.cache-hit != 'true' && steps.cached.outputs.cache-matched-key != ''
        run: |
          commit=$(jq -r '.commit // empty' ~/coverage-baseline/baseline.json)
          if [[ -n "$commit" ]] && git merge-base --is-ancestor "$commit" HEAD; then
            echo "Grading from the newest dev baseline at $commit; a newer push superseded the base run before it published."
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
          fi

      # The cache evicts a baseline seven days after its last read, and a dev commit the queue merged may get no push run,
      # so a miss falls back to the artifact any passed run of the base kept.
      - name: Mint the tcc main ci App token
        id: app-token
        if: steps.cached.outcome == 'success' && steps.cached.outputs.cache-hit != 'true' && steps.restored.outputs.commit == ''
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read

      - name: Find the run that published the base baseline
        id: base-run
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE: ${{ steps.base.outputs.commit }}
        run: |
          ancestry=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...dev" --jq .status)
          [[ "$ancestry" == ahead || "$ancestry" == identical ]] || { echo "::error::Base $BASE is outside dev history."; exit 1; }
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$BASE&per_page=20" --jq '.workflow_runs[] | select((.event == "push" and .head_branch == "dev") or (.event == "merge_group" and (.head_branch | startswith("gh-readonly-queue/dev/")))) | "\(.id) \(.event)"')
          while read -r run event; do
            [[ -n "$run" ]] || continue
            kept=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=coverage-baseline" --jq '[.artifacts[] | select(.expired | not)] | length')
            [[ "$kept" -gt 0 ]] || continue
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --paginate --jq '.jobs[]')
            if ! jq -s -e --arg event "$event" '
              [.[] | select(.name | startswith("unit ("))] as $units |
              (($units | length > 0 and all(.[]; .conclusion == "success") and
                (map(.name | capture("^unit \\((?<v>[^,]+), (?<s>[0-9]+)\\)$")? // {v: "", s: "0"} | .s |= tonumber) |
                  group_by(.v) | all(.[]; map(.s) | sort == [range(1; length + 1)]))) or
               ($event == "merge_group" and
                all(.[] | select(.name == "unit" or (.name | startswith("unit ("))); .conclusion == "skipped") and
                any(.[]; .name == "reuse" and .conclusion == "success" and
                  any(.steps[]?; .name == "Decide from protected code and record the tested tree" and .conclusion == "success")))) and
              any(.[]; if $event == "push" then
                .name == "coverage-baseline" and .conclusion == "success" and
                any(.steps[]?; .name == "Compute the coverage baseline" and .conclusion == "success") and
                any(.steps[]?; .name == "Publish the passed dev coverage baseline" and .conclusion == "success")
              else
                .name == "queue-baseline" and
                any(.steps[]?; .name == "Record this run\u0027s coverage baseline" and .conclusion == "success") and
                any(.steps[]?; .name == "Publish this run\u0027s coverage baseline" and .conclusion == "success")
              end)' <<< "$jobs" > /dev/null; then
              continue
            fi
            echo "Restoring the coverage baseline of base $BASE from measured run $run"
            echo "id=$run" >> "$GITHUB_OUTPUT"
            exit 0
          done <<< "$runs"
          echo "::error::No measured Tests run on base $BASE kept a live coverage-baseline artifact with successful measuring and publishing jobs."
          exit 1

      - name: Download the base baseline its run published
        if: steps.base-run.outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: coverage-baseline
          path: ~/coverage-baseline
          run-id: ${{ steps.base-run.outputs.id }}
          repository: ${{ github.repository }}
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Download the queue base coverage baseline
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: queue-coverage-baseline
          path: ~/coverage-baseline

      - name: Hold every line the base ran
        env:
          BASE: ${{ steps.restored.outputs.commit || steps.base.outputs.commit }}
        run: |
          base="$BASE"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          if [[ ! -f "$RUNNER_TEMP/base/tests/coverage_ratchet.py" ]]; then
            echo "::error::The base carries no tests/coverage_ratchet.py, so nothing trusted can grade."
            exit 1
          fi
          cd "$RUNNER_TEMP/base"
          python -m tests.coverage_ratchet --base "$base" --head "$GITHUB_WORKSPACE" --shards 20 \
            --head-shards "$GITHUB_WORKSPACE/head-coverage" --out "$GITHUB_WORKSPACE/coverage-ratchet" \
            --base-baseline "$HOME/coverage-baseline/baseline.json"

      - name: Upload the coverage ratchet report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ratchet
          path: coverage-ratchet/report.txt
          retention-days: 7
          overwrite: true

  # Reports only: it fails when it cannot read the run, never because a stage ran slow.
  stage-budget:
    needs: [select, split, unit, unit-lost, unit-rerun, unit-selected, shard-check, test-count, coverage-ratchet, lint, docs, sonar, mutation-plan, mutation-stats, mutation, swarm-image, worker-image, brain-smoke, writer-lock, kind-due, helm-kind, semgrep, ledger-load, reuse]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Mint the tcc main ci App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-contents: read

      - name: Read this attempt's jobs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/run.json"
          python3 -m scripts.ci_budget.jobs "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" > "$RUNNER_TEMP/jobs.jsonl"

      - name: Report each stage's wall time against its budget
        run: python3 -m scripts.ci_budget --run "$RUNNER_TEMP/run.json" --jobs "$RUNNER_TEMP/jobs.jsonl"

  queue-fail-fast:
    outputs:
      failed: ${{ steps.watch.outputs.failed }}
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || needs.admission.result == 'success') && (github.event_name != 'merge_group' || needs.reuse.outputs.reused != 'true') && github.event_name != 'pull_request' }}
    needs: [reuse, admission]
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'merge_group'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Mint the tcc main ci App token
        id: app-token
        if: github.event_name == 'merge_group'
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read
          permission-pull-requests: read

      - name: Watch for the first failed graded job
        id: watch
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          misses=0
          queue_misses=0
          while true; do
            poll=15
            if queue_head=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/${GITHUB_REF#refs/}" --jq ".[] | select(.ref == \"$GITHUB_REF\") | .object.sha"); then
              queue_misses=0
              if [[ "$queue_head" != "$GITHUB_SHA" ]]; then
                record=$(python3 -m scripts.ci_queue_rebuild "$queue_head") || record="record unavailable"
                echo "failed=queue group is no longer current ($record)" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              if (( ++queue_misses == 10 )); then
                echo "::error::Ten reads of this queue reference failed in a row; queue liveness is unknown."
                exit 1
              fi
              sleep 15
              continue
            fi
            if python3 -m scripts.ci_budget.jobs "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" > "$RUNNER_TEMP/jobs.jsonl"; then
              misses=0
              verdict=$(python3 -m scripts.ci_queue_fail_fast "$RUNNER_TEMP/jobs.jsonl" --repo "$GITHUB_REPOSITORY" --seen "$RUNNER_TEMP/shard-logs.json") || { echo "::warning::The shard log check failed; this poll waits."; sleep 15; continue; }
              if [[ "$verdict" != wait ]]; then
                echo "$verdict" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if jq -se 'any(.[]; .name | startswith("unit (")) and all(.[]; (.name | startswith("unit (") | not) or .status == "completed")' "$RUNNER_TEMP/jobs.jsonl"; then
                poll=5
              fi
            elif (( ++misses == 10 )); then
              echo "::warning::Ten reads of this run's jobs failed in a row; the entry waits for Gate Required."
              exit 0
            fi
            sleep "$poll"
          done

      - name: Cancel this queue run so the queue drops the entry
        if: steps.watch.outputs.failed != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FAILED: ${{ steps.watch.outputs.failed }}
        run: |
          echo "::error::$FAILED failed, so Gate Required cannot pass; cancelling this queue run."
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"

  gate-required:
    name: Gate — Required
    needs: [select, split, unit, unit-lost, unit-rerun, unit-selected, shard-check, test-count, coverage-ratchet, lint, docs, sonar, mutation-plan, mutation-stats, mutation, swarm-image, worker-image, brain-smoke, writer-lock, kind-due, helm-kind, semgrep, ledger-load, stage-budget, reuse, queue-fail-fast]
    if: ${{ always() }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every gate to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          MUTATION: ${{ (github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch' }}
          KIND: ${{ needs.kind-due.outputs.due }}
          EVENT: ${{ github.event_name }}
          REUSED: ${{ needs.reuse.outputs.reused }}
          INLINE: ${{ needs.mutation-plan.outputs.shards == '[0]' && needs.mutation-plan.outputs.stats_parts == '[0]' }}
        run: |
          if [[ "${EVENT:-}" == merge_group || "${EVENT:-}" == pull_request ]]; then
            if ! jq -e --arg event "$EVENT" --arg mutation "$MUTATION" --arg inline "${INLINE:-}" '
              (.select.outputs.scope // "") as $scope
              | (if $event == "merge_group" then
                ["select", "split", "shard-check", "test-count"]
              else
                ["select", "test-count", "lint", "docs", "semgrep", "sonar", "writer-lock"]
                + (if $scope == "full" then ["split", "unit", "shard-check"] elif $scope == "selected" then ["unit-selected"] else [] end)
                + (if $mutation == "true" then ["mutation-plan", "mutation-stats"] + (if $inline == "true" then [] else ["mutation"] end) else [] end)
              end) as $required
              | . as $jobs
              | ($event == "merge_group" or (($mutation == "true" or $mutation == "false") and ($scope == "full" or $scope == "selected" or $scope == "none")))
                and ($event != "merge_group" or has("queue-fail-fast"))
                and ($event != "merge_group" or ([$jobs.unit.result, $jobs."unit-lost".result, $jobs."unit-rerun".result] | IN(["success", "skipped", "skipped"], ["failure", "success", "success"], ["cancelled", "success", "success"])))
                and all($required[]; . as $job | $jobs[$job].result == "success")
                and all(to_entries[]; .key as $job |
                  if $required | index($job) then .value.result == "success" elif $event == "merge_group" and $job == "queue-fail-fast" then (.value.result | IN("success", "failure", "cancelled")) and (.value.outputs.failed // "") == "" elif $event == "merge_group" and ($job | IN("unit", "unit-lost", "unit-rerun")) then true else .value.result == "skipped" end)
            ' <<< "$NEEDS"; then
              echo "::error::Every gate required for this event must succeed and other gates must be skipped."
              exit 1
            fi
            exit 0
          fi
          echo "$NEEDS"
          if [[ "${REUSED:-false}" == true ]]; then
            echo "::error::A push or dispatch run never reuses a queue result."
            exit 1
          fi
          if ! jq -e --arg event "${EVENT:-}" --arg mutation "$MUTATION" --arg inline "${INLINE:-}" --arg kind "${KIND:-}" '(.select.outputs.scope // "") as $scope | ($event != "pull_request" or $scope != "selected" or ."unit-selected".result == "success") and all(to_entries[]; .value.result == "success" or ((.key == "mutation" or .key == "mutation-plan" or .key == "mutation-stats") and .value.result == "skipped" and $mutation == "false") or (.key == "mutation" and .value.result == "skipped" and $inline == "true") or (.key == "helm-kind" and .value.result == "skipped" and $kind == "false") or ((.key == "unit-lost" or .key == "unit-rerun") and .value.result == "skipped" and $event != "merge_group") or (.key == "queue-baseline" and .value.result == "skipped" and $event != "merge_group") or ((.key == "lint" or .key == "semgrep" or .key == "test-count") and .value.result == "skipped" and $event == "push") or ((.key == "split" or .key == "unit" or .key == "shard-check" or .key == "coverage-ratchet") and .value.result == "skipped" and $event == "pull_request" and ($scope == "selected" or $scope == "none")) or (.key == "unit-selected" and .value.result == "skipped" and ($event != "pull_request" or $scope == "full" or $scope == "none")))' <<< "$NEEDS"; then
            echo "::error::Every required gate must succeed."
            exit 1
          fi

  test-summary:
    needs: [unit, unit-selected]
    if: ${{ always() }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: ${{ always() }}
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci_gate_summary.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download this run's test durations
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          pattern: durations-3.*
          path: test-reports

      - name: Download this run's test flakes
        if: ${{ always() }}
        uses: actions/download-artifact@v4
        with:
          pattern: flakes-3.*
          path: test-reports

      - name: Summarize this run's tests
        if: ${{ always() }}
        shell: bash
        run: python3 "$GITHUB_WORKSPACE/scripts/ci_gate_summary.py" test-reports | tee -a "$GITHUB_STEP_SUMMARY"

  refresh-durations:
    needs: [unit, lint, shard-check]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && (github.event_name == 'merge_group' && 'anton-oss-queue' || 'anton-oss') || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Install duration collection dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Restore recent shard durations
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: ~/durations-samples
          key: durations-samples-${{ github.sha }}
          restore-keys: durations-samples-

      - name: Download this run's shard durations
        uses: actions/download-artifact@v4
        with:
          pattern: durations-3.*
          path: ~/durations-samples/${{ github.run_id }}

      - name: Refresh measured durations
        run: |
          python -m tests.refresh_durations --samples ~/durations-samples --ci-run "$GITHUB_RUN_ID" --ci 5
          test -s .test_durations || { echo "::error::refresh durations: wrote no .test_durations"; exit 1; }

      - name: Publish merged durations
        uses: ./.github/actions/retry-upload
        with:
          name: durations-merged
          path: .test_durations*
          include-hidden-files: true
          retention-days: 14

      - name: Stage merged durations for the cache
        run: mkdir -p ~/dev-durations && cp .test_durations* ~/dev-durations/

      - name: Save merged durations to the cache
        uses: actions/cache/save@v4
        with:
          path: ~/dev-durations
          key: durations-merged-${{ github.sha }}

      - name: Save recent shard durations
        uses: actions/cache/save@v4
        with:
          path: ~/durations-samples
          key: durations-samples-${{ github.sha }}

  flake-budget:
    needs: [unit]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the flake history
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: ~/flake-history
          key: flake-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: flake-history-

      - name: Download this run's flake reports
        uses: actions/download-artifact@v4
        with:
          pattern: flakes-3.*
          path: ~/flake-reports

      - name: Count flaky tests over seven days
        shell: bash
        run: python -m tests.flake_budget --history ~/flake-history/history.jsonl --reports ~/flake-reports --out flake-budget.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the flake budget
        uses: actions/upload-artifact@v4
        with:
          name: flake-budget
          path: flake-budget.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Save the flake history
        uses: actions/cache/save@v4
        with:
          path: ~/flake-history
          key: flake-history-${{ github.run_id }}-${{ github.run_attempt }}

  coverage-baseline:
    needs: [unit, coverage-ratchet]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.unit.result == 'success' && needs.coverage-ratchet.result == 'success' }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install "coverage>=7.4"

      - name: Resolve baseline trees
        id: tree
        env:
          PREVIOUS: ${{ github.event.before }}
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "previous=$(git rev-parse "$PREVIOUS^{tree}")" >> "$GITHUB_OUTPUT"

      - name: Restore measured coverage history
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: ~/coverage-baseline
          key: coverage-baseline-${{ steps.tree.outputs.previous }}
          restore-keys: coverage-baseline-

      - name: Download this run's measured coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-3.12-*
          path: baseline-coverage

      - name: Compute the coverage baseline
        run: |
          python -m tests.coverage_baseline --shards 20 \
            --head-shards baseline-coverage \
            --out "$HOME/coverage-baseline/baseline.json" \
            --previous "$HOME/coverage-baseline/baseline.json"

      - name: Save the passed dev coverage baseline
        uses: actions/cache/save@v4
        with:
          path: ~/coverage-baseline
          key: coverage-baseline-${{ steps.tree.outputs.tree }}

      - name: Publish the passed dev coverage baseline
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: ~/coverage-baseline
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Download the test dependency manifest
        if: needs.gate-required.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dep-manifest
          path: dep-manifest

      - name: Save the dev test dependency manifest
        if: needs.gate-required.result == 'success'
        uses: actions/cache/save@v4
        with:
          path: dep-manifest
          key: dep-manifest-${{ github.sha }}

  mutation-plan:
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || needs.admission.result == 'success') && ((github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch') }}
    needs: [admission]
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.reuse.outputs.reused == 'true' && '[0]' || steps.plan.outputs.shards }}
      stats_parts: ${{ steps.reuse.outputs.reused == 'true' && '[0]' || steps.plan.outputs.stats_parts }}
      bases: ${{ steps.plan.outputs.bases }}
      browser: ${{ steps.plan.outputs.browser }}
      reused: ${{ steps.reuse.outputs.reused || 'false' }}
      forwarded: ${{ (steps.reuse.outputs.reused == 'true' || steps.plan.outputs.changed == '0') && 'true' || 'false' }}
      selection: ${{ steps.contract.outputs.selection || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      # An earlier branch counts as a base only once its push preflight mutated it green; the lookup runs on the App's quota.
      - name: Mint the tcc main ci App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read

      # The protected copy gives the reuse verdict and refuses a head whose preflight producer differs from the grader's.
      - name: Check out the protected grader
        if: github.event_name == 'pull_request'
        env:
          GRADER: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$GRADER"
          git worktree add --detach "$RUNNER_TEMP/grader" FETCH_HEAD

      - name: Reuse the branch preflight report graded on this head and base
        id: reuse
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GRADER: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base origin/dev "$HEAD_SHA")
          PYTHONPATH="$RUNNER_TEMP/grader" python -P -m scripts.ci_mutation.reuse "$BRANCH" "$GITHUB_RUN_ID" \
            --head "$HEAD_SHA" --base "$base" --grader "$GRADER"

      - name: Take the helper scripts from the workflow revision
        if: steps.reuse.outputs.reused != 'true'
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/workflow"
          git archive "$GITHUB_SHA" .github/scripts | tar -x -C "$RUNNER_TEMP/workflow"

      - name: Install dependencies
        if: steps.reuse.outputs.reused != 'true'
        run: bash "$RUNNER_TEMP/workflow/.github/scripts/pypi-retry.sh" "Install dependencies" -- uv pip install --system "mutmut==3.6.0" "pytest>=8.0" "pyyaml>=6.0" "tomlkit>=0.12"

      - name: Size mutation shards from stored timings
        id: plan
        if: steps.reuse.outputs.reused != 'true'
        env:
          BASE: ${{ inputs.base || 'origin/dev' }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MUTATION_SHARD_CPU_QUOTA: "3"
        run: python -m scripts.ci_mutation.plan --base "$BASE" --repository "$GITHUB_REPOSITORY"

      # The workflow comes from the merge ref, so a head whose planner predates the selection writes none.
      - name: Check the planned selection contract
        id: contract
        if: steps.reuse.outputs.reused != 'true'
        run: |
          if [[ ! -e .mutation-selection.json ]]; then
            echo "This head's planner predates the planned test selection, so mutation selects matching and importing test modules as before." >> "$GITHUB_STEP_SUMMARY"
            echo "selection=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -c 'import json, sys; s = json.load(open(".mutation-selection.json")); sys.exit(not (isinstance(s, dict) and all(isinstance(v, list) and all(isinstance(t, str) for t in v) for v in s.values())))' \
            || { echo "::error::.mutation-selection.json is malformed."; exit 1; }
          echo "selection=true" >> "$GITHUB_OUTPUT"

      - name: Upload planned mutation test selection
        if: steps.reuse.outputs.reused != 'true' && steps.contract.outputs.selection == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-selection
          path: .mutation-selection.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Grade the empty change set
        if: steps.reuse.outputs.reused != 'true' && steps.plan.outputs.changed == '0'
        env:
          BASES: ${{ steps.plan.outputs.bases }}
        run: python -m scripts.ci_mutation --bases "$BASES" --budget 1080

      - name: Forward the reused or empty mutation report
        if: always() && (steps.reuse.outputs.reused == 'true' || steps.plan.outputs.changed == '0')
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-0
          path: .mutation-gate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  mutation-stats:
    needs: [mutation-plan, admission]
    if: ${{ !cancelled() && needs.mutation-plan.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.admission.result == 'success') && ((github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-batch' || 'ubuntu-latest' }}
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.mutation-plan.outputs.stats_parts) }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
      MUTATION_STATS_CACHE: ${{ github.workspace }}/.mutation-stats-cache
      MUTATION_STATS_SEED_BASE: origin/dev
      MUTATION_STATS_EXPORT: ${{ github.workspace }}/.mutation-stats/cache
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        if: needs.mutation-plan.outputs.forwarded != 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        if: needs.mutation-plan.outputs.forwarded != 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        if: needs.mutation-plan.outputs.forwarded != 'true'
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Take the helper scripts from the workflow revision
        if: needs.mutation-plan.outputs.forwarded != 'true'
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/workflow"
          git archive "$GITHUB_SHA" .github/scripts | tar -x -C "$RUNNER_TEMP/workflow"

      - name: Take the local actions from the workflow revision
        if: needs.mutation-plan.outputs.forwarded != 'true'
        run: |
          mkdir -p .workflow-revision
          git archive "$GITHUB_SHA" .github/actions | tar -x -C .workflow-revision

      - name: Install dependencies
        if: needs.mutation-plan.outputs.forwarded != 'true'
        run: bash "$RUNNER_TEMP/workflow/.github/scripts/pypi-retry.sh" "Install dependencies" -- uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Download planned mutation test selection
        if: needs.mutation-plan.outputs.forwarded != 'true' && needs.mutation-plan.outputs.selection == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mutation-selection

      - name: Install the pinned nats server for the bus backend tests
        if: needs.mutation-plan.outputs.forwarded != 'true'
        timeout-minutes: 3
        uses: ./.workflow-revision/.github/actions/nats-server

      - name: Install the browser that page tests drive
        id: browser
        if: needs.mutation-plan.outputs.browser == 'true'
        timeout-minutes: 6
        uses: ./.workflow-revision/.github/actions/browser-cache

      - name: Report browser setup failure
        if: failure() && steps.browser.outcome == 'failure'
        run: |
          echo "::error::Chromium setup failed or exceeded its six minute timeout; mutation tests cannot run."
          exit 1

      - name: Restore compatible test stats
        if: needs.mutation-plan.outputs.forwarded != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .mutation-stats-cache
          key: mutation-test-stats-v1-${{ runner.os }}-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: mutation-test-stats-v1-${{ runner.os }}-${{ matrix.part }}-

      - name: Collect one stats part for every mutation shard
        if: needs.mutation-plan.outputs.forwarded != 'true'
        env:
          BASES: ${{ needs.mutation-plan.outputs.bases }}
          PYTHONUNBUFFERED: "1"
          PART: ${{ matrix.part }}
          PARTS: ${{ strategy.job-total }}
        run: mkdir -p .mutation-stats && touch ".mutation-stats/collected-$PART" && python -m scripts.ci_mutation --bases "$BASES" --budget 1080 --stats .mutation-stats --stats-part "$PART" --stats-parts "$PARTS"

      - name: Store successful test stats
        if: needs.mutation-plan.outputs.forwarded != 'true'
        uses: actions/cache/save@v4
        with:
          path: .mutation-stats-cache
          key: mutation-test-stats-v1-${{ runner.os }}-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload mutation stats part
        if: needs.mutation-plan.outputs.forwarded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-stats-${{ matrix.part }}
          path: .mutation-stats/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload stats evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-evidence-stats-${{ matrix.part }}
          path: .mutation-gate/
          include-hidden-files: true
          retention-days: 7
          overwrite: true

      - name: Mutate the only shard in the statistics job
        id: mutate
        if: needs.mutation-plan.outputs.shards == '[0]' && needs.mutation-plan.outputs.stats_parts == '[0]' && needs.mutation-plan.outputs.forwarded != 'true'
        env:
          BASES: ${{ needs.mutation-plan.outputs.bases }}
          PYTHONUNBUFFERED: "1"
        run: python -m scripts.ci_mutation --bases "$BASES" --budget 1080 --shard 0 --shards 1 --stats .mutation-stats

      - name: Upload complete inline mutation evidence
        if: always() && steps.mutate.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-0
          path: ${{ job.status == 'success' && '.mutation-gate/report.json' || '.mutation-gate/' }}
          include-hidden-files: true
          retention-days: 7

  mutation:
    needs: [mutation-plan, mutation-stats, admission]
    if: ${{ !cancelled() && needs.mutation-plan.result == 'success' && (needs.mutation-plan.outputs.shards != '[0]' || needs.mutation-plan.outputs.stats_parts != '[0]') && needs.mutation-stats.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.admission.result == 'success') && ((github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-batch' || 'ubuntu-latest' }}
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
        if: needs.mutation-plan.outputs.forwarded != 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        if: needs.mutation-plan.outputs.forwarded != 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        if: needs.mutation-plan.outputs.forwarded != 'true'
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Take the helper scripts from the workflow revision
        if: needs.mutation-plan.outputs.forwarded != 'true'
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/workflow"
          git archive "$GITHUB_SHA" .github/scripts | tar -x -C "$RUNNER_TEMP/workflow"

      - name: Take the local actions from the workflow revision
        if: needs.mutation-plan.outputs.forwarded != 'true'
        run: |
          mkdir -p .workflow-revision
          git archive "$GITHUB_SHA" .github/actions | tar -x -C .workflow-revision

      - name: Install dependencies
        if: needs.mutation-plan.outputs.forwarded != 'true'
        run: bash "$RUNNER_TEMP/workflow/.github/scripts/pypi-retry.sh" "Install dependencies" -- uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Download planned mutation test selection
        if: needs.mutation-plan.outputs.forwarded != 'true' && needs.mutation-plan.outputs.selection == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mutation-selection

      - name: Install the pinned nats server for the bus backend tests
        if: needs.mutation-plan.outputs.forwarded != 'true'
        timeout-minutes: 3
        uses: ./.workflow-revision/.github/actions/nats-server

      - name: Install the browser that page tests drive
        id: browser
        if: needs.mutation-plan.outputs.browser == 'true'
        timeout-minutes: 6
        uses: ./.workflow-revision/.github/actions/browser-cache

      - name: Report browser setup failure
        if: failure() && steps.browser.outcome == 'failure'
        run: |
          echo "::error::Chromium setup failed or exceeded its six minute timeout; mutation tests cannot run."
          exit 1

      - name: Download the shared mutation stats
        if: needs.mutation-plan.outputs.forwarded != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-stats-*
          path: .mutation-stats
          merge-multiple: true

      - name: Mutate changed Python files
        if: github.event_name == 'pull_request' && needs.mutation-plan.outputs.forwarded != 'true'
        env:
          BASES: ${{ needs.mutation-plan.outputs.bases }}
          PYTHONUNBUFFERED: "1"
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: python -m scripts.ci_mutation --bases "$BASES" --budget 1080 --shard "$SHARD" --shards "$SHARDS" --stats .mutation-stats

      - name: Mutate dispatched Python files
        if: github.event_name == 'workflow_dispatch' && needs.mutation-plan.outputs.forwarded != 'true'
        env:
          BASES: ${{ needs.mutation-plan.outputs.bases }}
          PYTHONUNBUFFERED: "1"
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: python -m scripts.ci_mutation --bases "$BASES" --budget 1080 --shard "$SHARD" --shards "$SHARDS" --stats .mutation-stats

      - name: Upload complete mutation evidence
        if: always() && needs.mutation-plan.outputs.forwarded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: ${{ job.status == 'success' && '.mutation-gate/report.json' || '.mutation-gate/' }}
          include-hidden-files: true
          retention-days: 7
