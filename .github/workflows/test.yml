          include-hidden-files: true
          retention-days: 7
          overwrite: true

  mutation:
    needs: [mutation-plan, mutation-stats, admission]
    if: ${{ !cancelled() && needs.mutation-plan.result == 'success' && needs.mutation-stats.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.admission.result == 'success') && ((github.event_name == 'pull_request' && github.base_ref == 'dev') || github.event_name == 'workflow_dispatch') }}
