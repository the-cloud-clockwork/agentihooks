name: brain-smoke

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      otel-collector:
        image: otel/opentelemetry-collector-contrib:0.96.0
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports:
          - 4318:4318
          - 4317:4317
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          # Published sha256 of uv-x86_64-unknown-linux-gnu.tar.gz; this setup-uv release knows checksums only up to 0.12.17.
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Create venv and install
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[all]"

      - name: Seed brain-feed fixtures
        run: |
          mkdir -p $HOME/.agentihooks/brain-feed
          cat > $HOME/.agentihooks/brain-feed/hot-arcs.md <<'EOF'
          ---
          id: ci-test-hot-arcs
          title: Active Hot Arcs
          priority: 5
          ttl: 3600
          severity: info
          ---
          ## Hot Arcs — CI smoke
          | Arc | Heat | Region | Title |
          |---|---|---|---|
          | [[test-arc]] | 5 | bridge | CI smoke test arc |
          EOF

      - name: Run brain-smoke
        env:
          OTEL_HOOKS_ENABLED: 'true'
          OTEL_EXPORTER_OTLP_ENDPOINT: 'http://localhost:4318'
          OTEL_EXPORTER_OTLP_PROTOCOL: 'http/protobuf'
          BRAIN_WRITER_ENABLED: 'true'
          BRAIN_ENABLED: 'true'
          LOG_HOOKS: 'true'
        run: |
          ./scripts/brain-smoke --no-color
