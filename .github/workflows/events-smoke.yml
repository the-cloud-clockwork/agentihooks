name: Events launch smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Events launch smoke' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('events-smoke-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Events launch smoke' && 'max' || 'single' }}

jobs:
  smoke:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && (github.event_name == 'merge_group' && 'anton-oss-queue' || 'anton-oss') || 'ubuntu-latest' }}
    timeout-minutes: 10
    services:
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 30
    env:
      AGENTIHOOKS_EVENTS_SMOKE: "1"
      AGENTIHOOKS_EVENTS_SMOKE_REDIS_URL: redis://127.0.0.1:6381/0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false

      - name: Install dependencies
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AGENTIHOOKS: 0.dev${{ github.run_number }}
        run: uv pip install --system --constraint .github/test-requirements.lock --excludes .github/test-excludes.txt -e '.[dev,all]'

      - name: Install the pinned nats server
        timeout-minutes: 3
        uses: ./.github/actions/nats-server

      - name: Run the hub, hive spokes and scratch swarm on the events engine
        shell: bash
        run: |
          python -m pytest tests/events_smoke --confcutdir=tests/events_smoke -n 0 -v -rs --tb=short | tee "$RUNNER_TEMP/events-smoke.log"
          grep -q ' 6 passed' "$RUNNER_TEMP/events-smoke.log" || { echo '::error::The six events launch seams did not all run.'; exit 1; }
