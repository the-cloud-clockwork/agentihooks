name: Dev test count records
on:
  push:
    branches:
    - dev
concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
jobs:
  count-record:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    continue-on-error: true
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
      == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor)
      && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name
      == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]'
      && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'),
      github.triggering_actor))) && (github.event_name == 'merge_group' && 'anton-oss-queue' || 'anton-oss') || 'ubuntu-latest'
      }}
    timeout-minutes: 6
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
    - name: Set up Python ${{ matrix.python-version }}
      if: env.UNIT_SOURCE == ''
      id: python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Stamp the day
      if: env.UNIT_SOURCE == ''
      id: day
      run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
    - name: Restore the test environment
      if: env.UNIT_SOURCE == ''
      id: venv
      uses: actions/cache/restore@v6
      with:
        path: ~/venv
        key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ steps.day.outputs.date }}-${{ hashFiles('pyproject.toml',
          '.github/test-excludes.txt') }}-${{ hashFiles('.github/test-constraints.txt') }}
    - name: Set up uv
      if: env.UNIT_SOURCE == '' && steps.venv.outputs.cache-hit != 'true'
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: 0.12.23
        checksum: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
        enable-cache: false
    - name: Install dependencies
      if: env.UNIT_SOURCE == '' && steps.venv.outputs.cache-hit != 'true'
      env:
        PYTHON_PATH: ${{ steps.python.outputs.python-path }}
      run: 'uv venv --python "$PYTHON_PATH" "$HOME/venv"

        uv pip install --python "$HOME/venv/bin/python" --excludes .github/test-excludes.txt -e ".[dev,all]"

        '
    - name: Save the test environment from dev
      if: env.UNIT_SOURCE == '' && steps.venv.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref ==
        'refs/heads/dev'
      uses: actions/cache/save@v6
      with:
        path: ~/venv
        key: ${{ steps.venv.outputs.cache-primary-key }}
    - name: Use the test environment
      if: env.UNIT_SOURCE == ''
      run: echo "$HOME/venv/bin" >> "$GITHUB_PATH"
    - name: Record the suite count for later bases
      continue-on-error: true
      timeout-minutes: 2
      run: 'git worktree add --detach "$RUNNER_TEMP/base" HEAD

        mkdir -p "$RUNNER_TEMP/count-record"

        cd "$RUNNER_TEMP/base"

        python -m tests.count_floor --record "$RUNNER_TEMP/count-record/record.json" --head "$RUNNER_TEMP/base"

        '
    - name: Upload the suite count record
      uses: actions/upload-artifact@v7
      with:
        name: count-record-${{ matrix.python-version }}
        path: ${{ runner.temp }}/count-record/record.json
        if-no-files-found: warn
        retention-days: 7
        overwrite: true
