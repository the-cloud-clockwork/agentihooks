name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Tag and build in the CI checkout without pushing or creating a release"
        type: boolean
        default: false
      publish_pypi:
        description: "Publish from the new tag. The release dance leaves this off and publishes from main after its pull request merges"
        type: boolean
        default: false

concurrency:
  group: release-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the integration branch for a real release
        if: ${{ !inputs.dry_run }}
        run: test "$GITHUB_REF" = refs/heads/dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: bash scripts/ci_release.sh version

      - name: Tag the release
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: bash scripts/ci_release.sh tag "$GITHUB_SHA" "$NEXT"

      - name: Verify the tagged package version
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: bash scripts/ci_release.sh verify "$GITHUB_SHA" "$NEXT"

      - name: Push the tag
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: git push origin "refs/tags/v$NEXT"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          bash scripts/ci_release.sh notes "$GITHUB_SHA" "$NEXT" "$RUNNER_TEMP/notes.md"
          gh release create "v$NEXT" --repo "$GITHUB_REPOSITORY" --title "v$NEXT" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --latest

      - name: Dispatch publish-pypi at the new tag
        if: ${{ !inputs.dry_run && inputs.publish_pypi }}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: gh workflow run publish-pypi.yml --repo "$GITHUB_REPOSITORY" --ref "v$NEXT"
