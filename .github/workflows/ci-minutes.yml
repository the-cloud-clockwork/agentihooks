name: CI runner minutes

# Measures Anton runner minutes per merged pull request against the daily Oracle node budget.
on:
  workflow_dispatch:
    inputs:
      until:
        description: UTC end of the window as YYYY-MM-DDTHH:MM:SSZ, default now
        required: false
      hours:
        description: Window length in hours
        required: false
        default: "24"
      stats_prs:
        description: Measure mutation stats across this many merged pull requests instead
        required: false
        default: "0"
      since:
        description: Only include pull requests merged after this UTC timestamp
        required: false
      merge_path:
        description: Count the merge path and class each head Tests run by the push before it instead
        required: false
        default: "false"
  push:
    branches: [diffcheck/ci-minutes]

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The swarm App's hourly limit belongs to hives, launch checks and merge queueing.
      - name: Mint the TCC Main CI Actions read token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-metadata: read
          permission-pull-requests: read
      - name: Restore the jobs of completed runs read before
        uses: actions/cache/restore@v4
        with:
          path: ci-minutes-jobs.json
          key: ci-minutes-jobs-${{ github.run_id }}
          restore-keys: ci-minutes-jobs-
      - name: Count the merge path and head push causes
        if: inputs.merge_path == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UNTIL: ${{ inputs.until }}
          HOURS: ${{ inputs.hours || '24' }}
        run: python -m scripts.swarm.merge_path --hours "$HOURS" ${UNTIL:+--until "$UNTIL"} --out ci-minutes.json
      - name: Measure runner minutes per merged pull request
        if: inputs.merge_path != 'true' && (inputs.stats_prs == '0' || inputs.stats_prs == '')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UNTIL: ${{ inputs.until }}
          HOURS: ${{ inputs.hours || '24' }}
        run: python -m scripts.ci_minutes --repo "$GITHUB_REPOSITORY" --hours "$HOURS" ${UNTIL:+--until "$UNTIL"} --cache ci-minutes-jobs.json
      - name: Measure mutation stats per merged pull request
        if: inputs.stats_prs != '0' && inputs.stats_prs != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          UNTIL: ${{ inputs.until }}
          SINCE: ${{ inputs.since }}
          COUNT: ${{ inputs.stats_prs }}
        run: python -m scripts.ci_stats_minutes --repo "$GITHUB_REPOSITORY" --count "$COUNT" --until "$UNTIL" --since "$SINCE" --out ci-minutes.json
      - name: Keep the jobs of completed runs for the next dispatch
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: ci-minutes-jobs.json
          key: ci-minutes-jobs-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the measurement
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-minutes
          path: ci-minutes.json
          if-no-files-found: warn
          retention-days: 30
