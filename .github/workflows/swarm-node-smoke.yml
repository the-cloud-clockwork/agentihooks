name: Swarm worker image smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - docker/swarm-node/**
      - scripts/swarm_v2/worker_image.py
      - profiles/**
      - pyproject.toml
      - .github/workflows/swarm-node-smoke.yml
  push:
    branches: [dev]
    paths:
      - docker/swarm-node/**
      - scripts/swarm_v2/worker_image.py
      - profiles/**
      - pyproject.toml
      - .github/workflows/swarm-node-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prove clean worker builds and offline startup
        run: bash docker/swarm-node/smoke.sh "$HOME/scratchpad/worker-image-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-worker-image-evidence
          path: ~/scratchpad/worker-image-evidence
