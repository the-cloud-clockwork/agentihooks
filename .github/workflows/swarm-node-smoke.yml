name: Swarm worker image smoke

on:
  workflow_call:
    secrets:
      TCC_CI_CLIENT_ID:
        required: true
      TCC_CI_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Swarm worker image smoke' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('swarm-node-smoke-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Swarm worker image smoke' && 'max' || 'single' }}

jobs:
  worker-image:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && (github.event_name == 'merge_group' && 'anton-oss-queue' || 'anton-oss') || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      WORKER_SCANNER_CACHE: ${{ github.workspace }}/.worker-scanner-cache
      WORKER_PROVEN_IMAGE: agentihooks-worker-proven:${{ github.run_id }}-${{ github.run_attempt }}
      WORKER_SANDBOX_PROFILES: ${{ runner.temp }}/worker-image-evidence/sandbox-profiles
      ANTONCORE_SANDBOX_REF: 7220b8a4d4ab987786daf89966d98f646182ed18
    strategy:
      fail-fast: false
      matrix:
        proof: [startup, rebuild, profiles]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Mint the sandbox chart read token
        if: matrix.proof == 'startup'
        id: sandbox-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          repositories: antoncore
          permission-contents: read
      - name: Read the pinned sandbox chart
        if: matrix.proof == 'startup'
        uses: actions/checkout@v4
        with:
          repository: the-cloud-clockwork/antoncore
          ref: ${{ env.ANTONCORE_SANDBOX_REF }}
          token: ${{ steps.sandbox-token.outputs.token }}
          path: .sandbox-source
          persist-credentials: false
          sparse-checkout: k8s/charts/ci-lab
      - uses: azure/setup-helm@v4.3.1
        if: matrix.proof == 'startup'
      - uses: actions/setup-python@v5
        if: matrix.proof == 'startup'
        with:
          python-version: '3.12'
      - name: Render both native sandbox profiles
        if: matrix.proof == 'startup'
        run: |
          python -m pip install --constraint .github/ci-tools/parser.lock PyYAML==6.0.3
          mkdir -p "$WORKER_SANDBOX_PROFILES"
          helm template sandbox .sandbox-source/k8s/charts/ci-lab --namespace ci-lab --show-only templates/node-profiles.yaml > "$WORKER_SANDBOX_PROFILES/rendered.yaml"
          python - "$WORKER_SANDBOX_PROFILES" <<'PY'
          import json, os, sys
          from pathlib import Path
          import yaml
          output = Path(sys.argv[1])
          documents = yaml.safe_load_all((output / 'rendered.yaml').read_text())
          config = next(doc for doc in documents if doc and doc['kind'] == 'ConfigMap' and doc['metadata']['name'] == 'ci-lab-node-profiles')
          data = config['data']
          json.loads(data['ci-lab-worker.json'])
          for name in ('ci-lab-worker.json', 'ci-lab-worker'):
              (output / name).write_text(data[name])
          (output / 'source-ref').write_text(os.environ['ANTONCORE_SANDBOX_REF'] + '\n')
          PY
      - name: Pull the locked worker base with bounded rate limit retries
        run: bash docker/swarm-node/pull-base.sh
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORKER_SCANNER_CACHE }}
          key: worker-scanner-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/swarm-node/scan.sh', 'docker/swarm-node/versions.lock') }}-${{ github.run_id }}
          restore-keys: worker-scanner-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/swarm-node/scan.sh', 'docker/swarm-node/versions.lock') }}
      - name: Restore the worker image layers
        id: layers
        if: matrix.proof != 'rebuild' && runner.environment == 'self-hosted'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/worker-layers
          key: worker-layers-${{ hashFiles('docker/swarm-node/**', 'scripts/swarm_v2/worker_image.py') }}
          restore-keys: worker-layers-
      - name: Prove the selected worker image build, scan and offline runs
        env:
          WORKER_PROOF: ${{ matrix.proof }}
          WORKER_LAYERS: ${{ steps.layers.outputs.cache-matched-key && format('{0}/worker-layers', runner.temp) || '' }}
          WORKER_KEEP_IMAGE: ${{ matrix.proof == 'startup' && env.WORKER_PROVEN_IMAGE || '' }}
        run: bash docker/swarm-node/smoke.sh "$RUNNER_TEMP/worker-image-evidence" "$WORKER_PROOF"
      - uses: actions/cache/save@v4
        if: success() && matrix.proof == 'startup'
        with:
          path: ${{ env.WORKER_SCANNER_CACHE }}
          key: worker-scanner-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docker/swarm-node/scan.sh', 'docker/swarm-node/versions.lock') }}-${{ github.run_id }}
      - uses: ./.github/actions/retry-upload
        if: always()
        with:
          after-cancel: true
          name: swarm-worker-image-${{ matrix.proof }}
          path: ${{ runner.temp }}/worker-image-evidence
          retention-days: 7
      - name: Prove worker probes against isolated containers
        if: ${{ !cancelled() && matrix.proof == 'startup' }}
        env:
          WORKER_IMAGE: ${{ env.WORKER_PROVEN_IMAGE }}
        run: bash tests/integration/swarm_node/run_health_proof.sh "$RUNNER_TEMP/worker-health-evidence"
      - uses: ./.github/actions/retry-upload
        if: ${{ always() && matrix.proof == 'startup' }}
        with:
          after-cancel: true
          name: swarm-worker-health-evidence
          path: ${{ runner.temp }}/worker-health-evidence
          retention-days: 7

  worker-image-compare:
    needs: [worker-image]
    if: always()
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Require every independent worker proof
        env:
          PROOF_STATUS: ${{ needs.worker-image.result }}
        run: '[[ "$PROOF_STATUS" == success ]]'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: swarm-worker-image-startup
          path: ${{ runner.temp }}/worker-image-evidence/startup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: swarm-worker-image-rebuild
          path: ${{ runner.temp }}/worker-image-evidence/rebuild
      - uses: actions/download-artifact@v8.0.2
        with:
          name: swarm-worker-image-profiles
          path: ${{ runner.temp }}/worker-image-evidence/profiles
      - name: Compare independent startup and rebuild inventories
        run: bash docker/swarm-node/smoke.sh "$RUNNER_TEMP/worker-image-evidence" compare "$GITHUB_SHA"
      - uses: ./.github/actions/retry-upload
        if: always()
        with:
          after-cancel: true
          name: swarm-worker-image-evidence
          path: ${{ runner.temp }}/worker-image-evidence
          retention-days: 7
