name: Swarm worker image smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Swarm worker image smoke' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('swarm-node-smoke-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Swarm worker image smoke' && 'max' || 'single' }}

jobs:
  worker-image:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]') && 'anton-oss' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Pull the locked worker base with bounded rate limit retries
        run: bash docker/swarm-node/pull-base.sh
      - name: Prove clean worker builds and offline startup
        run: bash docker/swarm-node/smoke.sh "$RUNNER_TEMP/worker-image-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-worker-image-evidence
          path: ${{ runner.temp }}/worker-image-evidence

  worker-health:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]') && 'anton-oss' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pull the locked worker base with bounded rate limit retries
        run: bash docker/swarm-node/pull-base.sh
      - name: Prove worker probes against isolated containers
        run: bash tests/integration/swarm_node/run_health_proof.sh "$RUNNER_TEMP/worker-health-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-worker-health-evidence
          path: ${{ runner.temp }}/worker-health-evidence
