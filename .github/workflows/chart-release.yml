name: Helm chart release

on:
  workflow_run:
    workflows: [Swarm worker image]
    types: [completed]

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    if: github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release tag on main
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Package the release chart
        env:
          RELEASE: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${RELEASE#v}"
          sha256sum -c deploy/helm/agentihooks-swarm-deps.sha256
          helm package deploy/helm/agentihooks-swarm --version "$version" --app-version "$version" --destination "$RUNNER_TEMP/chart"

      - name: Upload the packaged chart
        uses: ./.github/actions/retry-upload
        with:
          name: release-chart
          path: ${{ runner.temp }}/chart/
          if-no-files-found: error
          retention-days: 1

  kind:
    needs: package
    uses: ./.github/workflows/helm-kind-published.yml
    with:
      version: ${{ github.event.workflow_run.head_branch }}
      chart-artifact: release-chart

  publish:
    needs: kind
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - uses: actions/download-artifact@v4
        with:
          name: release-chart
          path: ${{ runner.temp }}/chart

      - name: Publish the release chart that kind installed
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="${RELEASE#v}"
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/agentihooks-swarm-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
