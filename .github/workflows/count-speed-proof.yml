name: Count speed proof

on:
  push:
    branches: ["diffcheck/**"]
    paths: [.github/workflows/count-speed-proof.yml]
  workflow_dispatch:
    inputs:
      base:
        description: Base revision whose count grader supplies the legacy comparison
        required: true
        default: origin/dev

permissions:
  contents: read

jobs:
  count-speed:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss' || 'ubuntu-latest' }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Stamp the shared environment
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: venv
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ steps.day.outputs.date }}-${{ hashFiles('pyproject.toml', '.github/test-excludes.txt') }}
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.venv.outputs.cache-hit != 'true'
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false
      - name: Install on an environment miss
        if: steps.venv.outputs.cache-hit != 'true'
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          uv venv --python "$PYTHON_PATH" "$HOME/venv"
          uv pip install --python "$HOME/venv/bin/python" --excludes .github/test-excludes.txt -e ".[dev,all]"
      - name: Use the shared environment
        run: echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - name: Prepare identical base and head inputs
        env:
          BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        run: |
          BASE="$(git merge-base "$BASE" HEAD)"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          git show "$BASE:tests/count_floor.py" > "$RUNNER_TEMP/legacy.py"
          echo "HEAD: $(git rev-parse HEAD)"
          echo "BASE: $BASE"
      - name: Measure legacy count collection
        shell: bash
        run: |
          /usr/bin/time -f '%e' -o "$RUNNER_TEMP/before.seconds" \
            python "$RUNNER_TEMP/legacy.py" --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/before.log"
      - name: Populate exact collection records
        shell: bash
        env:
          TEST_COUNT_COLLECTION_CACHE: ${{ runner.temp }}/count-collections
          TEST_COUNT_ENVIRONMENT: proof-${{ steps.venv.outputs.cache-primary-key }}
        run: |
          /usr/bin/time -f '%e' -o "$RUNNER_TEMP/cold.seconds" \
            python -m tests.count_floor --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/cold.log"
      - name: Measure reused count collection
        shell: bash
        env:
          TEST_COUNT_COLLECTION_CACHE: ${{ runner.temp }}/count-collections
          TEST_COUNT_ENVIRONMENT: proof-${{ steps.venv.outputs.cache-primary-key }}
        run: |
          /usr/bin/time -f '%e' -o "$RUNNER_TEMP/after.seconds" \
            python -m tests.count_floor --base "$RUNNER_TEMP/base" --head "$GITHUB_WORKSPACE" \
            | tee "$RUNNER_TEMP/after.log"
      - name: Require identical counts and thirty seconds saved
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          counts = {}
          seconds = {}
          for mode in ("before", "cold", "after"):
              counts[mode] = [line for line in (root / f"{mode}.log").read_text().splitlines() if line.startswith("head collects ")]
              seconds[mode] = float((root / f"{mode}.seconds").read_text())
          assert len(counts["before"]) == 1 and counts["before"] == counts["cold"] == counts["after"], counts
          saved = seconds["before"] - seconds["after"]
          print(f"Identical count: {counts['before'][0]}")
          print(f"Same head seconds: {seconds}; saved: {saved:.2f}", flush=True)
          assert saved >= 30, f"Only {saved:.2f} seconds saved"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: count-speed-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/*.seconds
            ${{ runner.temp }}/before.log
            ${{ runner.temp }}/cold.log
            ${{ runner.temp }}/after.log
          if-no-files-found: error
          retention-days: 7
