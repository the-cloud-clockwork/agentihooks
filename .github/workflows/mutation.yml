name: Mutation

on:
  pull_request:
    branches: [dev]

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Install the browser that page tests drive
        run: python -m playwright install --with-deps chromium

      - name: Mutate changed Python files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PYTHONUNBUFFERED: "1"
        run: python -m scripts.ci_mutation --base 5e9ac6ba^ --head 5e9ac6ba --budget 1080

      - name: Upload complete mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: .mutation-gate/
          include-hidden-files: true
          retention-days: 7
