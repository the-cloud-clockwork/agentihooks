name: Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to explain, such as v2.17.438
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max

jobs:
  changelog:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Explain every change of the release in 20 to 100 words
        env:
          CHANGELOG_LITELLM_KEY: ${{ secrets.CHANGELOG_LITELLM_KEY }}
          CHANGELOG_LITELLM_URL: ${{ vars.CHANGELOG_LITELLM_URL }}
          CHANGELOG_MODEL: ${{ vars.CHANGELOG_MODEL }}
        run: python -m scripts.release_changelog explain "$TAG" "$RUNNER_TEMP/section.md"

      - name: Insert the release into the changelog branch
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            parent=()
            : > "$RUNNER_TEMP/RELEASES.md"
            status=0
            git ls-remote --exit-code origin refs/heads/changelog >/dev/null || status=$?
            if [[ $status -eq 0 ]]; then
              git fetch --quiet origin +refs/heads/changelog:refs/remotes/origin/changelog
              parent=(-p origin/changelog)
              if git cat-file -e origin/changelog:RELEASES.md 2>/dev/null; then
                git show origin/changelog:RELEASES.md > "$RUNNER_TEMP/RELEASES.md"
              fi
            elif [[ $status -ne 2 ]]; then
              exit "$status"
            fi
            python -m scripts.release_changelog insert "$RUNNER_TEMP/section.md" "$RUNNER_TEMP/RELEASES.md"
            blob=$(git hash-object -w "$RUNNER_TEMP/RELEASES.md")
            tree=$(printf '100644 blob %s\tRELEASES.md\n' "$blob" | git mktree)
            if [[ ${#parent[@]} -gt 0 && "$tree" == "$(git rev-parse origin/changelog^{tree})" ]]; then
              exit 0
            fi
            commit=$(git commit-tree "$tree" "${parent[@]}" -m "Explain the changes of $TAG")
            if git push --quiet origin "$commit:refs/heads/changelog"; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Add the explanations to the release notes
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if ! grep -qx '## Change explanations' "$RUNNER_TEMP/notes.md"; then
            { printf '\n## Change explanations\n\n'; tail -n +2 "$RUNNER_TEMP/section.md"; } >> "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          fi
