name: Mutation line selection proof

on:
  workflow_dispatch:
  push:
    branches: ['ci-d44a5a-0150']
    paths:
      - .github/workflows/mutation-line-selection-proof.yml
      - tests/mutation_line_selection_proof.py

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compare:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-batch' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: head
      - uses: actions/checkout@v7
        with:
          ref: 328ddd3f3dad53abecc8a5d3603ddbead314665a
          fetch-depth: 2
          path: sample
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false
      - name: Install sample dependencies
        working-directory: sample
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Use the candidate selector on unchanged sample source and tests
        run: |
          cp -a head/scripts/ci_mutation/. sample/scripts/ci_mutation/
          cp head/tests/dep_manifest.py sample/tests/dep_manifest.py
          cp head/tests/mutation_line_selection_proof.py sample/tests/mutation_line_selection_proof.py
      - name: Record contexts and compare selections on the sample head
        working-directory: sample
        run: python -m tests.mutation_line_selection_proof prepare --folder ../line-proof
      - name: Grade with function coverage selection
        working-directory: sample
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m tests.mutation_line_selection_proof before --folder ../line-proof
      - name: Grade with line coverage selection
        working-directory: sample
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m tests.mutation_line_selection_proof after --folder ../line-proof
      - name: Compare every sample mutation verdict
        working-directory: sample
        run: python -m tests.mutation_line_selection_proof verify --folder ../line-proof
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-line-selection-proof
          path: |
            line-proof/selection.json
            line-proof/*-verdicts.json
            line-proof/*/run.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
