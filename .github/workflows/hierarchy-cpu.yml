name: Hierarchy CPU proof

on:
  workflow_call:
    inputs:
      base:
        description: Revision to compare on the same real ledger and runner; empty compares hierarchy against the previous dev head on a push, else the merge base with dev, and load against 726353637
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      base:
        description: Revision to compare on the same real ledger and runner; empty compares hierarchy against the merge base with dev and load against 726353637
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Hierarchy CPU proof' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('hierarchy-cpu-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Hierarchy CPU proof' && 'max' || 'single' }}

jobs:
  hierarchy:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-batch' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0
          filter: tree:0
      - name: Resolve the base, the previous dev head on a push or else the merge base with dev, unless one was given
        id: base
        env:
          BASE: ${{ inputs.base }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          [[ -n "$BASE" ]] || BASE="$BEFORE"
          [[ -n "$BASE" ]] || BASE=$(git -C head merge-base HEAD origin/dev)
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Start Redis on this runner
        run: |
          if command -v redis-server >/dev/null; then
            echo "redis-server comes from the runner image; no package fetch"
          else
            archive=/etc/apt/sources.list.d/ubuntu.sources
            [[ -f "$archive" ]] || archive=/etc/apt/sources.list
            only_archive=(-o Acquire::Retries=5 -o "Dir::Etc::sourcelist=$archive" -o Dir::Etc::sourceparts=-)
            sudo apt-get update -qq "${only_archive[@]}" || echo "::warning::apt archive index refresh incomplete; installing redis-server from the indexes that loaded"
            sudo apt-get install -y -qq --no-install-recommends "${only_archive[@]}" redis-server
          fi
          redis-server --port 6379 --save '' --appendonly no --daemonize yes
          for _ in $(seq 30); do redis-cli -p 6379 ping 2>/dev/null | grep -q PONG && exit 0; sleep 1; done
          exit 1
      - name: Install dependencies shared by both revisions
        working-directory: head
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Prepare identical hierarchy probes for base and head
        run: |
          mkdir hierarchy-evidence
          cp head/tests/ledger_load/hierarchy_probe.py base/tests/ledger_load/hierarchy_probe.py
          cp head/tests/swarm_ledger/operations_corpus.json.gz base/tests/swarm_ledger/operations_corpus.json.gz
          cp head/tests/ledger_load/gate.py base/tests/ledger_load/gate.py
          cp head/tests/ledger_load/memory.py base/tests/ledger_load/memory.py
      - name: Profile and measure one base and head pair of hierarchy routes side by side on this runner, base started first on odd pairs
        env:
          PAIR: ${{ matrix.pair }}
        run: |
          set -o pipefail
          order=(base head)
          [[ "$PAIR" == [13] ]] || order=(head base)
          rm -rf "$RUNNER_TEMP/hierarchy-barrier"
          pids=()
          for side in "${order[@]}"; do
            ( cd "$side" && HIERARCHY_CPU_REPORT="$GITHUB_WORKSPACE/hierarchy-evidence/$side.json" \
              HIERARCHY_START_BARRIER="$RUNNER_TEMP/hierarchy-barrier" \
              python -m pytest tests/ledger_load/hierarchy_probe.py -n 0 -s --tb=short -p no:cacheprovider \
              --basetemp "$RUNNER_TEMP/hierarchy-$side" 2>&1 | tee "$GITHUB_WORKSPACE/hierarchy-evidence/$side.log" ) &
            pids+=("$!")
          done
          failed=""
          for index in "${!order[@]}"; do
            wait "${pids[$index]}" || failed="$failed ${order[$index]}"
          done
          [[ -z "$failed" ]] || { echo "::error::hierarchy probe failed on$failed"; exit 1; }
      - name: Stop Redis
        if: always()
        run: redis-cli -p 6379 shutdown nosave || true
      - name: Preserve the pair's hierarchy profiles and exact response bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchy-pair-${{ matrix.pair }}
          path: hierarchy-evidence/*.json
          if-no-files-found: error

  load:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-batch' || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Start Redis on this runner
        run: |
          if command -v redis-server >/dev/null; then
            echo "redis-server comes from the runner image; no package fetch"
          else
            archive=/etc/apt/sources.list.d/ubuntu.sources
            [[ -f "$archive" ]] || archive=/etc/apt/sources.list
            only_archive=(-o Acquire::Retries=5 -o "Dir::Etc::sourcelist=$archive" -o Dir::Etc::sourceparts=-)
            sudo apt-get update -qq "${only_archive[@]}" || echo "::warning::apt archive index refresh incomplete; installing redis-server from the indexes that loaded"
            sudo apt-get install -y -qq --no-install-recommends "${only_archive[@]}" redis-server
          fi
          redis-server --port 6379 --save '' --appendonly no --daemonize yes
          for _ in $(seq 30); do redis-cli -p 6379 ping 2>/dev/null | grep -q PONG && exit 0; sleep 1; done
          exit 1
      - name: Install dependencies shared by both revisions
        working-directory: head
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Prepare the same load harness for base and head
        run: |
          mkdir load-evidence
          cp head/tests/ledger_load/gate.py base/tests/ledger_load/gate.py
          cp head/tests/ledger_load/memory.py base/tests/ledger_load/memory.py
          git -C head fetch --depth=1 origin "$BASE"
        env:
          BASE: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
      - name: Run one base and head pair of load gates side by side on this runner, base started first on odd pairs
        env:
          BASE: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
          PAIR: ${{ matrix.pair }}
        run: |
          set -o pipefail
          order=(base head)
          [[ "$PAIR" == [135] ]] || order=(head base)
          database=1
          pids=()
          for side in "${order[@]}"; do
            mkdir -p "$GITHUB_WORKSPACE/load-home/$side"
            ( cd "$side" && REDIS_URL="redis://127.0.0.1:6379/$database" \
              AGENTIHOOKS_SWARM_REDIS_URL="redis://127.0.0.1:6379/$database" \
              AGENTIHOOKS_HOME="$GITHUB_WORKSPACE/load-home/$side" \
              python -m tests.ledger_load.memory \
              --folder "$GITHUB_WORKSPACE/load-evidence/$side" \
              --base "$BASE" 2>&1 | tee "$GITHUB_WORKSPACE/load-evidence/$side.log" ) &
            pids+=("$!")
            database=$((database + 1))
          done
          failed=""
          for index in "${!order[@]}"; do
            wait "${pids[$index]}" || failed="$failed ${order[$index]}"
          done
          [[ -z "$failed" ]] || { echo "::error::load gate failed on$failed"; exit 1; }
      - name: Stop Redis
        if: always()
        run: redis-cli -p 6379 shutdown nosave || true
      - name: Preserve the pair's load measurements and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-pair-${{ matrix.pair }}
          path: |
            load-evidence/*.log
            load-evidence/*/server.log
          if-no-files-found: error

  grade:
    needs: [load, hierarchy]
    if: ${{ !cancelled() }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      SAME_CODE_MARGIN: '1.25'
      HIERARCHY_SAME_CODE_MARGIN: '1.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: load-pair-*
          path: load-evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: hierarchy-pair-*
          path: hierarchy-evidence
      - name: Fail when the median head over base pair ratio exceeds the margin set from recorded same code pairs
        run: |
          python -m tests.ledger_load.paired \
            --base load-evidence/load-pair-{1,2,3,4,5}/base.log \
            --head load-evidence/load-pair-{1,2,3,4,5}/head.log \
            --margin "$SAME_CODE_MARGIN" --same-code tests/ledger_load/same_code_pairs.json
      - name: Fail when hierarchy responses changed or the geometric mean head over base CPU ratio exceeds the margin set from recorded same code runs
        if: ${{ !cancelled() }}
        run: |
          python -m tests.ledger_load.hierarchy_paired \
            --pairs hierarchy-evidence/hierarchy-pair-{1,2,3,4} \
            --margin "$HIERARCHY_SAME_CODE_MARGIN" --same-code tests/ledger_load/hierarchy_same_code.json
      - name: Report server peak memory
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('load-evidence').glob('load-pair-*/*.log')):
              rows = [json.loads(line) for line in path.read_text().splitlines() if line.startswith('{')]
              print(json.dumps({'run': f'{path.parent.name}/{path.stem}', 'server_peak_rss_kib': [row['server_peak_rss_kib'] for row in rows if 'server_peak_rss_kib' in row]}))
          PY
