name: Hierarchy CPU proof

on:
  push:
    branches-ignore: [dev, main, "gh-readonly-queue/**"]
    paths: [.github/workflows/hierarchy-cpu.yml]
  workflow_dispatch:
    inputs:
      base:
        description: Revision to compare on the same real ledger and runner
        required: true
        default: dev

permissions:
  contents: read

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

jobs:
  hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install dependencies shared by both revisions
        working-directory: head
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Prepare identical hierarchy probes for base and head
        run: |
          mkdir hierarchy-evidence
          cp head/tests/ledger_load/hierarchy_probe.py base/tests/ledger_load/hierarchy_probe.py
          cp head/tests/swarm_ledger/operations_corpus.json.gz base/tests/swarm_ledger/operations_corpus.json.gz
      - name: Profile and measure base and head hierarchy routes on the same runner
        run: |
          for side in base head; do
            ( cd "$side" && HIERARCHY_CPU_REPORT="$GITHUB_WORKSPACE/hierarchy-evidence/$side.json" \
              python -m pytest tests/ledger_load/hierarchy_probe.py -n 0 -s --tb=short )
          done
      - name: Require byte identical hierarchy responses and at most half the CPU per read
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('hierarchy-evidence/base.json').read_text())
          head = json.loads(Path('hierarchy-evidence/head.json').read_text())
          assert base['source'] == head['source']
          assert base['requests'] == head['requests'] == 16
          assert [row['outputs'] for row in base['observations']] == [row['outputs'] for row in head['observations']], 'Hierarchy response bytes changed'
          print(json.dumps({
              'requests_per_side': head['requests'],
              'base_cpu_seconds_per_read': base['mean_cpu_seconds'],
              'head_cpu_seconds_per_read': head['mean_cpu_seconds'],
              'ratio': head['mean_cpu_seconds'] / base['mean_cpu_seconds'],
              'base_profile': base['profile'],
              'head_profile': head['profile'],
          }, indent=2))
          assert head['mean_cpu_seconds'] <= base['mean_cpu_seconds'] / 2, 'Hierarchy CPU did not halve'
          PY
      - name: Preserve hierarchy profiles and exact response bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchy-cpu
          path: hierarchy-evidence/*.json
          if-no-files-found: error
