name: Hierarchy CPU proof

on:
  workflow_call:
    inputs:
      base:
        description: Revision to compare on the same real ledger and runner
        type: string
        required: false
        default: 726353637ab44da81bdbd374ec393db275856e22
  workflow_dispatch:
    inputs:
      base:
        description: Revision to compare on the same real ledger and runner
        required: true
        default: 726353637ab44da81bdbd374ec393db275856e22

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Hierarchy CPU proof' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('hierarchy-cpu-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Hierarchy CPU proof' && 'max' || 'single' }}

jobs:
  hierarchy:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-batch' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Start Redis on this runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-server
          redis-server --port 6379 --save '' --appendonly no --daemonize yes
          for _ in $(seq 30); do redis-cli -p 6379 ping 2>/dev/null | grep -q PONG && exit 0; sleep 1; done
          exit 1
      - name: Install dependencies shared by both revisions
        working-directory: head
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Prepare identical hierarchy probes for base and head
        run: |
          mkdir hierarchy-evidence
          cp head/tests/ledger_load/hierarchy_probe.py base/tests/ledger_load/hierarchy_probe.py
          cp head/tests/swarm_ledger/operations_corpus.json.gz base/tests/swarm_ledger/operations_corpus.json.gz
          cp head/tests/ledger_load/gate.py base/tests/ledger_load/gate.py
          cp head/tests/ledger_load/memory.py base/tests/ledger_load/memory.py
          git -C head fetch --depth=1 origin "$BASE"
        env:
          BASE: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
      - name: Profile and measure base and head hierarchy routes on the same runner
        run: |
          for side in base head; do
            ( cd "$side" && HIERARCHY_CPU_REPORT="$GITHUB_WORKSPACE/hierarchy-evidence/$side.json" \
              python -m pytest tests/ledger_load/hierarchy_probe.py -n 0 -s --tb=short )
          done
      - name: Require byte identical hierarchy responses and at most half the CPU per read
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('hierarchy-evidence/base.json').read_text())
          head = json.loads(Path('hierarchy-evidence/head.json').read_text())
          assert base['source'] == head['source']
          assert base['requests'] == head['requests'] == 16
          assert [row['outputs'] for row in base['observations']] == [row['outputs'] for row in head['observations']], 'Hierarchy response bytes changed'
          print(json.dumps({
              'requests_per_side': head['requests'],
              'base_cpu_seconds_per_read': base['mean_cpu_seconds'],
              'head_cpu_seconds_per_read': head['mean_cpu_seconds'],
              'ratio': head['mean_cpu_seconds'] / base['mean_cpu_seconds'],
              'base_profile': base['profile'],
              'head_profile': head['profile'],
          }, indent=2))
          assert head['mean_cpu_seconds'] <= base['mean_cpu_seconds'] / 2, 'Hierarchy CPU did not halve'
          PY
      - name: Stop Redis
        if: always()
        run: redis-cli -p 6379 shutdown nosave || true
      - name: Preserve hierarchy profiles and exact response bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchy-cpu
          path: hierarchy-evidence/*.json
          if-no-files-found: error

  load:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-batch' || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pair: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Start Redis on this runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-server
          redis-server --port 6379 --save '' --appendonly no --daemonize yes
          for _ in $(seq 30); do redis-cli -p 6379 ping 2>/dev/null | grep -q PONG && exit 0; sleep 1; done
          exit 1
      - name: Install dependencies shared by both revisions
        working-directory: head
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Prepare the same load harness for base and head
        run: |
          mkdir load-evidence
          cp head/tests/ledger_load/gate.py base/tests/ledger_load/gate.py
          cp head/tests/ledger_load/memory.py base/tests/ledger_load/memory.py
          git -C head fetch --depth=1 origin "$BASE"
        env:
          BASE: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
      - name: Run one base and head pair of load gates on this runner, base first on odd pairs
        env:
          BASE: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
          PAIR: ${{ matrix.pair }}
        run: |
          set -o pipefail
          order=(base head)
          [[ "$PAIR" == [135] ]] || order=(head base)
          database=1
          failed=""
          for side in "${order[@]}"; do
            ( cd "$side" && REDIS_URL="redis://127.0.0.1:6379/$database" \
              AGENTIHOOKS_SWARM_REDIS_URL="redis://127.0.0.1:6379/$database" \
              python -m tests.ledger_load.memory \
              --folder "$GITHUB_WORKSPACE/load-evidence/$side" \
              --base "$BASE" 2>&1 | tee "$GITHUB_WORKSPACE/load-evidence/$side.log" ) || failed="$failed $side"
            database=$((database + 1))
          done
          [[ -z "$failed" ]] || { echo "::error::load gate failed on$failed"; exit 1; }
      - name: Stop Redis
        if: always()
        run: redis-cli -p 6379 shutdown nosave || true
      - name: Preserve the pair's load measurements and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-pair-${{ matrix.pair }}
          path: |
            load-evidence/*.log
            load-evidence/*/server.log
          if-no-files-found: error

  grade:
    needs: load
    if: ${{ !cancelled() }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      SAME_CODE_MARGIN: '1.25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: load-pair-*
          path: load-evidence
      - name: Fail when the median head over base pair ratio exceeds the margin set from recorded same code pairs
        run: |
          python -m tests.ledger_load.paired \
            --base load-evidence/load-pair-{1,2,3,4,5}/base.log \
            --head load-evidence/load-pair-{1,2,3,4,5}/head.log \
            --margin "$SAME_CODE_MARGIN" --same-code tests/ledger_load/same_code_pairs.json
      - name: Report server peak memory
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('load-evidence').glob('load-pair-*/*.log')):
              rows = [json.loads(line) for line in path.read_text().splitlines() if line.startswith('{')]
              print(json.dumps({'run': f'{path.parent.name}/{path.stem}', 'server_peak_rss_kib': [row['server_peak_rss_kib'] for row in rows if 'server_peak_rss_kib' in row]}))
          PY
