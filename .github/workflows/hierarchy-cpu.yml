name: Hierarchy CPU proof

on:
  workflow_dispatch:
    inputs:
      base:
        description: Revision to compare on the same real ledger and runner
        required: true
        default: 726353637ab44da81bdbd374ec393db275856e22

permissions:
  contents: read

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

jobs:
  hierarchy:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && (github.event_name == 'merge_group' && 'anton-oss-queue' || 'anton-oss') || 'ubuntu-latest' }}
    timeout-minutes: 20
    services:
      redis:
        image: public.ecr.aws/docker/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install dependencies shared by both revisions
        working-directory: head
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Prepare identical hierarchy probes for base and head
        run: |
          mkdir hierarchy-evidence
          cp head/tests/ledger_load/hierarchy_probe.py base/tests/ledger_load/hierarchy_probe.py
          cp head/tests/swarm_ledger/operations_corpus.json.gz base/tests/swarm_ledger/operations_corpus.json.gz
          cp head/tests/ledger_load/gate.py base/tests/ledger_load/gate.py
          cp head/tests/ledger_load/memory.py base/tests/ledger_load/memory.py
          git -C head fetch --depth=1 origin "$BASE"
        env:
          BASE: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
      - name: Profile and measure base and head hierarchy routes on the same runner
        run: |
          for side in base head; do
            ( cd "$side" && HIERARCHY_CPU_REPORT="$GITHUB_WORKSPACE/hierarchy-evidence/$side.json" \
              python -m pytest tests/ledger_load/hierarchy_probe.py -n 0 -s --tb=short )
          done
      - name: Require byte identical hierarchy responses and at most half the CPU per read
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('hierarchy-evidence/base.json').read_text())
          head = json.loads(Path('hierarchy-evidence/head.json').read_text())
          assert base['source'] == head['source']
          assert base['requests'] == head['requests'] == 16
          assert [row['outputs'] for row in base['observations']] == [row['outputs'] for row in head['observations']], 'Hierarchy response bytes changed'
          print(json.dumps({
              'requests_per_side': head['requests'],
              'base_cpu_seconds_per_read': base['mean_cpu_seconds'],
              'head_cpu_seconds_per_read': head['mean_cpu_seconds'],
              'ratio': head['mean_cpu_seconds'] / base['mean_cpu_seconds'],
              'base_profile': base['profile'],
              'head_profile': head['profile'],
          }, indent=2))
          assert head['mean_cpu_seconds'] <= base['mean_cpu_seconds'] / 2, 'Hierarchy CPU did not halve'
          PY
      - name: Run paired ledger load and server memory on the hierarchy proof runner
        env:
          BASE: ${{ inputs.base || '726353637ab44da81bdbd374ec393db275856e22' }}
        run: |
          set -o pipefail
          database=1
          failed=""
          for round in 1 2; do
            for side in base head; do
              ( cd "$side" && REDIS_URL="redis://127.0.0.1:6379/$database" \
                AGENTIHOOKS_SWARM_REDIS_URL="redis://127.0.0.1:6379/$database" \
                python -m tests.ledger_load.memory \
                --folder "$GITHUB_WORKSPACE/hierarchy-evidence/load-$side-$round" \
                --base "$BASE" 2>&1 | tee "$GITHUB_WORKSPACE/hierarchy-evidence/load-$side-$round.log" ) || failed="$failed $side-$round"
              database=$((database + 1))
            done
          done
          [[ -z "$failed" ]] || { echo "::error::load gate failed on$failed"; exit 1; }
      - name: Compare paired write latency and CPU and report server peak memory
        if: ${{ always() }}
        run: |
          cd head
          python -m tests.ledger_load.paired \
            --base ../hierarchy-evidence/load-base-1.log ../hierarchy-evidence/load-base-2.log \
            --head ../hierarchy-evidence/load-head-1.log ../hierarchy-evidence/load-head-2.log
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('../hierarchy-evidence').glob('load-*.log')):
              rows = [json.loads(line) for line in path.read_text().splitlines() if line.startswith('{')]
              print(json.dumps({'run': path.stem, 'server_peak_rss_kib': [row['server_peak_rss_kib'] for row in rows if 'server_peak_rss_kib' in row]}))
          PY
      - name: Preserve hierarchy profiles and exact response bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hierarchy-cpu
          path: |
            hierarchy-evidence/*.json
            hierarchy-evidence/*.log
            hierarchy-evidence/*/server.log
          if-no-files-found: error
