name: CI lab image

on:
  push:
    branches: [dev, 'diffcheck/ci-lab-image-*']
    paths:
      - docker/ci-lab/**
      - .github/workflows/ci-lab-image.yml
      - .github/test-requirements.lock
      - .github/test-excludes.txt
      - pyproject.toml
      - scripts/ci_lab/**
      - scripts/ci_lab_smoke.py
      - scripts/cli_delegates.py
  release:
    types: [published]
  schedule:
    - cron: "47 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && format('ci-lab-image-{0}', github.ref) || format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'single' || 'max' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'schedule'
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Rebuild on dev after the runner wheelhouse refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-lab-image.yml --repo "$GITHUB_REPOSITORY" --ref dev

  image:
    if: github.event_name != 'schedule'
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/the-cloud-clockwork/agentihooks-ci-lab-worker
      CANDIDATE: agentihooks-ci-lab-worker-candidate:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'release' && '0' || '1' }}
          persist-credentials: false
      - name: Require a release tag on main
        id: main
        if: github.event_name == 'release'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          newest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ "$newest" == "$GITHUB_REF_NAME" ]]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the candidate on the newest runner image
        run: docker build --pull --platform linux/amd64 --file docker/ci-lab/Dockerfile --tag "$CANDIDATE" .
      - name: Smoke the candidate with no network
        run: bash docker/ci-lab/smoke.sh "$CANDIDATE" "$(sha256sum .github/test-requirements.lock | cut -d ' ' -f 1)"
      - name: Publish the dev tags
        if: github.ref == 'refs/heads/dev'
        run: |
          for tag in "$IMAGE:dev-${GITHUB_SHA:0:7}" "$IMAGE:dev"; do
            docker tag "$CANDIDATE" "$tag"
            docker push "$tag"
          done
      - name: Publish the release tags unless a newer release already published
        if: github.event_name == 'release'
        env:
          RELEASE: ${{ github.event.release.tag_name }}
        run: |
          docker tag "$CANDIDATE" "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          bash docker/swarm-node/release.sh "$IMAGE" "$RELEASE" "$GITHUB_SHA"
