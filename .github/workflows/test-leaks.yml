name: Test leaks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reuse-command:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install proof dependencies
        run: python -m pip install -e ".[dev,all]"
      - name: Exercise protected reuse command and protocol
        run: python -m pytest tests/test_ci_reuse.py tests/test_gate_protected.py::test_only_the_canonical_reuse_protocol_is_an_allowed_transition tests/test_gate_protected.py::test_a_head_cannot_replace_the_protected_reuse_decision -v --tb=short
