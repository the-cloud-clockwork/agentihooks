name: Test leaks

# Shard placement shifts whenever a test is added, so a test that leaks state into a
# later one turns unrelated pull requests red at random; one process shows it on dev.
on:
  # GitHub fires a schedule only from the default branch, main; the job tests dev.
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/test-leaks.yml
      - tests/leaks.py

concurrency:
  group: test-leaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  one-process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        order: [fixed, random]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Run the whole suite in one process
        id: suite
        env:
          SEED: ${{ matrix.order == 'random' && github.run_id || '' }}
          PYTHONUNBUFFERED: "1"
        run: python -m pytest tests/ -n 0 -q -rfE --tb=short --report-log=run.jsonl ${SEED:+--random-order-seed=$SEED}

      - name: Name each leaking pair
        id: pairs
        if: failure() && steps.suite.outcome == 'failure'
        run: python -m tests.leaks pairs run.jsonl leaks.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open a follow up per finding
        id: followup
        if: failure() && steps.suite.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tests.leaks followup leaks.json "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
