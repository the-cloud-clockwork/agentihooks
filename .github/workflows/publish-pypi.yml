name: Publish to PyPI

# Dispatched by hand from main in the release dance, or by release.yml when
# publish_pypi is on. Do NOT add `push: tags: ["v*"]` back — the release
# workflow pushes the tag AND can dispatch this workflow. Both triggers fire
# in parallel and race to upload the same artifact; one loses with PyPI 400 'File already exists'.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select the released tag
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag=$(git tag --list 'v*' --sort=-version:refname | python3 -c 'import re, sys; print(next(t.strip() for t in sys.stdin if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+\n?", t)))')
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$tag^{tree}")"
            git checkout --detach "$tag"
          else
            [[ "$GITHUB_REF" == refs/tags/v* ]]
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build wheel + sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
