name: Coverage ratchet speed

on:
  workflow_dispatch:
  push:
    branches-ignore: [dev, main, "gh-readonly-queue/**", "wip/**"]
    paths: [tests/coverage_ratchet.py, tests/coverage_grade.py, .github/workflows/coverage-ratchet-speed.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install coverage
        run: python -m pip install "coverage>=7.4"
      - uses: actions/checkout@v4
        with:
          ref: 768175723e90908ad02a738ed57791fcabcc296b
          path: original
          fetch-depth: 0
      - name: Restore the identical baseline
        uses: actions/download-artifact@v4
        with:
          name: coverage-baseline
          path: ~/coverage-baseline
          run-id: 38982907091
          github-token: ${{ github.token }}
      - name: Restore the identical shards
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-3.12-*
          path: head-coverage
          run-id: 38996268441
          github-token: ${{ github.token }}
      - name: Replay original and candidate against identical inputs
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import time
          from pathlib import Path

          root = Path.cwd()
          evidence = root / "speed-evidence"
          evidence.mkdir()
          baseline = Path.home() / "coverage-baseline/baseline.json"
          clean = evidence / "clean-baseline.json"
          subprocess.run([sys.executable, "-m", "tests.coverage_baseline", "--head", str(root / "original"),
                          "--shards", "12", "--head-shards", str(root / "head-coverage"),
                          "--out", str(clean)], cwd=root / "original", check=True)
          results = {}
          for case, base, snapshot, verdict in (
              ("loss", "224f880cc9b4f6b6cfd15a17b5a7d22f72958ea4", baseline, 1),
              ("clean", "768175723e90908ad02a738ed57791fcabcc296b", clean, 0),
          ):
              results[case] = {}
              for name, code in (("original", root / "original"), ("candidate", root)):
                  out = evidence / case / name
                  command = [sys.executable, "-m", "tests.coverage_ratchet", "--base", base,
                             "--head", str(root / "original"), "--shards", "12",
                             "--head-shards", str(root / "head-coverage"),
                             "--base-baseline", str(snapshot), "--out", str(out)]
                  started = time.perf_counter()
                  result = subprocess.run(command, cwd=code, capture_output=True, text=True)
                  elapsed = time.perf_counter() - started
                  (evidence / f"{case}-{name}.log").write_text(result.stdout + result.stderr)
                  results[case][name] = {"seconds": elapsed, "verdict": result.returncode}
                  print(case, name, json.dumps(results[case][name]), flush=True)
              assert results[case]["original"]["verdict"] == results[case]["candidate"]["verdict"] == verdict
              assert (evidence / case / "original/report.txt").read_bytes() == (evidence / case / "candidate/report.txt").read_bytes()
              print(case, "identical full reports and verdicts", flush=True)
          (evidence / "timings.json").write_text(json.dumps(results, indent=2))
          for case, pair in results.items():
              saved = pair["original"]["seconds"] - pair["candidate"]["seconds"]
              print(case, "seconds saved", saved, flush=True)
              assert saved >= 20, f"{case} saved only {saved:.2f} seconds"
          PY
      - name: Retain timing and equivalence evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ratchet-speed
          path: speed-evidence
          retention-days: 7
