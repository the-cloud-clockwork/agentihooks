name: Worker hive pod

on:
  push:
    branches: [dev, "ci-*"]
    paths: [deploy/worker/**, deploy/helm/agentihooks-swarm/**, scripts/hive/**, docker/swarm-node/**, .github/workflows/hive-worker.yml]
  workflow_dispatch:
    inputs:
      contracts_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: worker-hive-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/dev' }}

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove the rendered worker hive chart
        run: |
          python3 -m pip install PyYAML
          bash deploy/worker/chart-proof.sh

  kind:
    if: ${{ !inputs.contracts_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64.sha256sum"
          mv kind kind-linux-amd64
          sha256sum -c kind.sha256sum
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
      - name: Build the worker image while kind starts, then prove registration and order acknowledgement
        run: bash deploy/worker/kind-proof.sh
      - name: Retain proof output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-hive-proof
          path: ~/scratchpad/worker-hive-proof/*.txt

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [contracts, kind]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish the hive worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/worker/Dockerfile
          push: true
          tags: ghcr.io/the-cloud-clockwork/agentihooks-hive-worker:dev
          cache-from: type=gha,scope=hive-worker
          cache-to: type=gha,mode=max,scope=hive-worker
