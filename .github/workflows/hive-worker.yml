name: Worker hive pod

on:
  push:
    branches: [dev]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      contracts_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && format('worker-hive-{0}', github.ref) || format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 'single' || 'max' }}
  cancel-in-progress: false

jobs:
  contracts:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove the rendered worker hive chart
        run: |
          python3 -m pip install PyYAML
          bash deploy/worker/chart-proof.sh

  kind:
    if: ${{ !inputs.contracts_only }}
    needs: contracts
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'release' && '0' || '1' }}
          persist-credentials: false
      - name: Require a release tag on main
        id: main
        if: github.event_name == 'release'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          newest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ "$newest" == "$GITHUB_REF_NAME" ]]; then latest=true; else latest=false; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
          curl -fsSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64.sha256sum"
          mv kind kind-linux-amd64
          sha256sum -c kind.sha256sum
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
      - name: Build the worker image while kind starts, then prove registration and order acknowledgement
        env:
          AGENTIHOOKS_REF: ${{ github.sha }}
        run: bash deploy/worker/kind-proof.sh
      - name: Retain proof output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-hive-proof
          path: ~/scratchpad/worker-hive-proof/*.txt
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' || github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the proven hive worker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' || github.event_name == 'release'
        env:
          IMAGE: ghcr.io/the-cloud-clockwork/agentihooks-hive-worker
          RELEASE: ${{ github.event.release.tag_name }}
          LATEST: ${{ steps.main.outputs.latest }}
        run: |
          if [[ -n "$RELEASE" ]]; then
            tags=("${RELEASE#v}")
            if [[ "$LATEST" == true ]]; then tags+=(release); fi
          else
            tags=(dev)
          fi
          for tag in "${tags[@]}"; do
            docker tag local/agentihooks-hive-worker:dev "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
