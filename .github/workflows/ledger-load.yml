name: Ledger server load

on:
  workflow_call:
    inputs:
      base:
        description: Revision whose budgets grade the run
        type: string
        required: true
  workflow_dispatch:
    inputs:
      streams:
        description: Compare one and three page streams at two writes per second on base and head
        type: boolean
        default: false
      compare:
        description: Run identical load gates on base and head on one runner
        type: boolean
        default: false
      base:
        description: Revision whose budgets grade the run
        type: string
        required: true
        default: origin/dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Ledger server load' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('ledger-load-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Ledger server load' && 'max' || 'single' }}

jobs:
  load:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && (github.event_name == 'merge_group' && 'anton-oss-queue' || 'anton-oss') || 'ubuntu-latest' }}
    timeout-minutes: 15
    services:
      redis:
        image: mirror.gcr.io/library/redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      AGENTIHOOKS_SWARM_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Fetch the base whose budgets grade the run
        env:
          BASE: ${{ inputs.base }}
        run: git fetch --no-tags --depth=1 origin "${BASE#origin/}"

      - name: Read the Redis service image
        id: redis
        if: ${{ !inputs.streams && !inputs.compare }}
        env:
          SERVICE: ${{ job.services.redis.id }}
        run: echo "image=$(docker inspect --format '{{.Image}}' "$SERVICE")" >> "$GITHUB_OUTPUT"

      - name: Key the declared inputs
        id: key
        if: ${{ !inputs.streams && !inputs.compare }}
        uses: ./.github/actions/input-key
        with:
          job: ledger-load
          base: FETCH_HEAD
          environment: redis=${{ steps.redis.outputs.image }}

      - name: Set up Python
        id: python
        if: steps.key.outputs.hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        if: steps.key.outputs.hit != 'true'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Install dependencies
        if: steps.key.outputs.hit != 'true'
        env:
          PYTHON_PATH: ${{ steps.python.outputs.python-path }}
        run: |
          uv venv --python "$PYTHON_PATH" "$HOME/venv"
          uv pip install --python "$HOME/venv/bin/python" -e ".[all]"

      - name: Write and read a full size ledger from ten clients within the server budget
        if: ${{ !inputs.streams && !inputs.compare && steps.key.outputs.hit != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ledger-load"
          "$HOME/venv/bin/python" -m tests.ledger_load.gate --folder "$RUNNER_TEMP/ledger-load" --base FETCH_HEAD

      - name: Save the passed input key
        if: steps.key.outputs.hit == 'false' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: ./.github/actions/input-key/save
        with:
          key: ${{ steps.key.outputs.key }}

      - name: Prepare the same load harness for the base implementation
        if: inputs.compare
        run: |
          mkdir load-base
          git archive FETCH_HEAD | tar -x -C load-base
          cp tests/ledger_load/gate.py load-base/tests/ledger_load/gate.py
          mkdir -p "$GITHUB_WORKSPACE/load-evidence"

      - name: Run base and head load gates interleaved twice on the same runner
        if: inputs.compare
        run: |
          set -o pipefail
          ( cd load-base && "$HOME/venv/bin/python" -c 'import pathlib, scripts.swarm_ledger.ledger_server as m; assert pathlib.Path(m.__file__).resolve().is_relative_to(pathlib.Path.cwd().resolve()), m.__file__' )
          database=1
          failed=""
          for round in 1 2; do
            for side in base head; do
              directory="$GITHUB_WORKSPACE"
              [[ "$side" == head ]] || directory="$GITHUB_WORKSPACE/load-base"
              ( cd "$directory" && REDIS_URL="redis://127.0.0.1:6379/$database" \
                AGENTIHOOKS_SWARM_REDIS_URL="redis://127.0.0.1:6379/$database" \
                "$HOME/venv/bin/python" -m tests.ledger_load.gate \
                --folder "$GITHUB_WORKSPACE/load-evidence/$side-$round" \
                --base FETCH_HEAD 2>&1 | tee "$GITHUB_WORKSPACE/load-evidence/$side-$round.log" ) || failed="$failed $side-$round"
              database=$((database + 1))
            done
          done
          [[ -z "$failed" ]] || { echo "::error::load gate failed on$failed"; exit 1; }

      - name: Fail when the head writes slower or busier than the base
        if: ${{ always() && inputs.compare }}
        run: |
          "$HOME/venv/bin/python" -m tests.ledger_load.paired \
            --base load-evidence/base-1.log load-evidence/base-2.log \
            --head load-evidence/head-1.log load-evidence/head-2.log

      - name: Preserve both load measurements and server logs
        if: ${{ always() && inputs.compare }}
        uses: actions/upload-artifact@v4
        with:
          name: paired-ledger-load
          path: |
            load-evidence/*.log
            load-evidence/*/server.log

      - name: Compare stream publication CPU on identical base and head workloads
        if: inputs.streams
        run: |
          git worktree add --detach "$RUNNER_TEMP/ledger-load-base" FETCH_HEAD
          "$HOME/venv/bin/python" -m tests.ledger_load.streams \
            --base "$RUNNER_TEMP/ledger-load-base" \
            --head "$GITHUB_WORKSPACE" \
            --folder "$RUNNER_TEMP/ledger-streams"

      - name: Preserve both stream CPU measurements and server logs
        if: ${{ always() && inputs.streams }}
        uses: actions/upload-artifact@v4
        with:
          name: ledger-stream-cpu
          path: ${{ runner.temp }}/ledger-streams
