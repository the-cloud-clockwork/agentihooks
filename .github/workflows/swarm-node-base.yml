name: Swarm worker base copy

on:
  push:
    branches: [dev]
    paths:
      - docker/swarm-node/versions.lock
      - docker/swarm-node/base-copy.sh
      - docker/swarm-node/copy-base.sh
      - .github/workflows/swarm-node-base.yml

permissions:
  contents: read

concurrency:
  group: swarm-node-base
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Copy the locked worker base into the org registry
        run: bash docker/swarm-node/copy-base.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
