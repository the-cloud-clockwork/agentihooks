name: Semgrep

on:
  workflow_call:
    inputs:
      base:
        description: Revision whose findings are already known
        type: string
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && (github.event_name == 'merge_group' && 'anton-oss-queue' || 'anton-oss') || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        env:
          SEMGREP_VERSION: "1.177.0"
        run: |
          if [[ "$(semgrep --version 2>/dev/null)" != "$SEMGREP_VERSION" ]]; then
            python -m pip install --constraint .github/ci-tools/semgrep.lock "semgrep==$SEMGREP_VERSION"
          fi
          test "$(semgrep --version)" = "$SEMGREP_VERSION"

      - name: Install PyYAML
        run: python -m pip install --constraint .github/ci-tools/semgrep.lock pyyaml==6.0.2

      - name: Check out the protected grader
        env:
          BASE: ${{ inputs.base }}
        run: |
          git fetch --no-tags origin "${BASE#origin/}"
          git worktree add --detach "$RUNNER_TEMP/grader" FETCH_HEAD

      - name: Own rules hold on their fixtures and the code
        env:
          RULES: .semgrep
        run: |
          # Callers ignore their fixture folder; an empty ignore file in a fresh copy grades every fixture.
          copy="$(mktemp -d -p "$RUNNER_TEMP")"
          cp -r "$RULES" "$copy/rules"
          : > "$copy/.semgrepignore"
          (cd "$copy" && semgrep --metrics off --test --strict --config rules rules)
          semgrep scan --error --strict --timeout 30 --metrics off --config "$RUNNER_TEMP/grader/$RULES" --config "$RULES" .

      - name: Outage rules for tests hold on every test file
        env:
          RULES: .semgrep-incidents/ledger-client-swapped-for-a-function.yml .semgrep-incidents/parametrize-id-carries-interpreter-path.yml .semgrep-incidents/fake-server-close-read-ignores-reset.yml .semgrep-incidents/chart-grader-copy-keeps-source-modes.yml
        run: |
          args=()
          for rule in $RULES; do
            args+=(--config "$rule")
            if [[ -e "$RUNNER_TEMP/grader/$rule" ]]; then args+=(--config "$RUNNER_TEMP/grader/$rule"); fi
          done
          semgrep scan --error --strict --timeout 30 --metrics off --x-ignore-semgrepignore-files "${args[@]}" tests

      - name: New test waits keep a bound of ten seconds or more
        env:
          BASE: ${{ inputs.base }}
          RULE: .semgrep-incidents/test-wait-bound-under-ten-seconds.yml
        run: |
          args=(--config "$RULE")
          if [[ -e "$RUNNER_TEMP/grader/$RULE" ]]; then args+=(--config "$RUNNER_TEMP/grader/$RULE"); fi
          baseline="$(git merge-base "$BASE" HEAD)"
          semgrep scan --error --strict --timeout 30 --metrics off --x-ignore-semgrepignore-files "${args[@]}" --baseline-commit "$baseline" tests

      - name: Rule exceptions only shrink
        env:
          BASE: ${{ inputs.base }}
        run: |
          git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null || { echo "cannot read base $BASE" >&2; exit 1; }
          for list in .semgrep/*-allowlist.json; do
            if ! git cat-file -e "$BASE:$list" 2>/dev/null; then
              echo "The base holds no $list; the head list starts it"
              continue
            fi
            previous="$(git show "$BASE:$list")"
            LIST="$list" PREVIOUS="$previous" python - <<'PY'
          import json
          import os
          import sys

          previous = set(json.loads(os.environ["PREVIOUS"]))
          with open(os.environ["LIST"]) as handle:
              current = set(json.load(handle))
          if not current <= previous:
              sys.exit(f"{os.environ['LIST']} exceptions grew: {sorted(current - previous)}")
          print(f"{os.environ['LIST']} exceptions: {len(current)} of {len(previous)}")
          PY
          done
          baseline="$(git merge-base "$BASE" HEAD)"
          BASELINE="$baseline" python - <<'PY'
          import os
          import subprocess
          import sys

          import yaml


          def git(*args: str) -> str:
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout


          def negations(node: object) -> int:
              if isinstance(node, dict):
                  return sum(str(key).startswith("pattern-not") + negations(value) for key, value in node.items())
              if isinstance(node, list):
                  return sum(negations(item) for item in node)
              return 0


          def exceptions(revision: str) -> dict[str, list[int]]:
              found: dict[str, list[int]] = {}
              for path in git("ls-tree", "-r", "-z", "--name-only", revision).split("\0"):
                  folder, _, name = path.partition("/")
                  if not folder.startswith(".semgrep") or not name.endswith((".yml", ".yaml")):
                      continue
                  if name.endswith((".test.yml", ".test.yaml")):
                      continue
                  for rule in yaml.safe_load(git("show", f"{revision}:{path}"))["rules"]:
                      counts = found.setdefault(rule["id"], [0, 0])
                      counts[0] += negations(rule)
                      counts[1] += len(rule.get("paths", {}).get("exclude", []))
              return found


          previous = exceptions(os.environ["BASELINE"])
          current = exceptions("HEAD")
          if not current:
              sys.exit("No own Semgrep rule under a .semgrep folder; the check graded nothing")
          grown = [
              f"{rule} {kind} grew from {old} to {new}"
              for rule in sorted(current.keys() & previous.keys())
              for kind, old, new in zip(("pattern-not entries", "path excludes"), previous[rule], current[rule])
              if new > old
          ]
          print(
              f"Own rule exceptions: {sum(nots for nots, _ in current.values())} pattern-not entries and "
              f"{sum(excludes for _, excludes in current.values())} path excludes in {len(current)} rules; "
              f"the merge base holds {sum(nots for nots, _ in previous.values())} and "
              f"{sum(excludes for _, excludes in previous.values())} in {len(previous)} rules"
          )
          if grown:
              sys.exit("\n".join(grown))
          PY

      - name: Resolve the merge base of the head and the base
        id: baseline
        env:
          BASE: ${{ inputs.base }}
        run: |
          sha="$(git merge-base "$BASE" HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # A rule that times out drops its findings, so a scan whose only errors are timeouts runs once more.
      - name: Fail on findings new against the base
        env:
          BASE: ${{ steps.baseline.outputs.sha }}
          CONFIGS: p/ci p/secrets p/python .semgrep-incidents
          EXCLUDE_RULES: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
          TIMEOUT: "30"
        run: |
          args=()
          for config in $CONFIGS; do args+=(--config "$config"); done
          args+=(--config "$RUNNER_TEMP/grader/.semgrep-incidents")
          for rule in $EXCLUDE_RULES; do args+=(--exclude-rule "$rule"); done
          report="$RUNNER_TEMP/semgrep.json"
          scan() {
            semgrep scan --error --strict --verbose --timeout "$TIMEOUT" --metrics off "${args[@]}" --baseline-commit "$BASE" --json-output="$report"
          }
          code=0
          scan || code=$?
          if [[ "$code" != 0 ]] && jq -e '(.results | length) == 0 and (.errors | length) > 0 and all(.errors[]; .type == "Timeout")' "$report" > /dev/null 2>&1; then
            echo "Semgrep timed out with no other error, scanning once more: $(jq -r '[.errors[] | "\(.rule_id) on \(.path)"] | unique | join(", ")' "$report")" >&2
            code=0
            scan || code=$?
          fi
          exit "$code"

  feature-tests:
    concurrency:
      group: ${{ github.workflow == 'Semgrep' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('semgrep-features-{0}', github.run_id) }}
      queue: ${{ github.workflow == 'Semgrep' && 'max' || 'single' }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        timeout-minutes: 2
        env:
          SEMGREP_VERSION: "1.177.0"
        run: |
          if [[ "$(semgrep --version 2>/dev/null)" != "$SEMGREP_VERSION" ]]; then
            python -m pip install --constraint .github/ci-tools/semgrep.lock "semgrep==$SEMGREP_VERSION"
          fi
          test "$(semgrep --version)" = "$SEMGREP_VERSION"

      - name: Operator feature regressions and passing fixtures
        run: semgrep --metrics off --test --strict .semgrep/features

      # Each rule matches a pattern behind an outage; the scan job fails only instances new against the base.
      - name: Outage rules fire on their planted faults and pass their clean cases
        run: |
          copy="$(mktemp -d -p "$RUNNER_TEMP")"
          cp -r .semgrep-incidents "$copy/rules"
          : > "$copy/.semgrepignore"
          (cd "$copy" && semgrep --metrics off --test --strict --config rules rules)

  charts:
    concurrency:
      group: ${{ github.workflow == 'Semgrep' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('semgrep-charts-{0}', github.run_id) }}
      queue: ${{ github.workflow == 'Semgrep' && 'max' || 'single' }}
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The light runner image ships Semgrep; hosted runners install it.
      - name: Install PyYAML and Semgrep
        env:
          SEMGREP_VERSION: "1.177.0"
        run: |
          if [[ "$(semgrep --version 2>/dev/null)" == "$SEMGREP_VERSION" ]]; then
            python -m pip install --constraint .github/ci-tools/semgrep.lock pyyaml==6.0.2
          else
            python -m pip install --constraint .github/ci-tools/semgrep.lock pyyaml==6.0.2 "semgrep==$SEMGREP_VERSION"
          fi
          test "$(semgrep --version)" = "$SEMGREP_VERSION"

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Check out the protected grader
        env:
          BASE: ${{ inputs.base }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE#origin/}"
          git worktree add --detach "$RUNNER_TEMP/grader" FETCH_HEAD

      - name: Guard rules hold on their fixtures and at their computed floors
        env:
          BASE: ${{ inputs.base }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE#origin/}"
          grader=scripts/ci_semgrep_floors.py
          if git cat-file -e FETCH_HEAD:scripts/ci_semgrep_floors.py; then
            grader="$RUNNER_TEMP/ci_semgrep_floors.py"
            git show FETCH_HEAD:scripts/ci_semgrep_floors.py > "$grader"
          fi
          python "$grader" check --base FETCH_HEAD

      - name: A chart version bump leaves every pod template unchanged
        run: |
          script=tests/ci_charts/chart_pod_templates.py
          empty="$(mktemp -d -p "$RUNNER_TEMP")"
          if [[ "$(python "$RUNNER_TEMP/grader/$script" --root "$empty" 2>&1)" != *"No chart found under deploy"* ]]; then
            echo "::error::The protected grader's copy of $script does not grade the tree --root names, so nothing trusted can grade the head's charts."
            exit 1
          fi
          python "$RUNNER_TEMP/grader/$script" --root "$GITHUB_WORKSPACE"

      # The timer guard reads source only, so a CronJob a chart template renders is checked on the rendered manifests.
      - name: Charts render no CronJob outside the scheduler
        run: |
          script=tests/ci_charts/chart_timers.py
          empty="$(mktemp -d -p "$RUNNER_TEMP")"
          if [[ "$(python "$RUNNER_TEMP/grader/$script" --root "$empty" 2>&1)" != *"No chart found under deploy"* ]]; then
            echo "::error::The protected grader's copy of $script does not grade the tree --root names, so nothing trusted can grade the head's charts."
            exit 1
          fi
          python "$RUNNER_TEMP/grader/$script" --root "$GITHUB_WORKSPACE"
