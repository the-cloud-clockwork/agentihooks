name: Semgrep

on:
  workflow_call:
    inputs:
      base:
        description: Revision whose findings are already known
        type: string
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep==1.177.0 pyyaml==6.0.2

      # Each domain rule under .semgrep must fire on every ruleid line of each of its fixtures and find nothing in the code.
      - name: Domain rules hold on their fixtures and the code
        run: |
          for rule in .semgrep/*.yml; do
            for fixture in "${rule%.yml}".*; do
              [[ "$fixture" == "$rule" ]] || semgrep --metrics off --test --config "$rule" "$fixture"
            done
          done
          semgrep scan --error --strict --metrics off --config .semgrep .

      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      # The timer guard reads source only, so a CronJob a chart template renders is checked on the rendered manifests.
      - name: Charts render no CronJob outside the scheduler
        run: python tests/ci_charts/chart_timers.py

      - name: Resolve the merge base of the head and the base
        id: baseline
        env:
          BASE: ${{ inputs.base }}
        run: |
          sha="$(git merge-base "$BASE" HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Actions are pinned to release tags by fleet policy, so the mutable tag rule only repeats it.
      # A rule that times out drops its new findings; an installer taint rule timed out at the default 5 s in a baseline scan.
      # The shell injection rule takes 20 ms on the Tests workflow yet once stalled past 30 s, so a scan whose only errors are timeouts runs once more.
      - name: Fail on findings new against the base
        env:
          BASE: ${{ steps.baseline.outputs.sha }}
        run: >-
          python scripts/ci_semgrep.py semgrep scan --error --strict --verbose --timeout 30 --metrics off
          --config p/ci --config p/secrets --config p/python
          --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
          --baseline-commit "$BASE"
