name: Worker resources

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches-ignore: [main, dev, 'diffcheck/**']
    paths:
      - tests/performance/swarm_v2/workloads/**
      - scripts/swarm_v2/resource_*.py
      - .github/workflows/worker-resources.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Worker resources' && github.event_name == 'push' && format('worker-resources-{0}', github.ref) || github.workflow == 'Worker resources' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('worker-resources-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Worker resources' && github.event_name != 'push' && 'max' || 'single' }}

jobs:
  measure:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-batch' || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
      SV2_FAKE_CREDENTIAL: fixture-not-a-credential-4b1f
      EVIDENCE: ${{ github.workspace }}/worker-resources
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'

      - name: Install the browser the browser workload drives
        timeout-minutes: 6
        uses: ./.github/actions/browser-cache

      - name: Measure the worker resource suite
        run: |
          source="Worker resources run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT} at ${GITHUB_SHA}"
          python -m scripts.swarm_v2.resource_bench run --suite tests/performance/swarm_v2/workloads/suite.json \
            --root "$RUNNER_TEMP/worker-resources" --generation "$((GITHUB_RUN_NUMBER * 10))" \
            --source "$source" --output "$EVIDENCE/measurements.json"
          python -m scripts.swarm_v2.resource_bench run --suite tests/performance/swarm_v2/workloads/suite.json \
            --root "$RUNNER_TEMP/worker-resources" --generation "$((GITHUB_RUN_NUMBER * 10 + 1))" \
            --source "$source, independent repeat" --output "$EVIDENCE/repeat.json"
          python -m scripts.swarm_v2.resource_bench run --suite tests/performance/swarm_v2/workloads/suite-update.json \
            --root "$RUNNER_TEMP/worker-resources" --generation "$((GITHUB_RUN_NUMBER * 10 + 2))" \
            --source "$source" --output "$EVIDENCE/update.json"

      - name: Derive profiles against the recorded Anton nodes
        run: |
          python -m scripts.swarm_v2.resource_bench derive --measurements "$EVIDENCE/measurements.json" \
            --nodes tests/fixtures/swarm_v2/worker-resources/nodes.json \
            --output "$EVIDENCE/report.json" --markdown "$EVIDENCE/report.md"
          cat "$EVIDENCE/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to publish a record holding the fake credential
        run: |
          test -s "$EVIDENCE/measurements.json"
          found=0
          grep -rlq "$SV2_FAKE_CREDENTIAL" "$EVIDENCE" || found=$?
          test "$found" -eq 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: worker-resources
          path: ${{ env.EVIDENCE }}
          retention-days: 7
