name: Swarm image

on:
  push:
    branches: [dev]
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""
      ref:
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ inputs.version && 'swarm-image-release' || format('swarm-image-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss' || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: tags
        env:
          IMAGE: ghcr.io/the-cloud-clockwork/agentihooks-swarm
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo 'tags<<EOF'
            if [[ -n "$VERSION" ]]; then
              echo "$IMAGE:$VERSION"
              echo "$IMAGE:release"
            else
              echo "$IMAGE:dev"
              echo "$IMAGE:dev-${GITHUB_SHA:0:7}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=swarm
          cache-to: type=gha,mode=max,scope=swarm
