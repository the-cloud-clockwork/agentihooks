name: t89 probe

on:
  push:
    branches: [engineer-d44a5a-0246]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [control-head, control-dev, real-head]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install
        run: |
          uv venv "$HOME/venv"
          uv pip install --python "$HOME/venv/bin/python" --excludes .github/test-excludes.txt -e ".[dev,all]"
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
      - name: Run
        env:
          LEG: ${{ matrix.leg }}
        run: bash .github/t89/probe.sh
