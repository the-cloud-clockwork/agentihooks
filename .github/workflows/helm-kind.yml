name: Helm chart in kind

on:
  push:
    branches: ["diffcheck/**"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Helm chart in kind' && format('hosted-lane-{0}', (endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a' || (endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b' || 'c') || format('helm-kind-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Helm chart in kind' && 'max' || 'single' }}

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIND_VERSION: v0.33.0
      KIND_NODE_IMAGE: mirror.gcr.io/kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install kind
        run: |
          if ! kind version; then
            curl -fsSLo kind-linux-amd64 "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64"
            curl -fsSLo kind.sha256sum "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-amd64.sha256sum"
            sha256sum -c kind.sha256sum
            mv kind-linux-amd64 kind
            sudo install -m 0755 kind /usr/local/bin/kind
            kind version
          fi
          helm version --short
          kubectl version --client
      - name: Lint, install and prove the chart in kind
        run: bash deploy/helm/agentihooks-swarm/ci/kind-smoke.sh
