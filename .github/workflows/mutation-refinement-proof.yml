name: Mutation refinement proof

on:
  workflow_dispatch:
  push:
    branches: ['diffcheck/refinement-*']

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  refine:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      SOURCE_RUN: "44118668170"
      BASES: 4a742999ceb69cab7cfacf9ebe660250e4bf8073
      MUTATION_SHARD_CPU_QUOTA: "3"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 74f587181bce30950f1f656d374beaaf02f414e8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Take the helper scripts from the workflow revision
        run: |
          git fetch --no-tags origin "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/workflow"
          git archive "$GITHUB_SHA" .github/scripts .github/test-requirements.lock | tar -x -C "$RUNNER_TEMP/workflow"

      - name: Install dependencies
        run: bash "$RUNNER_TEMP/workflow/.github/scripts/pypi-retry.sh" "Install dependencies" -- uv pip install --system --constraint "$RUNNER_TEMP/workflow/.github/test-requirements.lock" "mutmut==3.6.0" "pytest>=8.0,<9.2" "pyyaml>=6.0" "tomlkit>=0.12"

      - name: Download planned mutation test selection
        uses: actions/download-artifact@v8.0.2
        with:
          name: mutation-selection
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Download the shared mutation stats
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mutation-stats-*
          path: .mutation-stats
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Keep identical inputs for the full install
        run: cp -a .mutation-stats "$RUNNER_TEMP/full-stats"

      - name: Refine mutation shards with the planning install
        run: |
          status=0
          python -m scripts.ci_mutation.measured --bases "$BASES" --stats .mutation-stats > "$RUNNER_TEMP/planning.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/planning.log"
          echo "$status" > "$RUNNER_TEMP/planning.status"

      - name: Install the full editable dependency set
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AGENTIHOOKS: 0.dev${{ github.run_number }}
        run: uv pip install --system --constraint "$RUNNER_TEMP/workflow/.github/test-requirements.lock" --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Refine mutation shards with the full install
        run: |
          status=0
          python -m scripts.ci_mutation.measured --bases "$BASES" --stats "$RUNNER_TEMP/full-stats" > "$RUNNER_TEMP/full.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/full.log"
          echo "$status" > "$RUNNER_TEMP/full.status"

      - name: Download the source run's measured plan
        uses: actions/download-artifact@v8.0.2
        with:
          name: mutation-measured-plan
          path: source-plan
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Compare the plans
        run: |
          cmp "$RUNNER_TEMP/planning.status" "$RUNNER_TEMP/full.status"
          cmp "$RUNNER_TEMP/planning.log" "$RUNNER_TEMP/full.log"
          cmp .mutation-stats/plan.json "$RUNNER_TEMP/full-stats/plan.json"
          echo "Exit $(cat "$RUNNER_TEMP/planning.status"); the planning install and the full install wrote identical output and byte identical measured plans"
          python - .mutation-stats/plan.json source-plan/plan.json <<'PY'
          import json
          import sys
          from pathlib import Path

          ours, source = (json.loads(Path(path).read_text()) for path in sys.argv[1:])
          print(f"Source run measured shards {source['shards']}; proof measured shards {ours['shards']}")
          print(f"Same assignments as the source run: {ours['assignments'] == source['assignments']}")
          PY

  replan:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      SOURCE_RUN: "44108003001"
      MUTATION_SHARD_CPU_QUOTA: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 58401af13fd4b0745d707a974acb766764932ce5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Take the helper scripts from the workflow revision
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/workflow"
          git archive "$GITHUB_SHA" .github/scripts .github/test-requirements.lock | tar -x -C "$RUNNER_TEMP/workflow"

      - name: Take the upload action from the workflow revision
        run: |
          mkdir -p .workflow-revision
          git archive "$GITHUB_SHA" .github/actions/retry-upload | tar -x -C .workflow-revision

      - name: Install dependencies
        run: bash "$RUNNER_TEMP/workflow/.github/scripts/pypi-retry.sh" "Install dependencies" -- uv pip install --system --constraint "$RUNNER_TEMP/workflow/.github/test-requirements.lock" "mutmut==3.6.0" "pytest>=8.0,<9.2" "pyyaml>=6.0" "tomlkit>=0.12"

      - name: Download the measured mutation plan
        uses: actions/download-artifact@v8.0.2
        with:
          name: mutation-measured-plan
          path: .mutation-stats
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Download the early mutation results
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: mutation-probe-*
          path: .mutation-stats
          merge-multiple: true
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Keep identical inputs for the full install
        run: cp -a .mutation-stats "$RUNNER_TEMP/full-stats"

      - name: Size the shards with the planning install
        run: |
          status=0
          python -m scripts.ci_mutation.probed --stats .mutation-stats --budget 1080 > "$RUNNER_TEMP/planning.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/planning.log"
          echo "$status" > "$RUNNER_TEMP/planning.status"

      - name: Upload the probed mutation plan
        uses: ./.workflow-revision/.github/actions/retry-upload
        with:
          name: refinement-proof-probed-plan
          path: .mutation-stats/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Install the full editable dependency set
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_AGENTIHOOKS: 0.dev${{ github.run_number }}
        run: uv pip install --system --constraint "$RUNNER_TEMP/workflow/.github/test-requirements.lock" --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Size the shards with the full install
        run: |
          status=0
          python -m scripts.ci_mutation.probed --stats "$RUNNER_TEMP/full-stats" --budget 1080 > "$RUNNER_TEMP/full.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/full.log"
          echo "$status" > "$RUNNER_TEMP/full.status"

      - name: Download the source run's probed plan
        uses: actions/download-artifact@v8.0.2
        with:
          name: mutation-plan-probed
          path: source-plan
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Compare the plans
        run: |
          cmp "$RUNNER_TEMP/planning.status" "$RUNNER_TEMP/full.status"
          cmp "$RUNNER_TEMP/planning.log" "$RUNNER_TEMP/full.log"
          cmp .mutation-stats/plan.json "$RUNNER_TEMP/full-stats/plan.json"
          echo "Exit $(cat "$RUNNER_TEMP/planning.status"); the planning install and the full install wrote identical output and byte identical probed plans"
          python - .mutation-stats/plan.json source-plan/plan.json <<'PY'
          import json
          import sys
          from pathlib import Path

          ours, source = (json.loads(Path(path).read_text()) for path in sys.argv[1:])
          print(f"Source run probed shards {source['shards']}; proof probed shards {ours['shards']}")
          print(f"Same assignments as the source run: {ours['assignments'] == source['assignments']}")
          PY
