name: Swarm worker image

on:
  push:
    branches: [dev, 'diffcheck/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Push the qualified image under its commit tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/dev' && format('swarm-node-image-{0}', github.ref) || format('hosted-lane-{0}', (endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a' || (endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b' || 'c') }}
  queue: ${{ github.ref == 'refs/heads/dev' && 'single' || 'max' }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE: agentihooks-worker-candidate:${{ github.sha }}
      INCOMPATIBLE: agentihooks-worker-incompatible-herdr:${{ github.sha }}
      PLANTED: agentihooks-worker-planted-credential:${{ github.sha }}
      REPOSITORY: >-
        ${{ startsWith(github.ref, 'refs/heads/diffcheck/')
        && 'ghcr.io/the-cloud-clockwork/agentihooks-worker-proof'
        || 'ghcr.io/the-cloud-clockwork/agentihooks-worker' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the candidate
        run: >-
          docker build --platform linux/amd64 --build-arg SOURCE_REVISION="$GITHUB_SHA"
          --file docker/swarm-node/Dockerfile --tag "$CANDIDATE" .
      - name: Build the incompatible herdr fixture
        run: >-
          docker build --build-arg WORKER_IMAGE="$CANDIDATE" --tag "$INCOMPATIBLE"
          tests/contracts/image_manifest/incompatible-herdr
      - name: Refuse the incompatible herdr fixture
        run: |
          out="$RUNNER_TEMP/worker-image-attestation/incompatible"
          if bash docker/swarm-node/qualify.sh "$INCOMPATIBLE" "$out" "$GITHUB_SHA"; then
            echo "incompatible herdr fixture qualified" >&2
            exit 1
          fi
          jq -e '.promotable == false and .report.worker_image_qualified_targets == 2
            and .report.targets.herdr.qualified == false' "$out/attestation.json"
      - name: Qualify the candidate
        run: bash docker/swarm-node/qualify.sh "$CANDIDATE" "$RUNNER_TEMP/worker-image-attestation/candidate" "$GITHUB_SHA"
      - name: Requalify the candidate independently
        run: |
          out="$RUNNER_TEMP/worker-image-attestation"
          bash docker/swarm-node/qualify.sh "$CANDIDATE" "$out/repeat" "$GITHUB_SHA"
          jq -S .report "$out/candidate/attestation.json" > "$out/candidate-report.json"
          jq -S .report "$out/repeat/attestation.json" > "$out/repeat-report.json"
          diff "$out/candidate-report.json" "$out/repeat-report.json"
      - name: Build the planted credential fixture
        run: >-
          docker build --build-arg WORKER_IMAGE="$CANDIDATE" --tag "$PLANTED"
          tests/contracts/image_manifest/planted-credential
      - name: Refuse the planted credential fixture
        run: |
          out="$RUNNER_TEMP/worker-image-attestation/planted-scan"
          status=0
          bash docker/swarm-node/scan.sh "$PLANTED" "$out" || status=$?
          if [[ "$status" != 1 ]]; then
            echo "planted credential fixture was not refused (exit $status)" >&2
            exit 1
          fi
          grep -qE '^github-app-token (.*/)?opt/agentihooks/\.build-token$' "$out/findings.txt"
      - name: Scan the candidate for credentials
        run: bash docker/swarm-node/scan.sh "$CANDIDATE" "$RUNNER_TEMP/worker-image-attestation/candidate-scan"
      - name: Log in to the registry
        if: >-
          (github.event_name == 'push' || inputs.publish)
          && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/diffcheck/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the qualified candidate
        if: >-
          (github.event_name == 'push' || inputs.publish)
          && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/diffcheck/'))
        run: |
          out="$RUNNER_TEMP/worker-image-attestation/candidate"
          bash docker/swarm-node/publish.sh "$CANDIDATE" "$REPOSITORY" "$GITHUB_SHA" "$out"
          jq -r '"digest: \(.digest)  promoted: \(.promoted)  replayed: \(.replayed)"' "$out/promoted.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Move the floating dev tag to the published digest
        if: (github.event_name == 'push' || inputs.publish) && github.ref == 'refs/heads/dev'
        run: |
          digest="$(jq -r .digest "$RUNNER_TEMP/worker-image-attestation/candidate/promoted.json")"
          docker buildx imagetools create --tag "$REPOSITORY:dev" "$REPOSITORY@$digest"
      - name: Upload the attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-worker-image-attestation
          path: ${{ runner.temp }}/worker-image-attestation
