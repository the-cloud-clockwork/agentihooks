name: Mutation preflight

on:
  workflow_call:
    inputs:
      base:
        type: string
        required: true
  push:
    branches-ignore: [dev, main, "gh-readonly-queue/**", "wip/**"]

concurrency:
  group: mutation-preflight-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  pull-request:
    if: ${{ github.event_name == 'push' && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      open: ${{ steps.open.outputs.open }}
    steps:
      - name: Skip when the branch already has an open pull request into dev
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" --jq '[.[] | select(.base.ref == "dev")] | length')
          if [[ $count == 0 ]]; then echo open=false; else echo open=true; fi >> "$GITHUB_OUTPUT"

  mutation:
    needs: pull-request
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.pull-request.outputs.open == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow == 'Mutation preflight' && format('hosted-lane-{0}', (endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a' || (endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b' || 'c') || format('mutation-preflight-job-{0}', github.run_id) }}
      queue: ${{ github.workflow == 'Mutation preflight' && 'max' || 'single' }}
    env:
      BASE: ${{ inputs.base || 'origin/dev' }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record the revisions the report grades
        run: |
          mkdir -p .mutation-gate
          printf '{"base": "%s", "head": "%s"}\n' "$(git merge-base "$BASE" HEAD)" "$(git rev-parse HEAD)" > .mutation-gate/scope.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          enable-cache: false

      - name: Install dependencies
        run: uv pip install --system --excludes .github/test-excludes.txt -e ".[dev,all]"

      - name: Resolve the branch's own mutation bases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.ci_mutation.plan --base "$BASE"

      - name: Select mutation tests before browser setup
        id: selection
        env:
          BASES: ${{ steps.plan.outputs.bases }}
        run: python -m scripts.ci_mutation.browser --bases "$BASES"

      - name: Install the browser that page tests drive
        id: browser
        if: steps.selection.outputs.browser == 'true'
        timeout-minutes: 2
        uses: ./.github/actions/browser-cache

      - name: Report browser setup failure
        if: failure() && steps.browser.outcome == 'failure'
        run: |
          echo "::error::Chromium setup failed or exceeded its two minute timeout; mutation tests cannot run."
          exit 1

      - name: Mutate changed Python files
        env:
          BASES: ${{ steps.plan.outputs.bases }}
          PYTHONUNBUFFERED: "1"
        run: python -m scripts.ci_mutation --bases "$BASES" --budget 1080

      - name: Upload complete mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-preflight-report
          path: .mutation-gate/
          include-hidden-files: true
          retention-days: 7
