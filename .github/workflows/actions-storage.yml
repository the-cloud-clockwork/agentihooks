name: Actions storage

# GitHub bills artifact storage of private repositories against the organisation's included 2 GB.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mint the artifact pruning token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.AGENTICORE_APP_ID }}
          private-key: ${{ secrets.AGENTICORE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-metadata: read
          permission-pull-requests: read
      - name: Delete expired and superseded artifacts in private repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python -m scripts.ci_storage --owner "$GITHUB_REPOSITORY_OWNER" --apply
      - name: Keep the storage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: actions-storage-report
          path: storage-report.json
          if-no-files-found: warn
          retention-days: 7
