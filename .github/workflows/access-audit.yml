name: Weekly runner access audit

on:
  push:
    branches: [dev]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && github.triggering_actor == 'github-merge-queue[bot]') && 'anton-oss-light' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow parser
        run: python -m pip install 'pyyaml>=6.0'
      - name: List collaborators and installed apps against protected approvals
        env:
          GH_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN }}
        run: python -m scripts.ci_access_audit --repo "$GITHUB_REPOSITORY"
      - name: Notify the operator of unapproved or unreadable access
        if: ${{ always() }}
        env:
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASS: ${{ secrets.NTFY_PASS }}
        run: |
          if [[ ! -f access-alert.txt ]]; then
            printf '%s\n' "GitHub access audit could not complete for $GITHUB_REPOSITORY; inspect this run." > access-alert.txt
          fi
          if [[ -s access-alert.txt ]]; then
            curl --fail --silent --show-error \
              --user "$NTFY_USER:$NTFY_PASS" \
              -H 'Title: GitHub runner access requires approval' \
              -H 'Priority: high' \
              --data-binary @access-alert.txt \
              'https://ntfy.homeofanton.com/anton-alerts'
          fi
      - name: Preserve complete access inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runner-access-inventory
          path: access-report.json
          if-no-files-found: error
          retention-days: 90
