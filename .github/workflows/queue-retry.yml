name: Queue retry

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    if: github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install "pyyaml>=6.0"

      - name: Classify the failed jobs
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python -m scripts.ci_queue_retry --repo "$GITHUB_REPOSITORY" --run-id "$RUN_ID"

      - name: Rerun the lost unit shards once
        if: steps.classify.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
