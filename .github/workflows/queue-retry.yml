name: Queue retry

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    if: github.event.workflow_run.event == 'merge_group' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled') && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install "pyyaml>=6.0"

      - name: Classify the failed jobs
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python -m scripts.ci_queue_retry --repo "$GITHUB_REPOSITORY" --run-id "$RUN_ID"

      - name: Log the requeue a runner loss would make
        if: steps.classify.outputs.requeue == 'true' && vars.QUEUE_RETRY_ENFORCE == 'false'
        env:
          PULL: ${{ steps.classify.outputs.pull }}
        run: |
          echo "::notice::Log only, runner loss would requeue pull request $PULL once"

      - name: Mint the TCC Main CI queue token
        id: app-token
        if: steps.classify.outputs.requeue == 'true' && vars.QUEUE_RETRY_ENFORCE != 'false'
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Requeue the pull request once
        if: steps.classify.outputs.requeue == 'true' && vars.QUEUE_RETRY_ENFORCE != 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE: ${{ steps.classify.outputs.node }}
          HEAD: ${{ steps.classify.outputs.head }}
        run: >-
          gh api graphql
          -f query='mutation($pull: ID!, $head: GitObjectID!) { enqueuePullRequest(input: {pullRequestId: $pull, expectedHeadOid: $head}) { mergeQueueEntry { position } } }'
          -f pull="$NODE" -f head="$HEAD"
