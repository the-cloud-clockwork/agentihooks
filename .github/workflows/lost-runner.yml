name: Lost runner

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install "pyyaml>=6.0"

      - name: Mint the TCC Main CI watchdog token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.TCC_CI_CLIENT_ID }}
          private-key: ${{ secrets.TCC_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-actions: write
          permission-organization-self-hosted-runners: read

      - name: Cancel stalled Tests runs and rerun their failed jobs once
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONUNBUFFERED: "1"
        run: python -m scripts.ci_lost_runner --repo "$GITHUB_REPOSITORY"
