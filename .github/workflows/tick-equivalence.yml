name: Tick equivalence

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      base:
        description: Base revision to compare with the dispatched head
        type: string
        default: dev
        required: true
      tick_plant:
        description: Drop a reap action and fail the tick proof outward
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Tick equivalence' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('tick-equivalence-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Tick equivalence' && 'max' || 'single' }}

jobs:
  tick-equivalence:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v7
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || inputs.base || github.event.before || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install replay dependencies
        env:
          UV_CONSTRAINT: head/.github/test-constraints.txt
        run: uv pip install --system --excludes head/.github/test-excludes.txt -e './head[dev,all]'
      - name: Refuse tick steps without a feature entry and a scenario
        working-directory: head
        run: python -m scripts.tick.catalogue check
      - name: Hold the unmapped tick steps to a shrink only list from the base grader copy
        run: |
          grader=head
          if [[ -f base/scripts/tick/catalogue.py ]]; then
            grader=base
          fi
          cd "$grader"
          python -m scripts.tick.catalogue shrink --base "$GITHUB_WORKSPACE/base" --head "$GITHUB_WORKSPACE/head"
      - name: Hold the tick step pattern from the base grader copy
        run: |
          grader=head
          if [[ -f base/scripts/tick_pattern.py ]]; then
            grader=base
          fi
          cd "$grader"
          python -m scripts.tick_pattern --base "$GITHUB_WORKSPACE/base" --head "$GITHUB_WORKSPACE/head"
      - name: Round trip a scaffolded step through its check, the catalogue and the pattern
        env:
          PYTHONPATH: ${{ runner.temp }}/scaffold-round-trip
        run: |
          if [[ ! -f head/scripts/tick/new_step.py ]]; then
            if [[ -f base/scripts/tick/new_step.py ]]; then
              echo "::error::The head removes the step scaffold the base holds"
              exit 1
            fi
            echo "::notice::The head predates the step scaffold; round trip skipped"
            exit 0
          fi
          copy="$PYTHONPATH"
          cp -a head "$copy"
          cd "$copy"
          python -c 'import sys, scripts; assert scripts.__file__.startswith(sys.argv[1] + "/"), scripts.__file__' "$copy"
          python -m scripts.tick.new_step "round trip probe" --group round-trip --lane tick --interval 120 \
            --effects ledger --feature tick-step-round-trip --module round_trip > written.txt
          xargs -r -d '\n' git add -- < written.txt
          python -m scripts.tick.new_step --check "round trip probe"
          python -m scripts.tick.catalogue check
          grader="$GITHUB_WORKSPACE/head"
          if [[ -f "$GITHUB_WORKSPACE/base/scripts/tick_pattern.py" ]]; then
            grader="$GITHUB_WORKSPACE/base"
          fi
          cd "$grader"
          python -m scripts.tick_pattern --base "$GITHUB_WORKSPACE/head" --head "$copy"
      - name: Hold every tick scenario step to its floor and fail an abandoned step
        working-directory: head
        env:
          TICK_BUDGET_FLOORS: ${{ runner.temp }}/tick-step-floors.json
          TICK_BUDGET_OUTPUT: ${{ github.workspace }}/tick-budget-evidence
        run: |
          gate=tests/swarm/tick_scenarios/test_step_budgets.py
          if [[ -f "../base/$gate" ]]; then
            cp "../base/$gate" "$gate"
          fi
          (cd ../base && python -c 'import json; from scripts.tick.steps.budgets import FLOORS; print(json.dumps({name: budget.floor_s for name, budget in FLOORS.items()}))') > "$TICK_BUDGET_FLOORS"
          python -m pytest tests/swarm/tick_scenarios/test_step_budgets.py -n 0 --tb=short
      - name: Replay tick scenarios on base and head concurrently and check the dropped action
        env:
          TICK_EQUIVALENCE_PLANT: ${{ inputs.tick_plant && '1' || '0' }}
        run: bash head/tests/swarm/tick_equivalence.sh
      - name: Hold the simulated tick load to its pass budget
        run: |
          git -C head fetch --no-tags --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev
          cd head
          python -m pytest tests/swarm/test_tick_load.py -n 0 --tb=short
      - name: Record the tick equivalence proof
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo "Tick equivalence proof $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./head/.github/actions/retry-upload
        if: always()
        with:
          after-cancel: true
          name: tick-equivalence
          path: |
            tick-evidence
            tick-budget-evidence
          if-no-files-found: error
          retention-days: 7
