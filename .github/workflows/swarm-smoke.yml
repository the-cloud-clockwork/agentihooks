name: Swarm container smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow == 'Swarm container smoke' && format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') || format('swarm-smoke-{0}', github.run_id) }}
  queue: ${{ github.workflow == 'Swarm container smoke' && 'max' || 'single' }}

jobs:
  smoke:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && (github.event_name == 'merge_group' && 'anton-oss-queue' || 'anton-oss') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      SWARM_SMOKE_IMAGE: local/agentihooks-swarm:clients-check
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Pull the Python base with bounded retries
        run: bash scripts/packaging/pull-runtime-image.sh mirror.gcr.io/library/python:3.12-slim-bookworm
      - name: Build the swarm image
        id: build
        run: |
          docker build -t local/agentihooks-swarm:clients-check --output type=image,compression=uncompressed . &
          build=$!
          status=0
          bash scripts/packaging/pull-runtime-image.sh public.ecr.aws/docker/library/redis:7 &&
            docker tag public.ecr.aws/docker/library/redis:7 mirror.gcr.io/library/redis:7 &
          redis=$!
          bash scripts/packaging/pull-runtime-image.sh public.ecr.aws/docker/library/nats:2.15.1-alpine &&
            docker tag public.ecr.aws/docker/library/nats:2.15.1-alpine mirror.gcr.io/library/nats:2.15.1-alpine &
          nats=$!
          bash scripts/packaging/pull-runtime-image.sh public.ecr.aws/docker/library/redis:7-alpine &&
            docker tag public.ecr.aws/docker/library/redis:7-alpine mirror.gcr.io/library/redis:7-alpine || status=$?
          wait "$redis" || status=$?
          wait "$nats" || status=$?
          wait "$build" || status=$?
          exit "$status"
      - name: Run the hive launch, Compose install, hive join and Compose hive scenarios in parallel
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SWARM_SMOKE_RUNTIME_IMAGES_READY: 'true'
        run: >-
          bash scripts/packaging/swarm-smoke-parallel.sh
          scripts/packaging/hive-launch-smoke.sh
          scripts/packaging/swarm-smoke.sh
          scripts/packaging/hive-join-smoke.sh
          scripts/packaging/compose-hive-smoke.sh
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          python-version: '3.12'
      - name: Bring up the local stack twice with swarm init from the installed package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SWARM_SMOKE_RUNTIME_IMAGES_READY: 'true'
        run: bash scripts/packaging/swarm-init-smoke.sh
      - name: Prove image pulls tolerate an absent attestation
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/packaging/hive-launch-attestation-proof.sh
      - name: Run the pinned herdr and ssh clients inside the swarm image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash scripts/packaging/swarm-image-clients.sh local/agentihooks-swarm:clients-check
