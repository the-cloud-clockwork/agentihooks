name: Ledger equivalence

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      base:
        description: Base revision to compare with the dispatched head
        type: string
        default: dev
        required: true
      tick_plant:
        description: Drop a reap action and fail the tick proof outward
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max
  cancel-in-progress: false

jobs:
  ledger-equivalence:
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss' || 'ubuntu-latest' }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 2
      - name: Select the dev parent of the tested merge
        id: comparison-base
        run: echo "sha=$(git -C head rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ steps.comparison-base.outputs.sha }}
      - name: Pick the protected grader
        run: |
          if [[ -f base/tests/swarm_ledger/equivalence.sh ]]; then
            echo "GRADER=$PWD/base" >> "$GITHUB_ENV"
          else
            echo "::warning::The base predates the protected equivalence grader; the head copy grades this run."
            echo "GRADER=$PWD/head" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install dependencies
        env:
          UV_CONSTRAINT: head/.github/test-constraints.txt
        run: uv pip install --system --excludes head/.github/test-excludes.txt -e './head[dev,all]'
      - name: Plant a dropped checkbox update and a dropped chat recipient in copies of head
        run: bash "$GRADER/tests/swarm_ledger/equivalence.sh" plant
      - name: Replay and compare base, head and the planted checkbox fault
        run: bash "$GRADER/tests/swarm_ledger/equivalence.sh" store
      - name: Install the page replay browser
        timeout-minutes: 6
        uses: ./base/.github/actions/browser-cache
      - name: Replay and compare base, head and the planted chat fault pages
        run: bash "$GRADER/tests/swarm_ledger/equivalence.sh" page
      - uses: ./head/.github/actions/retry-upload
        if: always()
        with:
          after-cancel: true
          name: ledger-equivalence
          path: |
            base.json
            head.json
            fault.json
            base-page.json
            head-page.json
            fault-page.json
          retention-days: 7

  tick-equivalence:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || inputs.base || github.event.before || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install replay dependencies
        env:
          UV_CONSTRAINT: head/.github/test-constraints.txt
        run: uv pip install --system --excludes head/.github/test-excludes.txt -e './head[dev,all]'
      - name: Replay tick scenarios on base and head concurrently and check the dropped action
        env:
          TICK_EQUIVALENCE_PLANT: ${{ inputs.tick_plant && '1' || '0' }}
        run: bash head/tests/swarm/tick_equivalence.sh
      - name: Record the advisory run for the move pull request
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: echo "Tick equivalence advisory proof $RUN_URL" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./head/.github/actions/retry-upload
        if: always()
        with:
          after-cancel: true
          name: tick-equivalence
          path: tick-evidence
          if-no-files-found: error
          retention-days: 7
