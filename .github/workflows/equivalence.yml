name: Ledger equivalence

on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/swarm_ledger/**
      - tests/swarm_ledger/**
      - .github/workflows/equivalence.yml

permissions:
  contents: read

jobs:
  ledger-equivalence:
    if: contains(github.event.pull_request.body, '<!-- ledger-equivalence -->')
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install dependencies
        run: uv pip install --system --excludes head/.github/test-excludes.txt -e './head[dev,all]'
      - name: Plant a dropped checkbox update and a dropped chat recipient in copies of head
        run: |
          cp -a head fault-store
          cp -a head fault-chat
          python - <<'PY'
          from pathlib import Path
          for path, needle, planted in (
              (
                  Path('fault-store/scripts/swarm_ledger/repository/file.py'),
                  'core.apply_changes(doc, changes or [], ctx)',
                  'core.apply_changes(doc, [], ctx)',
              ),
              (
                  Path('fault-chat/scripts/swarm_ledger/static/js/chat.js'),
                  'return to && !text.startsWith("@") ? `@${to} ${text}` : text;',
                  'return text;',
              ),
          ):
              source = path.read_text()
              assert source.count(needle) == 1
              path.write_text(source.replace(needle, planted))
          PY
      - name: Replay base, head and the planted checkbox fault at once
        run: |
          replay() {
            name=$1
            shift
            if ! "$@" > "$RUNNER_TEMP/$name.log" 2>&1; then
              echo "::group::$name replay failed"
              cat "$RUNNER_TEMP/$name.log"
              echo "::endgroup::"
              return 1
            fi
          }
          replay=head/tests/swarm_ledger
          replay base python $replay/repository_replay.py "$PWD/base" "$RUNNER_TEMP/base-ledger" base.json &
          replay head python $replay/repository_replay.py "$PWD/head" "$RUNNER_TEMP/head-ledger" head.json &
          replay fault python $replay/repository_replay.py "$PWD/fault-store" "$RUNNER_TEMP/fault-ledger" fault.json &
          failed=0
          for job in $(jobs -p); do
            wait "$job" || failed=1
          done
          exit "$failed"
      - name: Compare recorded requests and storage bytes
        run: cmp base.json head.json
      - name: Reject the planted checkbox fault
        run: |
          if cmp -s base.json fault.json; then
            echo 'FAIL: planted checkbox fault escaped the equivalence check'
            exit 1
          fi
          echo 'PASS: identical base and head; planted checkbox fault rejected'
      - name: Install the page replay browser
        timeout-minutes: 2
        uses: ./head/.github/actions/browser-cache
      - name: Replay base, head and the planted chat fault pages at once
        run: |
          replay() {
            name=$1
            shift
            if ! "$@" > "$RUNNER_TEMP/$name.log" 2>&1; then
              echo "::group::$name replay failed"
              cat "$RUNNER_TEMP/$name.log"
              echo "::endgroup::"
              return 1
            fi
          }
          replay=head/tests/swarm_ledger
          replay base-page python -I $replay/page_replay.py "$PWD/base" "$RUNNER_TEMP/base-page" base-page.json &
          replay head-page python -I $replay/page_replay.py "$PWD/head" "$RUNNER_TEMP/head-page" head-page.json &
          replay fault-page python -I $replay/page_replay.py "$PWD/fault-chat" "$RUNNER_TEMP/fault-page" fault-page.json &
          failed=0
          for job in $(jobs -p); do
            wait "$job" || failed=1
          done
          exit "$failed"
      - name: Compare recorded page actions
        run: cmp base-page.json head-page.json
      - name: Reject the planted chat fault
        run: |
          if cmp -s base-page.json fault-page.json; then
            echo 'FAIL: planted chat fault escaped the page equivalence check'
            exit 1
          fi
          echo 'PASS: identical base and head pages; planted chat fault rejected'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-equivalence
          path: |
            base.json
            head.json
            fault.json
            base-page.json
            head-page.json
            fault-page.json
