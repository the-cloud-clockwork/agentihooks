name: Ledger equivalence

on:
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ format('hosted-lane-{0}', ((endsWith(github.run_id, '0') || endsWith(github.run_id, '1') || endsWith(github.run_id, '2')) && 'a') || ((endsWith(github.run_id, '3') || endsWith(github.run_id, '4') || endsWith(github.run_id, '5')) && 'b') || 'c') }}
  queue: max

permissions:
  contents: read

jobs:
  ledger-equivalence:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss' || 'ubuntu-latest' }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The base copy decides, so a pull request cannot skip its own check by editing the trigger.
      - name: Decide from the base branch whether the change reaches the ledger
        id: trigger
        run: |
          if [[ ! -f base/scripts/ci_equivalence_trigger.py ]]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -o pipefail
          python -I base/scripts/ci_equivalence_trigger.py head | tee -a "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.trigger.outputs.run == 'true'
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Install dependencies
        if: steps.trigger.outputs.run == 'true'
        env:
          UV_CONSTRAINT: head/.github/test-constraints.txt
        run: uv pip install --system --excludes head/.github/test-excludes.txt -e './head[dev,all]'
      - name: Plant a dropped checkbox update and a dropped chat recipient in copies of head
        if: steps.trigger.outputs.run == 'true'
        run: |
          cp -a head fault-store
          cp -a head fault-chat
          python - <<'PY'
          from pathlib import Path
          for path, needle, planted in (
              (
                  Path('fault-store/scripts/swarm_ledger/repository/mutation.py'),
                  'rejected = core.apply_changes(doc, changes or [], ctx)',
                  'rejected = core.apply_changes(doc, [], ctx)',
              ),
              (
                  Path('fault-chat/scripts/swarm_ledger/static/js/chat.js'),
                  'return to && !text.startsWith("@") ? `@${to} ${text}` : text;',
                  'return text;',
              ),
          ):
              source = path.read_text()
              assert source.count(needle) == 1
              path.write_text(source.replace(needle, planted))
          PY
      - name: Replay base, head and the planted checkbox fault at once
        if: steps.trigger.outputs.run == 'true'
        run: |
          replay() {
            name=$1
            shift
            if ! "$@" > "$RUNNER_TEMP/$name.log" 2>&1; then
              echo "::group::$name replay failed"
              cat "$RUNNER_TEMP/$name.log"
              echo "::endgroup::"
              return 1
            fi
          }
          scripts=head/tests/swarm_ledger
          replay base python $scripts/repository_replay.py "$PWD/base" "$RUNNER_TEMP/base-ledger" base.json &
          replay head python $scripts/repository_replay.py "$PWD/head" "$RUNNER_TEMP/head-ledger" head.json &
          replay fault python $scripts/repository_replay.py "$PWD/fault-store" "$RUNNER_TEMP/fault-ledger" fault.json &
          failed=0
          for job in $(jobs -p); do
            wait "$job" || failed=1
          done
          exit "$failed"
      - name: Compare recorded requests and stored ledger state
        if: steps.trigger.outputs.run == 'true'
        run: cmp base.json head.json
      - name: Reject the planted checkbox fault
        if: steps.trigger.outputs.run == 'true'
        run: |
          if cmp -s base.json fault.json; then
            echo 'FAIL: planted checkbox fault escaped the equivalence check'
            exit 1
          fi
          echo 'PASS: identical base and head; planted checkbox fault rejected'
      - name: Install the page replay browser
        if: steps.trigger.outputs.run == 'true'
        timeout-minutes: 6
        uses: ./head/.github/actions/browser-cache
      - name: Replay base, head and the planted chat fault pages at once
        if: steps.trigger.outputs.run == 'true'
        run: |
          replay() {
            name=$1
            shift
            if ! "$@" > "$RUNNER_TEMP/$name.log" 2>&1; then
              echo "::group::$name replay failed"
              cat "$RUNNER_TEMP/$name.log"
              echo "::endgroup::"
              return 1
            fi
          }
          scripts=head/tests/swarm_ledger
          replay base-page python -I $scripts/page_replay.py "$PWD/base" "$RUNNER_TEMP/base-page" base-page.json &
          replay head-page python -I $scripts/page_replay.py "$PWD/head" "$RUNNER_TEMP/head-page" head-page.json &
          replay fault-page python -I $scripts/page_replay.py "$PWD/fault-chat" "$RUNNER_TEMP/fault-page" fault-page.json &
          failed=0
          for job in $(jobs -p); do
            wait "$job" || failed=1
          done
          exit "$failed"
      - name: Compare recorded page actions
        if: steps.trigger.outputs.run == 'true'
        run: cmp base-page.json head-page.json
      - name: Reject the planted chat fault
        if: steps.trigger.outputs.run == 'true'
        run: |
          if cmp -s base-page.json fault-page.json; then
            echo 'FAIL: planted chat fault escaped the page equivalence check'
            exit 1
          fi
          echo 'PASS: identical base and head pages; planted chat fault rejected'
      - uses: actions/upload-artifact@v4
        if: always() && steps.trigger.outputs.run == 'true'
        with:
          name: ledger-equivalence
          path: |
            base.json
            head.json
            fault.json
            base-page.json
            head-page.json
            fault-page.json
          retention-days: 7
