name: Mutation self plant

on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/ci_mutation/**
      - tests/mutation_self_plant/**
      - .github/workflows/mutation-self-plant.yml

permissions:
  contents: read

jobs:
  plant:
    runs-on: ${{ (github.event_name != 'pull_request_target' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.actor) && contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor) || (github.event_name == 'merge_group' || github.event_name == 'push' && github.ref == 'refs/heads/dev') && github.actor == 'github-merge-queue[bot]' && (github.triggering_actor == 'github-merge-queue[bot]' || contains(fromJSON('["nestorcolt","agenticore-app[bot]","tcc-main-ci[bot]"]'), github.triggering_actor))) && 'anton-oss' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [kill, survive]
    steps:
      - uses: actions/checkout@v4
        with:
          path: head
      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Pick the protected grader
        run: |
          if [[ -f base/tests/mutation_self_plant/plant.py ]]; then
            echo "GRADER=$PWD/base/tests/mutation_self_plant/plant.py" >> "$GITHUB_ENV"
          else
            echo "::warning::The base predates the protected self plant grader; the head copy grades this run."
            echo "GRADER=$PWD/head/tests/mutation_self_plant/plant.py" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          checksum: '9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6'
          enable-cache: false
      - name: Install dependencies
        working-directory: head
        run: uv pip install --system --excludes .github/test-excludes.txt -e '.[dev,all]'
      - name: Grade the sample with the ${{ matrix.mode }} test through the head mutation gate
        working-directory: head
        env:
          MODE: ${{ matrix.mode }}
          PYTHONPATH: ${{ github.workspace }}/head
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python "$GRADER" "$MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-self-plant-${{ matrix.mode }}
          path: |
            head/.mutation-self-plant/evidence/report.json
            head/.mutation-self-plant/evidence/*/run.log
          include-hidden-files: true
          retention-days: 7
