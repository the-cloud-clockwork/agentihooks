# Codex-native base settings. Profiles override these in their own
# .codex/config.overrides.toml; agentihooks merges into ~/.codex/config.toml
# under [agentihooks.managed] so operator hand-edits survive.
#
# Safe posture by default: a profile that wants full autonomy states
# approval_policy = "never" / sandbox_mode = "danger-full-access" explicitly
# rather than having it inferred from a Claude settings key.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Codex clamps this to the account's server-delivered max_context_window, so
# asking for the published model window yields the ceiling the account
# actually has rather than forcing a window the backend will not serve.
model_context_window = 1050000

# Codex reads <repo>/AGENTS.md as the project doc. Claude-shaped repos carry
# CLAUDE.md instead, and nothing writes an AGENTS.md into them, so the fallback
# is what makes a repo's own instructions reach codex at all.
project_doc_fallback_filenames = ["CLAUDE.md"]

[features]
# The whole hook layer is dead weight without this.
hooks = true

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "context-usage",
  "used-tokens",
  "five-hour-limit",
  "weekly-limit",
]
