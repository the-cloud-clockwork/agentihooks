- name: rig-grade-swarm-hy8
  state:
    task: hy8
    title: Republishing a revised plan moves its phases to the new plan and reconciles slices and tasks
    description: 'Parent: plan hierarchy. After hy3 a published plan gives its phases slices, and republishing a revised plan
      over those phases is refused and leaves an unused plan entry; before it, a revision could be republished, and a planner
      send back can need one. Change: republishing a revised plan for phases that hold slices of an earlier plan moves those
      phases to the new plan, maps each existing slice by its anchor, clears slices whose anchor is gone, and names every
      task whose slice changed or was cleared. No unused plan entry is left on refusal. Done when tests show a revision republish
      succeeding with mapped and cleared slices, and a refused publish leaving no plan entry.'
    kind: code
    profile: engineer
    territory: []
    phase_intent: 'Plan hierarchy: Plans, phases, slices and tasks become one dependency graph with parent links, kept in
      ledger tables beside the document and queried with joins. Old phases are grouped into plans by their plan link, unlinked
      ones under one standalone plan. Parent intent: the operator''s build order step one, so freeze and the dispatcher can
      walk the tree.'
  params:
    id: hy8
    title: Republishing a revised plan moves its phases to the new plan and reconciles slices and tasks
