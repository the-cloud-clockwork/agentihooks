  state:
    task: dur10
    title: Dispatched Tests runs fall back to the newest passed dev durations
    description: 'Parent: Swarm runtime fixes keeps CI runs from wasting minutes. A Tests run dispatched on the default base
      fails its durations job when the newest dev push run has not finished, so a plant dispatch wasted a run. Seam: the durations
      step reads the newest passed dev push run, never an unfinished one, and stays red when no passed run exists. Red test
      first. Done when the pull request merges and a dispatch made while a dev push run is still going passes its durations
