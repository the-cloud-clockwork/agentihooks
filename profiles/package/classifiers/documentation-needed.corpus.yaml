version: 1
notes: Synthetic behavioral and threshold controls for the shared documentation policy.
  These fixture answers do not measure model quality.
cases:
- name: new-command
  state:
    description: A new retry command has no documentation.
    changes: Delivered change evidence
    docs: []
  expected:
    needs_documentation: true
    size: small
  control: false
  samples:
  - source: fixture
    latency_ms: 0
    answers:
      needed:
        type: noul
        noul: 0.95
      covered:
        type: noul
        noul: 0.05
      size:
        type: choice
        choice: small
        confidence: 0.95
  notes: Constructed deterministic replay case; answers are fixtures, not live model
    measurements.
