- name: rig-grade-swarm-doctor-t38
  state:
    title: The red checks detector waits for a head to sit red with no push
    description: 'Parent: the Doctor fixes the system its watched swarm runs on, with proof. The Doctor red checks detector
      raised six findings today (pull requests 1286, 1333, 1353, 1390, 1408 and 1413) within minutes of a push; every one
      was fixed by its engineer and merged, so each was judged noise. The swarm tick already tells an engineer when its pull
      request sits red with no push for twenty minutes. Seams: (1) the detector reports a red head only after it has sat red
      with no new push for the same twenty minutes the tick uses, read from the same setting; (2) a red head with a push since
      resets; (3) a red head past the window is still reported. Red first. Number to move: red check findings on heads that
      got a push and turned green within twenty minutes, replayed over today''s findings before and after; six before, target
      zero, while a head left red past the window is still found.'
