  state:
    title: The master answers agent questions so they leave the operator's Priorities
    description: 'Ledger answers are operator only, so when the master answers an agent''s question by comment, the question
      stays unanswered and sits in the operator''s Priorities. Seam: a ledger answer command lets the master answer a question
