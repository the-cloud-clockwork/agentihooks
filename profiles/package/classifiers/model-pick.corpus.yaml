notes: Seeded from the classifier decision log. Each case state was rebuilt from its ledger and matched to a state digest
  the decision log recorded before seeding; its samples are the answers logged for that digest. Expected verdicts were written
  by a separate reader agent that saw only each case state and its question, never the thresholds or the rule. Model pick
  expectations are the reader's level raised to the lane floor, as the call site raises them.
