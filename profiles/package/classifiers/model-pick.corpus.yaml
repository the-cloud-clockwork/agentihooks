- name: rig-grade-swarm-doctor-fx-9b243b65-tune
  state:
    title: Move the number behind the task cost finding
    description: 'Issue 1252. An agent launch after a merge that changes the profile render stamp re-renders the shared profile
      home in place; every live session on it reloads, drops its thinking and writes its whole context to cache again (task
      mp2 paid this twice, about six hundred eighty thousand tokens). Seams: (1) a launch with a new render stamp gets a fresh
      profile home; (2) a home that live sessions run on is never rewritten; (3) old homes are removed once no live session
      uses them. Red first. Measure whole context cache rewrites per live session across one merge, before and after; target
      zero. The task t20 profile check failures after renders may share this cause: check them in the same proof.'
