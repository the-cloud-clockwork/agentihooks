- name: rig-grade-swarm-doctor-fx-8be892c4-cause
  state:
    title: Find the cause of the inbox no outcome finding
    description: 'Doctor found 379 inbox items in the watched swarm closed done with no outcome named: 228 are notices the
      swarm tick itself sends (red checks, a wait that ended, a pull request still open after merge), 151 are items from engineers,
      ci agents, masters and the operator. Seams: the tick code that sends these notices (is each one a work item or for information
      only), the msg close path that accepts a bare done, and the Doctor inbox no outcome detector. Show with evidence from
      the inbox history which group is a sender bug (notices that should carry the information only flag) and which is a closer
      lapse (a receiver that should name where the work went). Proof: root cause, evidence (item counts by sender and kind,
