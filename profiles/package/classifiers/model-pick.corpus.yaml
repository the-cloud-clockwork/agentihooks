- name: rig-grade-swarm-tc104
  state:
    title: Unit test jobs carry a time limit
    description: The unit test job has no time limit, so a hung shard can run six hours while every newer dev Sonar scan waits
      behind it. Set a job time limit near twice the slowest measured shard so a hung shard fails fast. Done when the pull
