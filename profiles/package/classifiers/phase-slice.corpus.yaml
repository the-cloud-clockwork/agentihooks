        timer and work budget with defaults of fifteen seconds scheduling, five seconds per export attempt and three attempts
        per wake; pending work survives future wakes. Healthy newly available transcript records must be accepted within thirty
        seconds. Timer supervision must keep working during a long active turn and exit with the owner process; handoff drains
