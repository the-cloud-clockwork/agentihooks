- name: rig-grade-swarm-p40-6
  state:
    phase: Swarm brain on Kubernetes
    intent: 'Operator ask: run agentibrain in the Atlas Kubernetes cluster as the swarm brain, with its MCP connected for
      every swarm agent, and the swarm brain vault kept in Atlas storage. Learn first how antoncore ran it in the cluster
      before, how the agentibrain package ships today, and whether the MCP is served by the same server. Two planners pass
      it: the first researches and drafts, the second checks the draft independently and slices it into pull request sized
      tasks. Changes reach the cluster only through antoncore GitOps.'
    overview: 'Borrow what OpenRig does that we lack, while keeping the ledger, quota routing and herdr: durable Claude and
      Codex messaging, seats, intent, work beyond code, swarm health.'
    tasks:
    - id: t116
      title: MCP requires transport authentication in a remote deployment
      description: 'Repository: agentibrain-kernel. Parent: Swarm brain on Kubernetes serves the shared durable memory mission.
        Seam: remote MCP startup and tools/list authorization. Add a required-auth deployment mode which refuses to start
        or become ready without MCP_PROXY_API_KEY; enable that mode in the portable Helm chart. Keep any supported loopback
        development mode explicitly selected and tested. Preserve X-API-Key interoperability and independent unauthenticated
        health probes. Do not expose a valid endpoint before ESO has delivered the key. Proof contract: CI starts the actual
        built mcp-proxy image: required mode plus absent key refuses startup; missing and wrong client keys cannot list or
        call tools; correct key lists all nine brain tools and calls brain_feed. Prove supported local behavior separately.
        Record red control, green CI, tested SHA and published dev image. Done when one reviewed PR merges into kernel dev.'
      kind: code
      territory:
      - services/mcp
      - helm/mcp
      - tests/test_mcp_transport_auth.py
    - id: t117
      title: Embeddings requires its accepted keys in a remote deployment
      description: 'Repository: agentibrain-kernel. Parent: Swarm brain on Kubernetes serves the shared durable memory mission.
        Seam: embeddings authorization in required-auth mode. Empty API_KEYS currently returns without checking the supplied
        bearer. Make the remote deployment refuse protected operations when no accepted keys are configured, wire the required
        mode in Helm, and document the real API_KEYS environment name. Preserve an explicitly selected supported local mode;
        do not alter model credentials or PostgreSQL behavior. Proof contract: CI red controls for absent, empty and malformed
        accepted-key configuration; required mode cannot embed, search or prune without a valid accepted key; wrong key is
        rejected and correct key succeeds. Health remains diagnostic without granting data access. Record red and green runs
        and SHA. Done when one reviewed PR merges into kernel dev.'
      kind: code
      territory:
      - services/embeddings/src/auth.py
      - helm/embeddings
      - services/embeddings/tests/test_auth.py
    - id: t118
      title: A completed Kubernetes tick includes raw and lesson indexing
      description: 'Repository: agentibrain-kernel. Parent: Swarm brain on Kubernetes serves the shared durable memory mission.
        Seam: requested tick completion. Implement the smallest common Kubernetes cycle that runs maintenance, arc and lesson
        indexing, and raw indexing before requests become completed. The current drain moves completed files before embed_arcs,
        absorbs index failure and omits embed_raw. Index failure must produce failed or retryable status, never completed;
        a replay safely resumes without duplicating accepted writes. Scheduled and requested cycles use the same pipeline.
        Provide a pure vault-processing configuration without workstation transcript extraction or personal amygdala inputs;
        retain supported existing modes explicitly. Proof contract: CI starts from an empty fixture vault, ingests plain text
        plus a lesson marker, requests a tick and proves both text-only and semantic-only reads after completed status. Plant
        an indexing failure and prove no completed status; retry and prove eventual retrieval without duplicate marker entries.
        Dry runs remain nonmutating. Capture red and green runs. Done when one reviewed PR merges into kernel dev and its
        ops dev image publishes.'
      kind: code
      territory:
      - helm/brain-ops
      - services/brain-ops/tick_cycle.py
      - services/brain-ops/Dockerfile
      - services/mcp/app/tools/tick.py
      - tests/test_tick_cycle.py
    - id: t119
      title: Scheduled and requested ticks share one vault writer
      description: 'Repository: agentibrain-kernel. Parent: Swarm brain on Kubernetes serves the shared durable memory mission.
        Seam: two Kubernetes maintenance callers targeting one vault. Serialize the entire mutation and index cycle across
        scheduled and drain Jobs, using an NFS-qualified ownership mechanism with bounded contention and crash recovery. A
        request remains pending when another owner holds the cycle. The owner covers index state and completion publication,
        not only one CronJob lineage. Parameterize ops resource names from a release or explicit fullname so two instances
        do not collide. Continuous amygdala and autonomous keeper stay disabled for this phase. Proof contract: CI overlapping
        scheduled and requested callers prove at most one active writer; process death permits recovery without duplicate
        processing or losing requests; distinct vaults remain independent. Helm render two instance names and confirm disjoint
        resources, including scheduled and drain names. Later deployed proof must repeat contention on the actual NFS mount.
        Done when one reviewed PR merges into kernel dev and the ops dev image publishes.'
      kind: code
      territory:
      - services/brain-ops/tick_cycle.py
      - helm/brain-ops
      - tests/test_tick_cycle_lock.py
    - id: t120
      title: Atlas provisions and backs up the dedicated swarm vault
      description: 'Repository: antoncore. Parent: Swarm brain on Kubernetes serves the shared durable memory mission. Seam:
        a dedicated empty vault root on Atlas durable storage. Declare and reconcile its NFS export, allowed node clients,
        permissions and persistence through reviewed antoncore code and CI deployment; do not edit host boot files through
        diagnostics. Generate instance resource names from configuration. Seed the kernel vault schema using agentibrain scaffold
        through a GitOps-owned bootstrap step. API and ops are its consumers; MCP and agents never mount it. Register vault
        backup and isolated restore into a second root. Existing personal vault and transcript exports are not inputs. Proof
        contract: CI configuration checks reject reuse of the personal vault root and unsafe export scope. Deployed check
        shows the declared export available to approved cluster nodes, correct UID/GID write access, schema bootstrapped,
        durable content after remount and backup restore to a separate fixture root. Retain command outputs and CI/deploy
        evidence without reading vault through filesystem diagnostics; use brain API for content checks after service deployment.
        Done when one reviewed PR merges into antoncore dev and the storage contract is verified.'
      kind: code
      territory:
      - automation/monitors/nfs-exports-check.sh
      - automation/swarm-brain-storage
      - stacks/backup
      - k8s/manifests/swarm-brain-storage
      - tests/swarm_brain_storage
    - id: t121
      title: Atlas provisions isolated brain data and Secret store records
      description: 'Repository: antoncore. Parent: Swarm brain on Kubernetes serves the shared durable memory mission. Seam:
        GitOps bootstrap of dedicated PostgreSQL database/principal and Secret store consumer records. Provision a swarm-only
        pgvector database with the required embedding dimension; revoke cross-database access and do not give agents database
        credentials. Define separate API bearer, MCP transport key, embeddings accepted keys and service credentials. ESO
        reads only the named fields per consumer from ClusterSecretStore secret store, including API_KEYS under its actual
        name. Agents receive only client references. Resolve any inference credential through the reconciler''s real secret/k8s
        mapping; existing brain-inference can supply a service inference credential without changing model authentication,
        but not personal memory credentials. Add this database to backup policy. Use code and CI for reconciliation; never
        print values. Proof contract: CI rejects missing records, wrong key names, broad envFrom and personal database/secret
        references. Deployed ESO reports Ready, bootstrap is idempotent on an existing database volume, pgvector and model
        dimensions match, the swarm principal cannot connect to the personal database, and isolated database backup/restore
        works. Show names and permission results only. Done when one reviewed PR merges into antoncore dev and data/secret
        readiness is verified.'
      kind: code
      territory:
      - k8s/manifests/swarm-brain-secrets
      - automation/swarm-brain-bootstrap
      - stacks/backup/config.json
      - tests/swarm_brain_secrets
