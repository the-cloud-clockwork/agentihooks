- name: rig-grade-swarm-p25-11
  state:
    phase: Engineers never sit idle behind a dependency
    intent: 'Operator decision, locked: a dependency does not stop work. An engineer may claim a task whose dependency is
      open, cut its branch from the dependency''s branch, build what it can, push, and park with a handoff naming the blocker;
      when the blocker merges, the next engineer restacks onto dev and finishes. Territory overlap never serializes the swarm,
      and the tick fills every engineer slot up to the cap. Done when a scratch swarm with a dependency chain ran all engineer
      slots.'
    overview: 'Borrow what OpenRig does that we lack, while keeping the ledger, quota routing and herdr: durable Claude and
      Codex messaging, seats, intent, work beyond code, swarm health.'
    tasks:
    - id: nd1
      title: The ledger records each task's branch and park state
      description: 'Seams: the ledger task update accepts three new fields, branch as a string, stacked base as a string holding
        the dependency head commit a stacked branch was cut from, and parked on as a list of task ids, and refuses other shapes.
        A new swarm branch command records the current worktree branch on the agent''s task after checking the branch exists
        on origin, and swarm pr records the pull request head branch. Dependents start from that branch. Done when tests show
        the ledger keeps the three fields and refuses bad shapes, both commands write the branch, and the pull request is
        merged.'
      kind: code
      territory:
      - scripts/swarm_ledger/ledger_tasks.py
      - scripts/swarm/cli.py
      - tests/swarm_ledger/test_task_state_guard.py
      - tests/swarm/test_cli.py
    - id: nd2
      title: A new worktree can start from a dependency branch
      description: 'Seam: wt.sh new accepts a from option naming a ref, such as the origin copy of a dependency branch, and
        cuts the code named worktree branch from it instead of origin dev. Name rules, refusals and limits stay unchanged,
        and done still judges merged against origin dev. Done when the worktree skill test proves new with a from ref starts
        at that ref, the default still starts at origin dev, and the pull request is merged.'
      kind: code
      territory:
      - profiles/package/skills/worktree
      - tests/test_worktree_skill.py
    - id: nd3
      title: The tick starts a task whose dependency is still open
      description: 'Seam: the tick''s claimable rule admits an open task whose unfinished dependencies are each claimed or
        in pr and carry a recorded branch, a stacked start, and the spawned task carries those dependency branches as its
        stack base. A task with parked on set stays unclaimable until every task it names is done, then is claimed with its
        parked handoff, a finish claim. A dependency that is open, blocked or has no branch still holds the task. Done when
        tick tests cover a stacked start, a held parked task, a finish claim after the blocker merges and a dependency without
        a branch, and the pull request is merged. Master decision: a stacked start that ends parked does not spend one of
        the task''s three claim lives; only a claim that ends without a park or a merge counts.'
      kind: code
      territory:
      - scripts/swarm/tick.py
      - tests/swarm/test_tick.py
    - id: nd4
      title: Park a stacked task with a handoff naming its blocker
      description: 'Seam: a new swarm park command taking a handoff document. It refuses unless the task has a pushed branch
        and, where the repo has issues, an issue link. It checks the document like swarm handoff, writes parked on with the
        still open dependencies and the stacked base, posts an issue comment naming the branch, comments the ledger task naming
        the blocker in plain words, stores the handoff and retires the agent, so the reaped task reopens and waits. Logic
        lives in a new stack module and the command line only wires it. Done when tests show each refusal, the written fields,
        both comments and the retired agent, and the pull request is merged.'
      kind: code
      territory:
      - scripts/swarm/stack.py
      - scripts/swarm/cli.py
      - tests/swarm/test_stack.py
    - id: nd5
      title: Restack a parked task onto dev once its blocker merges
      description: 'Seam: a new swarm restack command, run by the finishing engineer in its worktree cut from the parked branch.
        It fetches, rebases the work onto origin dev from the stacked base, clears parked on, and on a conflict stops listing
        the conflicted files so the engineer resolves them. Done when tests over a scratch git repository show a clean restack
        after the blocker was squash merged, a conflict report, and the pull request is merged.'
      kind: code
      territory:
      - scripts/swarm/stack.py
      - scripts/swarm/cli.py
      - tests/swarm/test_stack.py
      - docs/pillars/swarm.md
    - id: nd6
      title: Territory overlap orders claims instead of blocking them
      description: 'Seam: the tick''s claimable rule keeps territory only as an order, tasks that overlap no running task
        first, overlapping tasks then fill the remaining slots, and a broad entry never stops a claim. The spawn prompt names
        each running task that shares an area, its claimant and the shared areas, and tells the agent to coordinate through
        the inbox and merge dev before its own merge. Done when tick tests show an overlapping task claimed once the non overlapping
        work is taken, prompt tests show the overlap lines, and the pull request is merged.'
      kind: code
      territory:
      - scripts/swarm/tick.py
      - scripts/swarm/prompt.py
      - tests/swarm/test_tick.py
      - tests/swarm/test_startup_prompts.py
    - id: nd7
      title: Engineer prompts carry the stacked start and finish steps
      description: 'Seams: the code steps tell every engineer to push and record its branch with swarm branch at its first
        commit. A stacked start prompt names the dependency branch, starts the worktree from it with new from, opens or reuses
        the issue, builds what it can, points branch and issue at each other, pushes and parks. A finish prompt, given a parked
        handoff, starts the worktree from the parked branch, runs swarm restack, then finishes the normal cycle. The init
        swarm skill describes stacked claims. Done when prompt tests assert each variant''s steps, the skill gate passes,
        and the pull request is merged.'
      kind: code
      territory:
      - scripts/swarm/prompt.py
      - profiles/package/skills/init-swarm
      - tests/swarm/test_startup_prompts.py
      - tests/swarm/test_reopen_prompt.py
    - id: nd8
      title: The ledger page explains stacked and parked tasks
      description: 'Seam: the page''s task blocker text mirrors the new claim rule. An open task whose unfinished dependencies
        hold branches reads as ready to start on the dependency branch, a parked task reads as parked on its branch until
        its blocker is done, and territory overlap is no longer a waiting reason. Done when page tests cover the three texts,
        a screenshot at 1920 by 1080 of a scratch ledger shows them and is attached to the proof, and the pull request is
        merged.'
      kind: code
      territory:
      - scripts/swarm_ledger/template.html
      - tests/swarm_ledger/test_task_proof_page.py
    - id: nd9
      title: The doctrine states the new claim rule
      description: Non code path in the bundle repository. The Development Doctrine row on task dependencies and territories
        and the swarm lines in section four point one state that a task may start on an unfinished dependency's branch and
        park until that dependency merges, and that territory only orders claims. One bundle pull request with one Standards
        reader, and the agentihooks init output as the gate. Done when the bundle pull request is merged and agentihooks init
        renders the new text.
      kind: code
      territory:
      - agentihooks-bundle doctrines/DEVELOPMENT-DOCTRINE.md
    - id: nd10
      title: Find why engineer slots stay empty while tasks are claimable
      description: 'After the overlap change lands, measure on the live swarm whether engineer slots sit below the engineer
        cap while tasks are claimable, from the tick actions, the gate log and swarm status. Hypotheses to test, not causes:
        finished but unreaped agents counted as busy when the tick spawns, the early return on session capacity starving later
        lanes, and claim cap blocks. Done when the root cause is shown by evidence and fixed by a merged pull request or filed
        as a follow up.'
      kind: troubleshoot
      territory: []
    - id: nd11
      title: 'Proof: a scratch swarm runs a dependency chain with every engineer slot busy'
      description: 'Ops proof of the phase on a scratch ledger folder and a spare port, never the shared ledger server, working
        the swarm scratch repository. Tasks: a chain of three, each depending on the one before, plus one independent task,
        with an engineer cap of two, inside the session caps. Done when both engineer slots ran while the chained tasks had
        open dependencies, they parked on their branches, and each was finished by a new engineer after its blocker merged,
        then the scratch swarm is stopped and removed.'
      kind: ops
      territory: []
