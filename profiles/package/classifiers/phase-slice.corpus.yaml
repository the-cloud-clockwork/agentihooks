- name: rig-grade-swarm-p44-7
  state:
    phase: Duplicate check when adding to the ledger
    intent: 'Operator request: every add to the ledger, tasks first and also follow ups and phases, is checked by the classifier
      against what the ledger already holds before it lands. When the new item repeats an existing one, the writer is told
      which item it repeats, its state, rank and phase, and that it will be built, instead of a duplicate being added. A low
      rank match is fine; the operator wants to know it is there and will be built. A planner slices this phase.'
    overview: 'Borrow what OpenRig does that we lack, while keeping the ledger, quota routing and herdr: durable Claude and
      Codex messaging, seats, intent, work beyond code, swarm health.'
    tasks:
    - id: dup1
      title: 'Duplicate finder: candidate shortlist and classifier verdict'
      description: 'New ledger module with one pure entry that takes the ledger document, the kind of item (task, follow up
        or phase) and one or more new items, plus an injectable classifier decide. Code shortlists a few candidates by word
        overlap on title and description, stdlib only, same kind plus open tasks for a follow up. One batched classifier call,
        purpose ledger duplicate, asks one yes or no per new item and candidate pair: does the new item ask for the same change.
        Follow the grouping candidates then confirm pattern and the priority sweep judge. Per new item it returns the best
        match with its id, kind, title, state, rank, phase and phase title and probability, or none, or unchecked when the
        classifier did not answer. Add the module to the autouse classifier isolation fixtures. Done when the pull request
        merges with tests for a reworded repeat found, a distinct item passing, a done task reported as built, a classifier
        error returning unchecked, and the shortlist capping what is sent.'
      kind: code
      territory:
      - ledger duplicate finder module
      - classifier test isolation fixtures
    - id: dup2
      title: Task add refuses a task the ledger already holds
      description: Wire the duplicate finder into task add on the server, in the mutation path every CLI and ledger client
        add uses, before the locked apply so the ledger write lock is never held across a classifier call. A repeat is refused
        through the existing refusal warnings with plain words naming the existing task id and title, its state, rank and
        phase title, and that it is on the ledger and will be built, or is already built when done. A classifier failure or
        a time budget overrun lets the add land with a warning that the duplicate check did not run. A writer who knows the
        task is distinct passes a not duplicate reason on the CLI and server schema, stored on the task, and the check is
        skipped. Plan and release tasks the tick mints are never checked. Done when the pull request merges with tests through
        the API and the CLI for a refused repeat naming id, state, rank and phase, an override landing with its reason, a
        classifier failure landing with the warning, and a tick plan task never checked.
      kind: code
      territory:
      - ledger mutation API
      - ledger task add
      - ledger CLI task add
      - swarm ledger client
    - id: dup3
      title: Follow up add refuses a repeated follow up or open task
      description: Same wiring as the task add check for follow up adds, compared against open follow ups and open tasks,
        with the same refusal text, not duplicate override and fail open. Done when the pull request merges with tests for
        a repeated follow up, a follow up that repeats an open task, an override and a classifier failure.
      kind: code
      territory:
      - ledger mutation API
      - ledger follow up add
      - ledger CLI follow up add
    - id: dup4
      title: Phase add and plan phases refuse a repeated phase
      description: Same wiring for phase add and for every phase in a plan phases append, compared against existing phases
        by title and description, with the same refusal text, override and fail open. Done when the pull request merges with
        tests for a repeated phase in each op and a mixed batch where only the repeat is refused.
      kind: code
      territory:
      - ledger mutation API
      - ledger phase add and append
      - ledger CLI phase and plan phases
    - id: dup5
      title: Agent docs name the duplicate refusal and its override
      description: 'Prose change: the toolbelt rule ledger rows and the swarm planner and init swarm skills say an add may
        be refused as a duplicate, that the refusal names the existing item with its state, rank and phase, and when to pass
        the not duplicate reason. Done when the pull request merges with the skill gate and agentihooks init output green.'
      kind: code
      territory:
      - agentihooks toolbelt rule
      - swarm planner skill
      - init swarm skill
    - id: dup6
      title: Prove the duplicate check on a scratch ledger with the live classifier
      description: After the task, follow up, phase and seed checks merge, prove them end to end on a scratch ledger on a
        spare port with the live classifier, then remove the scratch ledger. Done when a reworded copy of an existing task,
        follow up and phase is each refused with the existing item named, a distinct item of each kind lands, a new task written
        into the seed page is refused with the warning, and the commands and their output are on the task proof.
      kind: ops
      territory: []
    - id: dup7
      title: Seed merge refuses new tasks, follow ups and phases
      description: In the seed merge, a task, follow up or phase that is new in the HTML seed page is not added; the merge
        records a refusal naming the item title and the ledger command that adds it, so every add goes through the duplicate
        check. Edits to existing items, questions, notes and threads keep merging, and a ledger created from a seed page still
        takes all its items. The swarm ledger skill seed section says items are added only through the ledger commands. Done
        when the pull request merges with tests for a refused new task, follow up and phase from the seed page with the refusal
        warning, an edited title still merging, a new question still merging, and a ledger created from a seed page keeping
        its items.
      kind: code
      territory:
      - ledger seed merge
      - swarm ledger skill seed section
