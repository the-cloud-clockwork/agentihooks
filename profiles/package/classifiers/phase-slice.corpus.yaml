- name: rig-grade-swarm-p24-9
  state:
    phase: Recall from ledgers and swarms
    intent: Operator request. When the operator says remember from the ledger, from the swarm yesterday, or names a task worked
      earlier, any agent finds it through agentihooks MCP tools instead of reading many files. Tools take a swarm or ledger
      identifier, may search across swarms, and cover tasks, comments, chat, follow ups, handoffs, recaps and learned notes.
      A planner decides the retrieval design, embeddings or a graph hierarchy, the chunking strategy and reranking, and slices
      pull request sized tasks. Seats keep durable memory there rather than in harness local memory.
    overview: 'Borrow what OpenRig does that we lack, while keeping the ledger, quota routing and herdr: durable Claude and
      Codex messaging, seats, intent, work beyond code, swarm health.'
    tasks:
    - id: rc1
      title: Recall records from ledger documents
      description: 'Repository agentihooks. Parent: recall from ledgers and swarms, so any agent finds earlier work through
        MCP tools. Seam: a pure function that turns one ledger document into recall records. Cover tasks (title, description,
        contract, proof, pull request and issue links), every comment, phases, questions and answers, follow ups, notes, chat
        and artifact titles. Each record carries a key built from ledger slug, item path and entry id, the swarm slug when
        the ledger runs one, kind, ref path, parent ref, author, time, title and text. Tasks, questions and follow ups take
        time and author from their first ledger event. Snapshot seeds are ignored and entries marked deleted yield no record.
        A chunker splits long bodies on markdown headings, then paragraph windows of about 1200 characters with a stable chunk
        index. Done when the pull request merges with tests on a fixture ledger covering every kind, the event join, deleted
        entries and chunk stability.'
      kind: code
      territory:
      - recall record model
      - recall chunker
      - recall ledger reader
    - id: rc2
      title: Recall archive store on SQLite full text search
      description: 'Repository agentihooks. Parent: recall from ledgers and swarms. Seam: a RecallStore protocol and its SQLite
        implementation in a recall database under the agentihooks home. One FTS5 table with the unicode61 tokenizer keeping
        hyphen and underscore inside tokens so task ids stay whole, plus a records table keyed by record key with content
        hash, source state and parent ref. Upsert writes only changed hashes. The store is an archive: a record missing from
        a later source read because of ledger retention stays searchable, and a source entry marked deleted is removed. WAL
        mode and a busy timeout let the ledger server and the swarm tick write together. A command, agentihooks recall reindex
        with a ledger slug or all, backfills from every ledger file and skips binned ledgers unless asked. Done when the pull
        request merges with tests for upsert, unchanged hash skip, archive after a retention drop, deletion, two concurrent
        writers and the reindex command on a temporary home.'
      kind: code
      territory:
      - recall store
      - recall reindex CLI
    - id: rc3
      title: Recall records from swarm seats, inbox and task folders
      description: 'Repository agentihooks. Parent: recall from ledgers and swarms, where seats keep durable memory instead
        of harness memory. Seam: readers that turn one swarm''s Redis state and task folders into recall records with the
        record model from the ledger reader task. Sources: handoff transfers with the handoff body split on its Handoff v2
        headings plus seat, task, predecessor and successor; current handoffs; seat recaps; learned notes with maturity and
        retired flag, keyed on occupant, time and a text hash rather than list position; the swarm culture; inbox items whose
