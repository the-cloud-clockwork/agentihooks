version: 1
notes: Seeded from the classifier decision log. Historic states for this classifier could not be rebuilt, so each case state
  was rebuilt from its ledger and asked once during seeding on 2026-10-09 UTC; its samples are the answers the decision log
  recorded for that ask. Expected verdicts were written by a separate reader agent that saw only each case state and its question,
  never the thresholds or the rule.
cases:
- name: rig-grade-swarm-p21-12
  state:
    phase: Impeccable audit implementation
    intent: Address all twenty three audit findings across ledger pages, HOME and BIN through reviewed, dependency ordered
      tasks. Preserve the accepted home design, operator overrides and the presentation architecture constraints. Recheck
      each historical finding against current dev, credit existing fixes and give every finding a task or verified resolution.
      Master reviews the planner slice autonomously.
    overview: 'Borrow what OpenRig does that we lack, while keeping the ledger, quota routing and herdr: durable Claude and
      Codex messaging, seats, intent, work beyond code, swarm health.'
    tasks:
    - id: t7
      title: Extract the ledger script into native modules without changing behavior
      description: 'Audit findings: 21. Parent: the Swarm Design System keeps ledger, quota routing, herdr and durable agent
        coordination; this audit phase makes its presentation accessible and its cost proportional to changed resources. Extraction
        only. Move the existing ledger script into cohesive native ES modules for API, state, rendering, outline, layout,
        chat and swarm. Keep the existing seed, endpoints, folds, actions and page geometry. Add same origin module serving
        and page version invalidation. Do not use a framework or bundler; do not turn the inline script into one external
        god file. Seams: existing browser scenarios and recorded requests produce the same DOM and outputs; asset changes
        invalidate the page version. Preserve all existing assertions. Equivalence runs base and head with identical recorded
        inputs and a deliberate fault in moved behavior must turn it red. Rebase on the completed swarm naming and gate label
        changes. Done when: Modules are served and existing page behavior is equivalent. One PR into dev, gates green, Standards
        and Spec reviews closed, merged; record SHA and CI run. For every page change, use headless MCP browser tools on an
        isolated scratch ledger and spare port at 1920 by 1080, inspect and attach the screenshot to task proof, then close
        the browser. Missing browser tools block page work. '
      kind: code
      territory:
      - scripts/swarm_ledger/template.html
      - scripts/swarm_ledger/static/js
      - scripts/swarm_ledger/ledger_server.py
      - scripts/swarm_ledger/ledger_core.py
      - tests/swarm_ledger
    - id: t8
      title: Introduce the file backed ledger repository interface
      description: 'Audit findings: 18. Parent: the Swarm Design System keeps ledger, quota routing, herdr and durable agent
        coordination; this audit phase makes its presentation accessible and its cost proportional to changed resources. Extraction
        only. Introduce LedgerRepository with get_document, apply_ops, events_since, list_summaries, create, delete and restore.
        FileLedgerRepository wraps current persistence, reconciliation and locks. Route server, CLI, bin and creator persistence
        through it while preserving file and endpoint behavior. Keep pure domain operations unchanged. Seams: current operations,
        stale revisions, duplicate operation ids, guarded task updates, bin restore and operator inbox delivery remain equivalent.
        Inventory every direct JSON or HTML reader in hooks and swarm consumers for later migration. Provide byte identical
        recorded request proofs and a planted fault proof. Done when: File storage is behind the interface and recorded behavior
        remains equivalent. One PR into dev, gates green, Standards and Spec reviews closed, merged; record SHA and CI run. '
      kind: code
      territory:
      - scripts/swarm_ledger/ledger_core.py
      - scripts/swarm_ledger/ledger_server.py
      - scripts/swarm_ledger/ledger.py
      - scripts/swarm_ledger/ledger_bin.py
      - scripts/swarm_ledger/repository
      - tests/swarm_ledger
      - scripts/swarm_ledger/new_ledger.py
      - .github/workflows/equivalence.yml
      - mutation-cleared.txt
    - id: t9
      title: Add transactional SQLite storage and verified shadow import
      description: 'Audit findings: 18. Parent: the Swarm Design System keeps ledger, quota routing, herdr and durable agent
        coordination; this audit phase makes its presentation accessible and its cost proportional to changed resources. Expand
        storage behind LedgerRepository. Use stdlib SQLite WAL, normalized resource and thread rows, ordered revisions and
        event records. Import existing documents including ids, ordering, comments, answers, proofs, metadata, tombstones,
        seeds, bin and artifact references without silently dropping unknown fields. The import is idempotent and restartable.
        Keep files authoritative while shadow writes compare documents and events after each mutation. One atomic transaction
        applies a mutation, derived priorities and notifications, rev and events. Preserve stale revision conflict behavior
        and deduplication; do not persist a full ledger blob or full seed on each write. Use bounded checkpoints and replay
        or equivalent conflict evidence. Seams: restart, crash rollback, concurrent writes, replay and file versus SQLite
        equality. Done when: Imported and shadow SQLite records equal file records and single item persistence touches only
        affected rows. One PR into dev, gates green, Standards and Spec reviews closed, merged; record SHA and CI run. '
      kind: code
      territory:
      - scripts/swarm_ledger/repository
      - scripts/swarm_ledger/storage_migration
      - scripts/swarm_ledger/ledger_core.py
      - tests/swarm_ledger
      - mutation-cleared.txt
    - id: t13
      title: Switch all ledger consumers to SQLite and retire automatic file rewrites
      description: 'Audit findings: 18. Parent: the Swarm Design System keeps ledger, quota routing, herdr and durable agent
        coordination; this audit phase makes its cost proportional to changed resources, and the Doctor measured whole document
        rewrites slowing every ledger write under swarm load. Migrate then contract after versioned clients, events and static
        pages land. Make SQLite authoritative through the repository interface. Migrate remaining hook, tick, title, priming,
        refocus, workspace, artifact, watcher, lifecycle and bin consumers identified by the reader inventory. Retain an explicit
        lossless JSON import and export command for interchange and a backup verified before cutover. Retire shadow writes,
        automatic per operation JSON and HTML generation, seed scans and old whole document endpoints only after no in scope
        caller uses them. Preserve lifecycle, archive retention, ownership guards, inbox routing and restart recovery. JSON
        export may assemble a full document on explicit request; normal item writes may not. Existing global swarm layouts
        and Redis state remain unchanged. Update the presentation reference and PRODUCT current state to the completed migration.
        Done when: All normal reads and writes use the repository and SQLite is the durable record without automatic document
        rewrites. One PR into dev, or stacked PRs split by consumer group when the mutation budget cannot grade one, each
        with gates green, Standards and Spec reviews closed, merged; record SHA and CI run.'
      kind: code
      territory:
      - scripts/swarm_ledger
      - scripts/swarm
      - hooks/context
      - tests/swarm_ledger
      - tests/swarm
      - docs/reference/presentation-layer.md
    - id: t10
      title: Add schema validated versioned resources and migrate CLI requests
      description: 'Continue, never restart: five lives on this task each began from dev and lost the work. The finished work
        is eight commits, about two thousand two hundred lines with forty nine API contract tests, on the local branch engineer-323133-0303
        in its worktree under the agentihooks worktrees folder, head f5b14122, never pushed. First act: push that branch,
        work in that worktree, open the pull request at once so the next life sees it, then finish only the mutation gate
        failures named in the progress file. Scope is now the versioned API routes only; moving the CLI and tick clients onto
        them is a separate task.


        Audit findings: 22. Parent: the Swarm Design System keeps ledger, quota routing, herdr and durable agent coordination;
        this audit phase makes its presentation accessible and its cost proportional to changed resources. Expand API beside
        old routes, using the repository interface. Define API v1 collection and item resources for ledger summaries and metadata,
        tasks, phases, questions, followups, notes and their threads, chat, priorities, notifications, artifacts, bin and
        swarm control readers. Reuse domain operations instead of creating independent semantics. Provide bounded pagination,
        per resource revisions, stable machine readable error envelopes and request schemas validated centrally with a real
        declared schema dependency if needed. Migrate CLI and tick clients to resource operations and guarded updates, with
        operation ids and expected revisions preserved. Large explicit export stays a named operation; routine reads and writes
        return bounded resources or acknowledgments, not the whole record. Keep bearer values out of logs; preserve host,
        origin, token, identity and role checks. Seams: schema rejection without mutation, forbidden caller, revision conflict,
        retry idempotency, resource read and operator inbox delivery. Done when: Every current client operation has a schema
        validated v1 route with bounded replies and equivalent authorization. One PR into dev, gates green, Standards and
        Spec reviews closed, merged; record SHA and CI run. '
      kind: code
      territory:
      - scripts/swarm_ledger/api
      - scripts/swarm_ledger/ledger_server.py
      - tests/swarm_ledger/api
      - mutation-cleared.txt
    - id: t11
      title: Replace document polling with revisioned event delivery
      description: 'Audit findings: 19. Parent: the Swarm Design System keeps ledger, quota routing, herdr and durable agent
        coordination; this audit phase makes its presentation accessible and its cost proportional to changed resources. Serve
        authenticated same origin server sent events through the v1 events route. Include ledger resource changes and swarm
        status changes from the existing Redis readers, so both two second page pollers are removed. Include opaque revision
        cursors, reconnect replay, heartbeat, bounded retention and an explicit expired cursor response with a targeted reload.
        Use fetch streaming if EventSource cannot preserve the current token security contract; never put tokens in URLs.
        Move browser state and watch_ledger to event delivery without repeated full JSON reads. Watcher filters, operator
        owes and ack rules, heartbeat markers and once per session delivery remain intact. Scope any fallback to disconnect
        periods and bounded incremental requests. Preserve the independent quota refresh cadence. Seams: initial snapshot
        handoff, concurrent update ordering, reconnect replay, missed cursor reset, idle disconnect cleanup and no duplicate
        operator actions. Done when: Page and agent watchers receive incremental changes with no recurring whole document
        fetch or disk read. One PR into dev, gates green, Standards and Spec reviews closed, merged; record SHA and CI run.
        For every page change, use headless MCP browser tools on an isolated scratch ledger and spare port at 1920 by 1080,
        inspect and attach the screenshot to task proof, then close the browser. Missing browser tools block page work. '
      kind: code
      territory:
      - scripts/swarm_ledger/events
      - scripts/swarm_ledger/static/js
      - scripts/swarm_ledger/watch_ledger.py
      - scripts/swarm_ledger/ledger_server.py
      - tests/swarm_ledger
    - id: t12
      title: Serve static page shells and bounded resource views with CSP
      description: 'Audit findings: 20, 23. Parent: the Swarm Design System keeps ledger, quota routing, herdr and durable
        agent coordination; this audit phase makes its presentation accessible and its cost proportional to changed resources.
        Contract the presentation only after module extraction, v1 API and event migration. Serve static ledger, home and
        bin shells with external cacheable CSS and JS, no embedded ledger JSON or inline executable code. Bootstrap metadata
        and visible collection pages from v1; lazily load closed sections, old threads, proof bodies and later task pages.
        Preserve full record reachability, deep links that fetch and reveal their target, full export, fold memory, full titles,
        accepted home sorting and the watermark. Do not substitute infinite hidden DOM for pagination. Add enforced CSP to
        all page responses with same origin scripts and connections, no unsafe eval or unsafe inline allowance, explicit supported
        image and artifact rules; artifact rendered content stays sanitized. Cache hashed assets with invalidation after changes.
        Preserve the home remake exactly and migrate its render assertions to browser behavior without weakening them. Keep
        shell generation read only. Done when: Page shells contain no record seed, hidden history is not eagerly rendered,
        and enforced CSP permits all supported actions. One PR into dev, gates green, Standards and Spec reviews closed, merged;
        record SHA and CI run. For every page change, use headless MCP browser tools on an isolated scratch ledger and spare
        port at 1920 by 1080, inspect and attach the screenshot to task proof, then close the browser. Missing browser tools
        block page work. '
      kind: code
      territory:
      - scripts/swarm_ledger/template.html
      - scripts/swarm_ledger/home.html
      - scripts/swarm_ledger/static
      - scripts/swarm_ledger/ledger_server.py
      - scripts/swarm_ledger/new_ledger.py
      - tests/swarm_ledger
    - id: t14
      title: Filter and group the outline with keyboard navigation and useful fold defaults
      description: 'Audit findings: 2, 4, 9. Parent: the Swarm Design System keeps ledger, quota routing, herdr and durable
        agent coordination; this audit phase makes its presentation accessible and its cost proportional to changed resources.
        Use loaded resource summaries to search full task titles or ids, filter state, and group tasks by phase. Completed
        and answered groups start closed only when the viewer has no remembered choice; the existing saved folds, comment
        defaults, expand all and pending plus marks prevail. Priorities leads the existing Ledger view; do not restore the
        removed Needs you panel. Type ahead must search records not yet loaded. Make visible task and outline entries keyboard
        reachable with arrow keys and optional j and k outside form controls, visible focus and Enter to reveal; preserve
        browser and assistive technology behavior. Seams: fresh versus returning viewer, filter with remote pagination, grouped
        done items, targeted reveal, keyboard navigation and form typing. Done when: The outline is searchable and grouped,
        old content defaults closed, and keyboard navigation reaches every visible result. One PR into dev, gates green, Standards
        and Spec reviews closed, merged; record SHA and CI run. For every page change, use headless MCP browser tools on an
        isolated scratch ledger and spare port at 1920 by 1080, inspect and attach the screenshot to task proof, then close
        the browser. Missing browser tools block page work. '
      kind: code
      territory:
      - scripts/swarm_ledger/static/js/outline
      - scripts/swarm_ledger/static/js/tasks
      - scripts/swarm_ledger/static/js/layout
      - scripts/swarm_ledger/static/css
      - tests/swarm_ledger
    - id: t15
      title: Remove repeated priority asks and add explicit bulk priority actions
      description: 'Audit findings: 5, 9. Parent: the Swarm Design System keeps ledger, quota routing, herdr and durable agent
        coordination; this audit phase makes its presentation accessible and its cost proportional to changed resources. Keep
        the operator approved red item label, exact referenced title, green Approve, Clear and distinct ask line. Suppress
        only a normalized exact duplicate ask; do not discard a different request or condition wording. Add explicit selection
        for priority rows and flat bulk Approve or Clear actions, selected count and keyboard accessible controls. Route each
        selected action through the existing verdict and clear semantics; Approve still posts the operator ask, including
        set a condition when present, and delivers it once to the owner or master. Selection never acts implicitly; exclude
        removed items, handle revision conflicts and report individual results without clearing failed rows. No bulk task
        completion or new authority. Seams: duplicate versus distinct ask, selection and deselection, mixed action results,
        condition approval and no duplicate inbox dispatch. Done when: Repeated asks display once and selected priorities
        can be approved or cleared with the existing operator semantics. One PR into dev, gates green, Standards and Spec
        reviews closed, merged; record SHA and CI run. For every page change, use headless MCP browser tools on an isolated
        scratch ledger and spare port at 1920 by 1080, inspect and attach the screenshot to task proof, then close the browser.
        Missing browser tools block page work. '
      kind: code
      territory:
      - scripts/swarm_ledger/static/js/priorities
      - scripts/swarm_ledger/static/js/api
      - scripts/swarm_ledger/static/css
      - tests/swarm_ledger
    - id: t16
      title: Harden HOME and BIN semantics, notices and recoverable delete
      description: 'Audit findings: 1, 3, 7, 10, 13, 16, 17. Parent: the Swarm Design System keeps ledger, quota routing,
        herdr and durable agent coordination; this audit phase makes its presentation accessible and its cost proportional
        to changed resources. Follow the accepted home remake; do not redo its layout or overview implementation. Preserve
        192 pixel side margins at 1920 width, faint panel with visible watermark, equal height closed rows, full expanded
        title and overview, remembered sorting and folds. Give HOME and BIN real table semantics with scoped headers or a
        complete accessible grid, accessible sortable headers and fold state. Use nav landmarks for navigation. Replace native
        alerts and raw server text with inline notices and usable retry, catch network failures and restore button usability.
        Binning offers Undo that restores the same ledger and reports success or failure; never silently restart its stopped
        swarm. Explain retention and restore in BIN empty states and offer a HOME action; HOME empty state offers an existing
        supported creation action or accurate command. Gate every HOME transition under reduced motion. Finding thirteen remains
        owned by the home remake, verified here without a second implementation. Done when: HOME and BIN have accessible columns
        and navigation, recoverable errors and binning, reduced motion and useful empty guidance while preserving the approved
        home design. One PR into dev, gates green, Standards and Spec reviews closed, merged; record SHA and CI run. For every
        page change, use headless MCP browser tools on an isolated scratch ledger and spare port at 1920 by 1080, inspect
        and attach the screenshot to task proof, then close the browser. Missing browser tools block page work. '
      kind: code
      territory:
      - scripts/swarm_ledger/static/js/home
      - scripts/swarm_ledger/static/css/home
      - scripts/swarm_ledger/home.html
      - scripts/swarm_ledger/api/bin
      - tests/swarm_ledger
    - id: t17
      title: Align type, navigation color and tokens without clipping overlays
      description: 'Audit findings: 6, 11, 12, 14, 15. Parent: the Swarm Design System keeps ledger, quota routing, herdr
        and durable agent coordination; this audit phase makes its presentation accessible and its cost proportional to changed
        resources. Preserve all operator approved red item labels, priority links, structural marks, existing blue and red,
        and the flat no glow design. Neutralize only ordinary navigation icons; retain red alerts and destructive actions.
        Long text uses sentence case and readable 13 pixel body roles; keep 11 pixel short labels where they are actual metadata
        labels. Add spacing, radius and z index tokens matching existing geometry, replacing off token component literals
        without changing accepted layouts. Fix actual clipping of menus, tooltips and overlays by correct layering or top
        layer placement, not by undoing the full height scrolling columns. Page ends and resizable panes remain usable. Align
        DESIGN.md with the approved audit changes rather than broadening the design system. Seams: role styles, edge anchored
        overlay bounds and saved pane layout. Done when: Long text is readable, navigation is neutral, geometry uses declared
        tokens and edge overlays remain visible with full height panes. One PR into dev, gates green, Standards and Spec reviews
        closed, merged; record SHA and CI run. For every page change, use headless MCP browser tools on an isolated scratch
        ledger and spare port at 1920 by 1080, inspect and attach the screenshot to task proof, then close the browser. Missing
        browser tools block page work. '
      kind: code
      territory:
      - scripts/swarm_ledger/static/css
      - scripts/swarm_ledger/static/js/layout
      - scripts/swarm_ledger/palette.css
      - DESIGN.md
      - tests/swarm_ledger
    - id: t18
      title: Verify active swarm states and finish contextual empty guidance
      description: 'Audit findings: 8, 10. Parent: the Swarm Design System keeps ledger, quota routing, herdr and durable
        agent coordination; this audit phase makes its presentation accessible and its cost proportional to changed resources.
        The historical audit used a scratch ledger copy without a running swarm; current pollSwarm already reports failures
        and retains the last observed state. First reproduce on a real active scratch swarm in an isolated scratch store and
        spare port; never diagnose absent scratch registration as a product bug. Check active, no swarm registered, Redis
        unavailable, API failure, stale cached state and recovery. Credit existing live status and error fixes; change only
        proven remaining gaps, with one PR if needed. Explain the actual cause and supported action in plain words, distinguish
        stale from current data and disable actions that cannot work. Preserve legitimate running, paused, stopped and closed
        labels and remembered tab state. Add useful empty guidance to ledger collections that still need it, using existing
        controls instead of duplicate creation flows. Finish the numbered coverage readback after all implementation tasks;
        findings already passing need observed proof, not a redundant rewrite. Done when: Every swarm availability state is
        proven and gives accurate recovery guidance; remaining empty states explain a supported action; all twenty three findings
        have closure evidence. Record observed evidence and any fix PR; a filed hypothesis does not resolve the finding. For
        every page change, use headless MCP browser tools on an isolated scratch ledger and spare port at 1920 by 1080, inspect
        and attach the screenshot to task proof, then close the browser. Missing browser tools block page work. '
      kind: troubleshoot
      territory:
      - scripts/swarm_ledger/static/js/swarm
      - scripts/swarm_ledger/static/js/empty
      - scripts/swarm_ledger/ledger_server.py
      - tests/swarm_ledger
