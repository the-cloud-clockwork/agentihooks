- name: rig-grade-swarm-sz15
  state:
    new:
    - ref: 0
      title: Every collected test runs in exactly one shard
      description: A dev Tests run went green while about seven hundred tests ran in no shard, so the suite passed by omission.
        Add a gate check that every collected test ran in exactly one shard per Python version, failing on any test run zero
        times or twice, with a plant proof that a dropped test turns it red. Done when the pull request merges with green
        and red runs recorded.
    existing:
    - kind: task
      id: sz24
      title: Rebalance the slow Python 3.11 shard three group
      description: 'Python 3.11 shard three took one hundred thirty four seconds against ninety nine for the next slowest
        shard of the same version, a thirty five second lead. Seam: the stored durations and shard assignment. Rebalance its
        slow group so the lead drops under thirty seconds while every collected test still runs in exactly one shard. Done
        when the pull request merges and a dev push run shows the 3.11 slowest shard within thirty seconds of the next.'
    - kind: task
      id: ci10
      title: Stored durations check never turns an unrelated pull request red
      description: 'Seam: the CI check that compares stored test durations against collected tests. Today it counts missing
        tests per shard, so tests added by one merged pull request turn other open pull requests red in one shard while dev
        stays green; it has happened twice today. Make the check judge coverage over the whole suite, or make missing durations
        fall back to an even split with a warning, and keep the stored durations fresh on a schedule or on push to dev. Red
        test first: a durations file missing a few new tests must not fail the shard check. Plant a fault to show the check
        still goes red when durations are badly stale. Done when merged with CI green and both ways proof pasted on the task.'
    - kind: task
      id: sz12
      title: 'Repair red dev: stored test durations cover the suite'
      description: 'Dev is red since the difficulty change merged: the dev push Tests run fails the check that stored test
        durations cover the collected suite, with about fourteen hundred tests lacking a stored duration, and every pull request
        that takes dev fails the same check. Find why the stored durations lost coverage at that merge, restore coverage by
        script, never by hand, and keep the check strict. Done when the pull request merges and the dev push Tests run at
        its merge passes.'
    - kind: task
      id: t153
      title: Dispatched Tests runs fall back to the newest finished dev run for their base
      description: 'A dispatched Tests run on the default base fails at the durations job while the newest dev push run is
        still going, so every proof run needs a hand pinned base. Seam: with no base given, a dispatched run picks the newest
        finished and passed dev push run and reads its durations and baseline, without any GitHub API quota per shard. Red
        first: a dispatch while a dev run is in progress resolves to the newest finished one; a given base is still honoured.
        Done when the pull request merges with CI green and one dispatch made during a running dev push passes its durations
        step, run id on the task.'
