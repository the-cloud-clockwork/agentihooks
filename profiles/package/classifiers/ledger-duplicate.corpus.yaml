- name: rig-grade-swarm-tc109
  state:
    new:
    - ref: 0
      title: Overlay handoffs render from a clean copy of the recorded bundle commit
      description: When the bundle moves on, a handoff or resume of an overlay agent is refused until someone checks out the
        recorded bundle commit by hand. Render from a clean temporary copy of that commit instead, so no person ever checks
        anything out and the shared bundle checkout is never moved. Done when the pull request merges and a resume after the
        bundle advanced renders from the recorded commit with no manual step.
    existing:
    - kind: task
      id: tc62
      title: Overlay renders pin the bundle to the commit the launch recorded
      description: 'Parent: swarm overlays must render the same profile on any hive. Overlay launches record the bundle commit,
        but rendering reads the bundle working tree. Render from the recorded commit, and refuse with a clear message when
        the local bundle differs from it. Red first: a launch record naming one commit with a bundle working tree at another
        is refused. Done when the pull request merges with CI green.'
    - kind: task
      id: sz36
      title: A priority on an out of scope item shows no Approve
      description: 'A priority an agent adds by hand on an out of scope item still shows Approve in Priorities, because the
        priority write never checks out of scope. Seam: the priority add operation and the derived priorities list. Refuse
        a hand added priority on an out of scope item with a plain reason, and drop rows for items marked out of scope when
        priorities are listed. Done when the pull request lands with tests for both.'
    - kind: task
      id: gb14
      title: Coverage ratchet follows rewritten moved modules and never grades dev against itself
      description: The coverage ratchet misses a module rewritten and moved below the rename similarity, and a manual run
