- name: rig-grade-swarm-rb10
  state:
    new:
    - ref: 0
      title: Role profile homes stop loading the global atlas persona
      description: 'Seen live in the passing imports proof: a Claude agent started in the engineer profile home still loaded
        the global Claude persona file from the default Claude home, about 53 thousand characters of atlas persona, next to
        the engineer home''s own persona and rules. Claude warned that 28 instruction files add up to 187.6 thousand characters,
        over its 150 thousand limit, and the status line named the atlas and brain profiles. Seam: how a rendered home keeps
        Claude from reading the default home''s persona and rules when the working folder sits under the user''s home. Red
        test first on a rendered home, then a live Claude spawn in the engineer home whose pane shows no size warning and
        no atlas persona file. Done when merged with CI green and that pane shown on the task.'
    existing:
    - kind: task
      id: rb11
      title: Status line names the profile the session runs
      description: 'Seen live: in a rendered engineer home the status line still prints agentihooks atlas and brain for both
        profile and settings, because it reads the global install state, not the selected profile. Seam: the status line''s
        profile source. Name the profile from the selected run profile when one is set, else the global install. Red test
        first. Done when merged with CI green and a live engineer home pane shows engineer in the status line.'
    - kind: task
      id: rb9
      title: Claude agents in a profile home start without the external imports prompt
      description: 'Seen live: since swarm templates name a profile, a Claude engineer spawned into the rendered engineer
        profile home stopped at the Claude Code prompt Allow external CLAUDE.md file imports, because the rendered rules import
        bundle files outside the working folder and the new config home has no saved approval. It sat there over thirty minutes
        holding the planner lane task; Codex agents are not affected. Seam: profile rendering for the Claude target. Make
        a rendered home start with no prompt, either by recording the approval in the home''s Claude config at render time
        or by rendering imported rules so nothing is imported from outside. Red test on the rendered home first. Done when
        a swarm Claude spawn with a profile reaches its first tool call with no prompt, shown by reading its pane, and the
        pull request is merged.'
    - kind: task
      id: sv2
      title: Swarm flags an agent stuck at a startup prompt instead of calling it working
      description: 'Seen live: a Claude engineer sat over thirty minutes on the Claude startup prompt Allow external CLAUDE.md
        file imports while swarm status and the page showed it working, and only reading its pane revealed it. Seam: the pane
        state classifier the tick uses. Treat a Claude or Codex selection prompt (a question with arrow choices and Enter
        to confirm, trust and import dialogs included) as waiting on input, show that state in status and on the agent card,
        and raise a health finding naming the agent and the prompt title when it holds a claim through that state for more
        than three ticks. Never answer the prompt. Red test first from a saved pane capture of the import prompt. Done when
        merged with CI green and a scratch proof shows the state and the finding.'
    - kind: task
      id: br2
      title: Every swarm agent runs with the brain overlay on
      description: 'Bug seen by the operator: swarm agents load the right profile, master, engineer, cicd or planner, but
        the status line shows no brain overlay, only the profile, settings and channels. The swarm base profile allows the
        brain overlay but nothing turns it on for spawned agents. Seams: every launch the swarm tick builds, first spawn,
        respawn and handoff successor, for every seat and both Claude and Codex, renders its profile home with the brain overlay
        active, and the status line names it. Decide in the bundle or the launcher whether brain is a default overlay for
        the whole fleet; the operator wants every agent in the fleet on brain. Failing test per seam first, then the fix,
        one pull request per repo touched. Done when merged and a freshly spawned agent pane shows the brain overlay in its
        status line, with the pane capture as proof.'
