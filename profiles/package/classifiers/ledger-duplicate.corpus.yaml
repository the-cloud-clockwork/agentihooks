- name: rig-grade-swarm-asc2
  state:
    new:
    - ref: 0
      title: Autoscale ceiling algorithm with hysteresis
      description: 'Parent: quota driven autoscaling. A pure function takes live agents per lane, free quota seats per harness,
        host room, ready demand per lane and the previous decision with its pending raise count, and returns a ceiling per
        lane, the pending raise state and a plain words reason naming quota seats, host room and any held raise. Total ceiling
        is live agents plus the smaller of free quota seats and host room, at most fifty, split by ready demand in the order
        plan, ci, eng, the rest to eng. A lower target applies at once; a higher one only after three ticks in a row and at
        most two seats per tick. Red first: more accounts raise the ceiling after three ticks, a reset raises it the same
        way, draining quota lowers it at once, host room caps it, a raise climbs at most two per tick, lane split follows
        demand. Done when the pull request merges with CI green.'
    existing:
    - kind: task
      id: asc4
      title: The tick sets lane ceilings from autoscale
      description: 'Parent: quota driven autoscaling. Wire the host room and the autoscale ceiling into the capacity step
        the tick runs every minute: under auto the ceilings replace the configured caps as lane limits, under manual nothing
        changes. The pending raise state persists in the stored capacity decision so hysteresis survives across ticks. Add
        a read only swarm autoscale command that prints the decision for a live swarm, or for a fixture file of accounts and
        host readings, for proofs. Red first: a manual swarm''s decisions stay unchanged, an auto swarm with fresh quota and
        host room gets ceilings above its old configured caps, a held raise survives across ticks. Done when the pull request
        merges with CI green.'
    - kind: task
      id: asc1
      title: Host room from load and memory
      description: 'Parent: quota driven autoscaling bounded by the host. A pure function plus a thin reader gives how many
        more agents this machine takes from the one minute load per CPU, available memory and every live agent session on
        the machine, with high and low load watermarks as hysteresis: above high the room shrinks, below low it may grow,
        between them the previous room holds. The default memory per agent is measured from live agent sessions here and named
        in the pull request. Red first: high load gives zero room, low load with free memory gives room, the band between
        watermarks holds the previous room, memory alone limits room. Done when the pull request merges with CI green.'
    - kind: task
      id: asc8
      title: Host room counts Copilot sessions beside Claude and Codex
      description: 'Parent: quota driven autoscaling bounded by the host. Live agent counting for host room covers Claude
        and Codex sessions only; Copilot sessions on the machine are not counted. Seam: a Copilot session counter next to
        the other two, read the same way, feeding host room. Red test first with a fixture process list holding a Copilot
        session. Done when the pull request merges with CI green.'
    - kind: task
      id: hot1
      title: 'Hotfix: the capacity step passes the plain words check and saves its decision when a comment is refused'
      description: 'Outage in both swarms: no agent spawned for thirty six minutes. The capacity step appends a clause naming
        free seats to its reason, so its ledger comment carries three semicolons; the ledger refuses it, the step raises before
        saving its decision, and spawns filter on a stale task list. Seams: one, the capacity comment passes the plain words
        check, at most one semicolon. Two, the step saves its decision even when its comment is refused. Red test first for
        each. Done when the pull request merges, the tick journal shows no refused capacity write, and a new agent spawns
        in both swarms.'
