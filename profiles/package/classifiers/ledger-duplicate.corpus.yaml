- name: rig-grade-swarm-ef2
  state:
    new:
    - ref: 0
      title: Swarm effort range setting, default medium to high
      description: 'Operator rule: the swarm configuration carries an effort range beside the caps, and by default it filters
        out low and max. Evidence read by the master: with lane effort auto the model pick classifier scores effort from low
        to max for Claude and nothing bounds it, so engineers 0095 and 0096 started at opus max; the master pinned the eng,
        ci and plan lanes to high as a stopgap. Seams: a swarm setting effort range with a floor and a ceiling, set with swarm
        set effort-min and effort-max and shown and editable in the swarm panel caps row, default medium to high, mapped for
        Codex so xhigh is filtered too; every effort a lane agent starts with is clamped into the range after the classifier,
        after lane settings and templates, and at the init agent launch, so no path escapes it; setting a lane effort outside
        the range is refused with the range named. Red first: a classifier answer of max yields high and low yields medium;
        set eng effort max is refused; a range widened to low to max lets both through. Done when merged, the ledger server
        restarted, the eng, ci and plan lanes set back to auto, and swarm status showing new agents inside the range pasted
        on the task proof.'
    existing:
    - kind: task
      id: cxm1
      title: Agents table shows model and effort for Codex agents
      description: 'Operator approved follow up from the master model engineer: the Agents table in swarm status and on the
        ledger page prints only the word codex for every Codex agent, so a Codex master running Sol at high effort never shows
        its model or effort. Seams: the agent record keeps the model and effort a Codex agent was spawned with, and the Agents
        table renders them for Codex rows the same way it does for Claude rows. Red first: a Codex agent spawned with a model
        and effort shows both in swarm status and in the page''s Agents table. Done when merged, the ledger server restarted,
        and swarm status output with a Codex row showing model and effort pasted on the task proof.'
    - kind: task
      id: md2
      title: Every swarm agent runs Opus high, the automatic model classifier no longer downgrades
      description: 'Operator order: every agent in the fleet runs Opus with high effort, masters and engineers alike. The
        earlier fix only covered the master. Evidence read by the master: a freshly spawned engineer on the plugins task shows
        Sonnet medium in its status line, and swarm status lists it as sonnet medium, picked by the automatic model classifier
        for an auto lane. Seams: lanes default to Opus and high effort for Claude; the classifier may only raise effort, never
        pick a model below Opus, unless the swarm config names a model explicitly. Failing test per lane first. Done when
        merged and a freshly spawned engineer pane shows Opus with high effort, with the pane capture as proof.'
    - kind: task
      id: md1
      title: Every swarm spawn and recycle starts Claude on Opus with high effort
      description: 'Bug seen by the operator: the master recycle handoff started the new master on Sonnet, not Opus. The init
        agent launcher defaults are Opus and high effort, so some swarm spawn, respawn or handoff path passes its own model
        or drops the defaults. Seams: every launch the swarm tick builds for master, eng, ci and plan seats, first spawn and
        handoff successor alike, carries model opus and effort high for Claude unless the swarm config names another model.
        Find the path that started Sonnet, add a failing test per path that reads the built launch command, then fix. Done
        when the tests pass, the pull request is merged, and a recycled master pane shows Opus at startup with the pane capture
        as proof.'
    - kind: task
      id: md3
      title: Masters always run the frontier model at high effort, and the Agents table shows the real model
      description: 'Operator order, repeated: every master runs the frontier model at high effort by default, Opus high on
        Claude and Sol high on Codex, first spawn, respawn, handoff successor and resume alike. Evidence read by the master:
        the live Swarm tab lists this master as sonnet low because the classifier picked that at its spawn, and the operator
        switched it to Opus by hand, which the swarm never sees. Seams: the master seat never goes through the model classifier,
        it always gets the frontier model and high effort for its harness; the agent record updates its model and effort from
        what the running session reports, the status line or heartbeat, so the Agents table shows the real model after a manual
        switch. Failing test per seam first. Done when merged, a recycled master pane shows Opus high, and the Agents table
        matches the panes.'
