      health.'
    phase: 'Decoupled runtime CXCH: Codex Channels: push inbox via per-execution app-server (Track B)'
    phase_intent: Idle or busy Codex agents receive inbox items in their live thread, with no pane typing and no foreground
      wait --inbox. They answer through agentihooks msg, and herdr keeps the same conversation.
    task: cxch-06b managed-execution liveness, retire and successors (source section 10 lifecycle)
    task_text: 'Spec: section cxc7 of the decoupled swarm runtime plan, lines 553 to 570 of the plan artifact on this phase.
      Read only those lines, ten lines of margin each side. Done when ci run id, and the pull request merges. Folded by the
      master: a launch that fails after admission but before its transport record is reserved ends its registered execution.
      Folded by the master: a degraded Codex push pump reconnects with backoff instead of returning and stopping.'
    planned_pieces:
    - Observe admitted managed Codex servers and threads independently of viewers and keep productive waits distinct from
      runtime idle | scripts/swarm/runtime.py, scripts/swarm/live_binding.py, scripts/swarm/idle.py, tests/swarm | Managed
      lifecycle must survive closing or adding viewers
    - Retire managed executions through their recorded process group and start identity and fence old bridges on successor
      admission | scripts/swarm/runtime.py, scripts/swarm/reaper.py, scripts/codex_session, scripts/inbox/codex.py, tests/swarm,
      tests/codex_session, tests/inbox | Retirement must preserve unrelated sessions and stale bridge mail must be refused
    - End admitted executions on launch failure before transport reservation and reconnect degraded push pumps with backoff
      | scripts/codex_session, scripts/inbox/codex.py, tests/codex_session, tests/inbox | Folded lifecycle fixes prevent blocked
      replacement and permanent inbox loss
    - Route managed local termination directly to the server and fence receipt transactions on execution generation | scripts/swarm_v2/runtime/local.py,
      scripts/inbox/receipts.py, tests/swarm/test_managed_lifecycle.py, tests/inbox/test_codex_pump.py | The launcher must
      not control retirement and successor admission must defeat old receipt commits
    - Reserve per seat publication until the app server call ends and refuse successor admission while it is held | scripts/swarm/execution.py,
      scripts/codex_session/binding.py, scripts/inbox/codex.py, tests/inbox/test_codex_pump.py, tests/codex_session/test_supervisor.py
