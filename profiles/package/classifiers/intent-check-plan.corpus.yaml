    task_text: 'Parent: the throughput plan, required checks stop waiting on runners. Measured by the runner wait task: every
      push to dev reran the full unit suite on a commit whose merge queue run had already passed, thirty of thirty push runs
      since nineteen hundred UTC yesterday, thirteen percent of peak runner seconds. Seam: a dev push run whose commit has
      a passed merge queue Tests run reuses that run''s unit results and artifacts instead of rerunning the shards, while
      the coverage baseline, Sonar on dev, durations refresh and flake budget read the same inputs as before; a commit with
      no passed queue run runs the full suite. Done: a both ways proof, one dev push reusing a queue run with baseline and
      Sonar green, and a planted mismatch that falls back to the full suite; pull request merged into dev; peak runner seconds
      measured the same way before and after.'
    planned_pieces:
    - Select a completed successful Tests merge queue run for the exact dev commit and require complete unexpired unit artifacts
      with authenticated provenance for any reused pull request source | scripts/ci_dev_reuse.py, tests/test_ci_dev_reuse.py
      | Reuse only results attributable to the same commit and fall back when provenance or inputs are missing
    - Fetch queue run and artifact metadata in an authenticated workflow step and pass saved metadata to the selector in the
      existing durations job | .github/workflows/test.yml | Keep API calls outside test scripts and preserve the frozen reuse
      and required gate jobs
    - Publish a single validated source choice and consistent collected test metadata before unit jobs start | .github/workflows/test.yml,
      scripts/ci_dev_reuse.py | Keep shard discovery and restored artifacts aligned and choose full execution on mismatch
    - Restore and republish every selected shard artifact while skipping expensive unit execution only for a validated source
      | .github/workflows/test.yml | Preserve current artifact names and downstream coverage baseline, Sonar on dev, duration
      refresh and flake budget inputs
    - Prove exact commit reuse and mismatch fallback in CI, including baseline and Sonar success on the reused dev push |
      tests/test_ci_dev_reuse.py, .github/workflows/test.yml | Record both ways proof with run links and confirm downstream
      behavior
    - Measure peak runner seconds with the original runner wait method before and after, complete review and release the reviewed
      pull request to the swarm | task proof, pull request | Verify the runner saving and retain ownership through the swarm
      merge process
    - Land compatibility assertions that accept the current and reused unit conditions in a tests first pull request before
      the workflow change | tests/test_ci_workflow.py | A gate change that changes existing test expectations must ship tests
      first accepting both states
    planned_areas:
    - .github/workflows/test.yml
    - pull request
    - scripts/ci_dev_reuse.py
    - task proof
    - tests/test_ci_dev_reuse.py
    - tests/test_ci_workflow.py
