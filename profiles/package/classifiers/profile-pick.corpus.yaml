- name: rig-grade-swarm-rt3
  state:
    task: rt3
    title: A finished agent is always retired, its lane slot freed at once, and a failed retire is flagged
    description: 'Operator finding, verified by the master. Engineers 0203 and 0230 finished tasks cx2 and cg9 last night
      yet stayed alive with open idle panes for about twelve hours. Evidence: swarm status listed both as finished; terminate
      agent refused each name as ambiguous, because the name was shared by the main session, its subagent sessions, a resumed
      duplicate of 0230 and three Codex app server daemons left in the cx2 proof home. The tick reap retires by name, so every
      pass logged could not retire and retried, and the lane count includes finished agents, so two of nine engineer slots
      and their account sessions were held all night. The master terminated all seven processes by exact id. Seams: tick reap
      and runtime retire, lane busy count, health findings. Required: retire targets the exact launch process recorded at
      spawn, never the bare name, and ends its whole process group plus processes running from that task''s scratch homes;
      finished agents never count toward a lane cap; a retire still failing after three ticks is a health finding naming agent,
      process and refusal, sent to the master; each tick sweeps live processes carrying a swarm agent name with no active
      record and reaps them. Done when tests plant a shared name, a resumed duplicate and a leftover proof daemon and each
      is retired, a finished agent frees its slot on the same tick, and a scratch swarm proof shows a finished engineer gone
      within two ticks.'
    kind: code
    territory: []
    project_intent: 'Borrow what OpenRig does that we lack, while keeping the ledger, quota routing and herdr: durable Claude
      and Codex messaging, seats, intent, work beyond code, swarm health.'
    phase: p23
    phase_intent: 'Correct profiles and continuous observability: Operator top priority for all work tonight: frontend uses
      frontend, backend and infrastructure use engineer, planning uses planner, and independent stress verification uses qa.
      Explicit task profiles prevail. Verify actual mounted profiles and classifier decisions at every launch and handoff,
      not labels alone. Keep continuous correlated logs and Langfuse traces throughout each job and make missing, stale or
      misattributed telemetry visible. Target project is https://telemetry.example/project Include minimal Langfuse read capability
      for master and QA, ongoing detector coverage, and an independent QA pass after implementation. Master approves the plan
      under delegate autonomy.'
  params:
