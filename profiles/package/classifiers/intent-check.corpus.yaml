    overview: 'Borrow what OpenRig does that we lack, while keeping the ledger, quota routing and herdr: durable Claude and
      Codex messaging, seats, intent, work beyond code, swarm health.'
    phase: 'Plan chunks: agents read only their slice of the plan'
    phase_intent: Operator top priority. Every planner plan is stored as a ledger artifact. Each phase points at its plan
      and each task at a line range computed by code from slice anchors. Agents read only their range, ten lines of margin
      each side, through one command, and a hook refuses whole plan reads from engineer and ci agents. The intent check judges
      every pull request against its exact chunk and fails both underdelivery and overdelivery. Done when a proof swarm shows
      the refused whole read, the chunk read, and a failed intent verdict on an overreaching pull request.
    task: Hook refuses whole plan reads from engineer and ci agents
    task_text: A pre tool use guard, active only for swarm sessions in the eng or ci lane, refuses any read, grep, shell command
      or fetch that targets a plan artifact by its stored file or its artifact address, unless the requested lines fall inside
      the task's range with ten lines of margin. The refusal names the plan read command. Master and planner lanes are exempt.
      Model it on the credential guard dispatch and give it an off switch. Done when tests show a whole read refused, an in
      range read allowed, the master allowed and a shell cat of the stored file refused, one live engineer session is refused
      on a whole read, and the pull request merges.
    pull_request_title: Refuse whole plan reads from engineer and ci sessions
    pull_request_body: 'Refuse whole plan reads from engineer and ci sessions.


      - `hooks/context/plan_read_guard.py`: active only when `AGENTIHOOKS_SWARM` is set and the lane is eng or ci. It refuses
      Read, Grep, Bash and WebFetch calls that target a `plan: true` artifact by its media path or its artifact URL, unless
      the requested range falls within the task''s `plan_lines` with ten lines of margin. The refusal names `agentihooks plan
      read`.

      - Master and planner lanes pass.

      - Dispatch follows `credential_guard`; wired in `hook_manager.on_pre_tool_use`; `PLAN_READ_GUARD_ENABLED=false` turns
      it off.

      - Tests: a whole Read refused, an in range Read allowed, the master allowed, a Bash `cat` of the media file refused,
      a WebFetch of the artifact URL refused, the kill switch.

      - Live: a spawned engineer on a scratch ledger was refused on a whole Read of its plan.'
    changed_files:
    - hooks/context/plan_read_guard.py
    - hooks/hook_manager.py
    - tests/context/test_plan_read_guard.py
    proof: {}
    proof_notes: '- guard tests: whole Read refused, in range Read allowed, master allowed, Bash cat of media refused, WebFetch
      of artifact URL refused, kill switch; 14 passed

      - live engineer on scratch ledger refused on whole Read

      '
    plan_lines: 50-56
    plan_chunk: '### A3. Whole-plan read guard (eng, depends A1)

      - A PreToolUse guard is active only when `AGENTIHOOKS_SWARM` is set and the lane is eng or ci.

      - It refuses any Read, Grep, Bash or fetch that targets a `plan: true` artifact, whether by media path or by artifact
      URL, unless the requested range falls within the task''s `plan_lines` ±10.

      - Its refusal names `agentihooks plan read`.

      - Master and planner lanes are exempt.

      - Modelled on `credential_guard` dispatch, wired in `hook_manager.on_pre_tool_use`, with a kill switch env var.

      - Done when tests show a whole read refused, an in-range read allowed, the master allowed, and a Bash `cat` of the media
      file refused, and when one live engineer session is refused on a whole read.

      '
