    task: Planners start in plan mode and leave it without a pane prompt
    task_text: 'Plan: issue 839 in agentihooks, read it first. Seams: plan lane agents launch Claude in plan permission mode,
      and Codex with the closest equivalent found in the Codex question tool task; first prove live that a PreToolUse allow
      on the exit plan mode tool for a swarm planner leaves plan mode with no pane prompt; approval stays the ledger plan
      review. Done: a live planner on a scratch swarm starts in plan mode and leaves it with no prompt; PR merged.'
    pull_request_title: Keep a named permission mode at launch and grant the planner plan exit on PermissionRequest
    pull_request_body: 'Follow-up to #904 for phase D1 of #839. The live check after #904 merged showed a swarm planner never
      started in plan mode.


      - `agentihooks claude` prepended `--dangerously-skip-permissions`, which overrides `--permission-mode plan` (pane: "You
      are not in plan mode"). A named `--permission-mode` now gets `--allow-dangerously-skip-permissions` instead (`_claude_command`).

      - With that, the session starts in plan mode (status line "plan mode on" before any tool call), but leaving it lands
      in manual mode. The grant moves from PreToolUse to PermissionRequest: allow, `updatedInput` = the plan, `updatedPermissions`
      setMode `bypassPermissions` for the session. PreToolUse no longer allows the planner''s ExitPlanMode, since a PreToolUse
      allow skips PermissionRequest.


      Live proof (Claude Code 2.1.292, scratch hook with the same envelope): "Allowed by PermissionRequest hook", no proceed
      prompt, status line back to "bypass permissions on".


      Tests: `tests/test_install.py` (named mode keeps plan, bare launch keeps bypass, routed planner launch) and `tests/context/test_planner_plan.py`
      (PermissionRequest envelope, PreToolUse silent, engineer and other tools untouched). Local: 1683 related tests green,
      ruff check and format green.


      Refs #839


      🤖 Generated with [Claude Code](https://claude.com/claude-code)


      <!-- agentihooks intent -->

      ## Parent intent


      **Project:** Borrow what OpenRig does that we lack, while keeping the ledger, quota routing and herdr: durable Claude
      and Codex messaging, seats, intent, work beyond code, swarm health.


