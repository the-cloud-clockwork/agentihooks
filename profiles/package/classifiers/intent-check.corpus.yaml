    task: 'Read docs skill: any agent answers what does this mean from the agentihooks docs site'
    task_text: 'Operator request, tied to his note on keeping the docs site current. Critical so any operator understands
      what he operates. Build a read docs skill shipped in the agentihooks package, loaded by the master and every role, and
      available in any project. When the operator asks in the ledger chat, a pane or any session what something means or how
      the swarm behaves, such as a gate, a ledger section, a setting or a swarm control, the agent finds the matching page
      of the agentihooks docs site, published on the GitHub Pages site the-cloud-clockwork.github.io agentihooks from the
      repo docs folder, reads only the section that answers, and replies in plain words naming the page. If the docs lack
      the answer, it says so and proposes a follow up to add it, never invents. Deterministic first: a script maps a question
      to candidate pages through the docs index and headings, and the agent judges only the answer. Seams: the script returns
      the right page for a gate name, a ledger section and a swarm setting; the skill passes the skill gate. Done when merged
      with tests on the script and one live answer recorded on the task. The docs content itself is the final docs task, which
      must cover every ledger section, setting, gate and control.'
    pull_request_title: Add shared explanations from published AgentiHooks docs
    pull_request_body: 'Operator questions about AgentiHooks now use a shared `read-docs` skill installed for every role.
      The lookup ranks published GitHub Pages sections by question terms, returns only the selected section, and makes missing
      documentation an explicit gap with a proposed follow up. Site failures are reported separately.


      Seams cover gate names, ledger sections, swarm settings, generic swarm questions, section isolation, unavailable sources
      and global role installation. Documentation expansion remains the final docs task.


      Validation at `00aff8e`:


      - `python -m pytest tests/test_read_docs_skill.py -q`: 40 passed, including Claude and Codex rendering for all five
      swarm roles and an unrelated profile outside the repository.

      - Full `ruff check .` and `ruff format --check .` passed; explicit size and complexity lint passed.

      - `python -m scripts.ci_mutation --base origin/dev`: one changed Python file, 212 killed mutants, zero survivors, zero
      clearances and zero failures.

      - Built wheel contains the skill, evaluations, global rule, launcher and lookup module. The wheel launcher returned
      the published Branch guard candidate from an unrelated directory.

      - Live lookup read **Pillar 2: Guardrails / Guardrail 3: Branch guard**. An independent fresh reader answered from that
      section and returned a documentation gap with a follow up for an unknown setting. Both answers are recorded on the task.

      - Standards and Spec reviews closed with no open findings.


      Closes #969


