      first. Seams: plan lane agents launch Claude in plan permission mode, and Codex with the closest equivalent found in
      the Codex question tool task; first prove live that a PreToolUse allow on the exit plan mode tool for a swarm planner
      leaves plan mode with no pane prompt; approval stays the ledger plan review. Done: a live planner on a scratch swarm
      starts in plan mode and leaves it with no prompt; PR merged.

      <!-- /agentihooks intent -->'
