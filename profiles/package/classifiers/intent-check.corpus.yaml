  state:
    overview: 'Borrow what OpenRig does that we lack, while keeping the ledger, quota routing and herdr: durable Claude and
      Codex messaging, seats, intent, work beyond code, swarm health.'
    phase: Engineers never sit idle behind a dependency
    phase_intent: 'Operator decision, locked. The swarm has fourteen hours of work and most of it waits on dependencies while
      engineer slots stay empty. Rule: a dependency does not stop work. An engineer may claim a task whose dependency is still
      open: it cuts its branch from the dependency''s branch, opens or reuses the issue, builds what it can, points the branch
      and issue at each other, pushes, and records a handoff on the ledger naming the blocker. When the blocker merges, the
      tick hands the task to the next engineer, who rebases onto dev and finishes it. Territory overlap and broad territories
      must not serialize the swarm either. Scaling follows: with open tasks available, the tick fills every engineer slot
      up to the cap. A planner slices this phase; done when a scratch swarm with a dependency chain runs all its engineer
      slots and the chained tasks finish after their blockers merge.'
    task: Restack a parked task onto dev once its blocker merges
    task_text: 'Seam: a new swarm restack command, run by the finishing engineer in its worktree cut from the parked branch.
      It fetches, rebases the work onto origin dev from the stacked base, clears parked on, and on a conflict stops listing
      the conflicted files so the engineer resolves them. Done when tests over a scratch git repository show a clean restack
      after the blocker was squash merged, a conflict report, and the pull request is merged.'
