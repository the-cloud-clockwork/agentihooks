    groups:
    - - id: t278
        title: A health finding lists the writes or events behind its count, marking which the task or doctrine required
        description: 'Parent: swarm runtime fixes; the master must judge a finding from its evidence, not from a number. Cause:
          a ceremony finding shows only eleven talk writes since its last outcome and the threshold of ten; it never lists
          the writes. Error seen on the ninth of October: the master gave both ceremony findings on engineers 0824 and 0827
          insufficient evidence because it could not see that 0824''s writes were thirteen comments its task required and
          0827''s were progress lines around seven pushes the hook missed; only the Doctor''s reading of Redis records found
          that, issue 2194. Possible fix: each finding stores the rows it counted, with time, kind, target and a short text,
          plus the agent''s last recorded outcome; swarm status and the ledger page Swarm health panel print them under the
          finding, and each row is marked required when it answers a task contract, a spec line or a doctrine progress rule.
          Red first: a ceremony finding prints its counted rows. Done when status shows the rows for every detector kind and
          the pull request merges with CI green.'
        difficulty: M
        territory:
        - scripts/swarm
        - tests/swarm
      - id: t283
        title: 'Finish the Doctor''s open talk budget fix: outcomes counted on every harness, counting starts at the first
          outcome'
        description: 'Parent: swarm runtime fixes. The Doctor crew closed on the ninth of October with its fix for issue 2194
          still a draft pull request, number 2195, on branch engineer d44a5a 0220, checks green except one still running.
          It covers the Doctor''s part of the split: the push pattern accepts a push on its own line and a push wrapped in
          bash with the login flag, Codex sessions reach the outcome recorder, and counting starts at the first outcome so
          required writes before it do not count. Seams already in that branch; this task restacks it onto dev, reads its
          review state, finishes any open finding, marks it ready, merges it and closes issue 2194. Done when pull request
          2195 merges with CI green and the issue is closed.'
        difficulty: M
