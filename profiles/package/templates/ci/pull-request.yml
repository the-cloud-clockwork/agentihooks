name: Pull request

on:
  pull_request:
    branches: [dev]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Delivery required
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      DELIVERY_TIER: pull_request
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Run delivery checks
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          import yaml
          commands = yaml.safe_load(Path('delivery.yaml').read_text())[os.environ['DELIVERY_TIER']]
          for command in commands:
              subprocess.run(['bash', '-euo', 'pipefail', '-c', command], check=True)
          PY
