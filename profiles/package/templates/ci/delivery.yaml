pull_request:
  - ./ci/lint
  - ./ci/format-check
  - ./ci/size
  - ./ci/static-analysis
  - ./ci/changed-line-ratchets
  - ./ci/touched-tests
queue:
  - ./ci/unit
promotion:
  - ./ci/module-ratchets
  - ./ci/build-images
  - ./ci/smoke
  - ./ci/load
  - ./ci/budget-report
promote:
  - ./ci/promote "$GITHUB_SHA"
lab:
  authoritative: []
  mutation:
    run_on: every_push
    mutants_per_changed_line: all
    arid: []
  check_prefix: lab
