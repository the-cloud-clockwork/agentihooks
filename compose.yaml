services:
  swarm:
    image: ghcr.io/the-cloud-clockwork/agentihooks-swarm:dev
    build: .
    ports:
      - "127.0.0.1:${SWARM_PORT:-8765}:8765"
    environment:
      LEDGER_HOST: 0.0.0.0
      LEDGER_PORT: "8765"
      LEDGER_DIR: /data
      SWARM_AUTH_MODE: local
      SWARM_RELOAD: "0"
      SWARM_PUBLIC_URL: "http://127.0.0.1:${SWARM_PORT:-8765}"
      AGENTIHOOKS_SWARM_REDIS_URL: redis://redis:6379/0
    volumes:
      - swarm-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  swarm-data:
  redis-data:
