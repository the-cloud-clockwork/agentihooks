x-swarm-env: &swarm-env
  AGENTIHOOKS_DEPLOYMENT: ${SWARM_DEPLOYMENT:-compose}
  AGENTIHOOKS_SWARM_DATABASE_URL: ${AGENTIHOOKS_SWARM_DATABASE_URL:-}
  AGENTIHOOKS_BUS: ${SWARM_BUS:-nats}
  AGENTIHOOKS_BUS_URL: ${SWARM_BUS_URL:-nats://nats:4222}
  AGENTIHOOKS_SCHEDULER_STATE_BACKEND: ${SWARM_SCHEDULER_STATE_BACKEND:-bus}
  AGENTIHOOKS_SWARM_REDIS_URL: ${AGENTIHOOKS_SWARM_REDIS_URL:-${SWARM_REDIS_SCHEME:-redis}://swarm:${SWARM_REDIS_PASSWORD:?set SWARM_REDIS_PASSWORD, see deploy/compose/.env.example}@redis:6379/0}
  SSL_CERT_FILE: ${SWARM_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}

services:
  swarm:
    image: ghcr.io/the-cloud-clockwork/agentihooks-swarm:${SWARM_IMAGE_TAG:-dev}
    build: .
    environment:
      <<: *swarm-env
      AGENTIHOOKS_DEPLOYMENT: local
      LEDGER_HOST: 0.0.0.0
      LEDGER_PORT: "8765"
      LEDGER_DIR: /data
      SWARM_RELOAD: "0"
      SWARM_ALLOWED_HOSTS: swarm:8765,${SWARM_ALLOWED_HOSTS:-}
      SWARM_PUBLIC_URL: ${SWARM_PUBLIC_URL:-http://127.0.0.1:${SWARM_PORT:-8765}}
    volumes:
      - swarm-data:/data
      - ${SWARM_TLS_DIR:-./deploy/compose/tls}:/tls:ro
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
  api:
    image: ghcr.io/the-cloud-clockwork/agentihooks-swarm:${SWARM_IMAGE_TAG:-dev}
    build: .
    command: [python, -m, scripts.swarm_ledger.api_service, --serve]
    environment:
      <<: *swarm-env
      AGENTIHOOKS_DEPLOYMENT: local
      LEDGER_API_HOST: 0.0.0.0
      LEDGER_API_PORT: "8766"
      LEDGER_DIR: /data
      SWARM_ALLOWED_HOSTS: api:8766,${SWARM_ALLOWED_HOSTS:-}
      SWARM_PUBLIC_URL: ${SWARM_PUBLIC_URL:-http://127.0.0.1:${SWARM_PORT:-8765}}
    volumes:
      - swarm-data:/data
      - ${SWARM_TLS_DIR:-./deploy/compose/tls}:/tls:ro
    healthcheck:
      test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['LEDGER_API_PORT'] + '/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
  front:
    image: mirror.gcr.io/library/nginx:1.27-alpine
    ports:
      - "${SWARM_BIND:-127.0.0.1}:${SWARM_PORT:-8765}:8765"
    environment:
      SWARM_LEDGER_SCHEME: ${SWARM_LEDGER_SCHEME:-http}
    volumes:
      - ./deploy/compose/ledger-front.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: [CMD, wget, -q, -O-, "http://127.0.0.1:8765/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      swarm:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
  controller:
    image: ghcr.io/the-cloud-clockwork/agentihooks-swarm:${SWARM_IMAGE_TAG:-dev}
    command:
      - sh
      - -c
      - >-
        agentihooks hive controller >/dev/null
        && . "$${AGENTIHOOKS_HOME:-$$HOME/.agentihooks}/controller/credential.env"
        && export AGENTIHOOKS_CONTROLLER_CREDENTIAL
        && exec agentihooks controller run
    environment:
      <<: *swarm-env
      AGENTIHOOKS_SWARM_REDIS_URL: ${SWARM_REDIS_SCHEME:-redis}://swarm:${SWARM_REDIS_PASSWORD:?set SWARM_REDIS_PASSWORD, see deploy/compose/.env.example}@redis:6379/0
      LEDGER_URL: http://swarm:8765
      SWARM_HIVE_ID: ${SWARM_HIVE_ID:-compose-controller}
      LEDGER_DIR: /data
    volumes:
      - ${SWARM_TLS_DIR:-./deploy/compose/tls}:/tls:ro
      - swarm-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from scripts.swarm import lease; from scripts.swarm.store import connect;
          store = connect(); stale = [slug for slug in store.slugs() if not lease.current(store, slug)];
          assert not stale, f"no live controller lease for {stale}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 70s
      start_interval: 1s
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      swarm:
        condition: service_healthy
    restart: unless-stopped
  hive:
    image: ghcr.io/the-cloud-clockwork/agentihooks-swarm:${SWARM_IMAGE_TAG:-dev}
    profiles: [join]
    command:
      - agentihooks
      - hive
      - serve
      - --host=0.0.0.0
      - --redis-url=${SWARM_MEMBER_REDIS_URL:-${SWARM_REDIS_SCHEME:-redis}://redis:6379/0}
      - --tls-cert=/tls/cert.pem
      - --tls-key=/tls/key.pem
    ports:
      - "${SWARM_BIND:-127.0.0.1}:${SWARM_HIVE_PORT:-8770}:8770"
    environment:
      <<: *swarm-env
      AGENTIHOOKS_SWARM_REDIS_URL: ${SWARM_REDIS_SCHEME:-redis}://swarm:${SWARM_REDIS_PASSWORD:?set SWARM_REDIS_PASSWORD, see deploy/compose/.env.example}@redis:6379/0
    volumes:
      - ${SWARM_TLS_DIR:-./deploy/compose/tls}:/tls:ro
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 8770), 2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: mirror.gcr.io/library/redis:7
    command: [bash, /compose/start.sh]
    ports:
      - "${SWARM_BIND:-127.0.0.1}:${SWARM_REDIS_PORT:-6379}:6379"
    environment:
      SWARM_REDIS_PASSWORD: ${SWARM_REDIS_PASSWORD:?set SWARM_REDIS_PASSWORD, see deploy/compose/.env.example}
      SWARM_REDIS_SCHEME: ${SWARM_REDIS_SCHEME:-redis}
    volumes:
      - redis-data:/data
      - ./deploy/compose/redis:/compose:ro
      - ${SWARM_TLS_DIR:-./deploy/compose/tls}:/tls:ro
    tmpfs:
      - /run/swarm-tls
    healthcheck:
      test: [CMD, bash, /compose/healthcheck.sh]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
  nats:
    image: mirror.gcr.io/library/nats:2.15.1-alpine
    command: [--jetstream, --store_dir=/data, --http_port=8222]
    volumes:
      - nats-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O-, "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped
volumes:
  swarm-data:
  redis-data:
  nats-data:
