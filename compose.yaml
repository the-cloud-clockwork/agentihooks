x-swarm-env: &swarm-env
  AGENTIHOOKS_DEPLOYMENT: ${AGENTIHOOKS_DEPLOYMENT:-compose}
  AGENTIHOOKS_SWARM_REDIS_URL: ${SWARM_REDIS_SCHEME:-redis}://swarm:${SWARM_REDIS_PASSWORD:?set SWARM_REDIS_PASSWORD, see deploy/compose/.env.example}@redis:6379/0
  SSL_CERT_FILE: ${SWARM_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}

services:
  swarm:
    image: ghcr.io/the-cloud-clockwork/agentihooks-swarm:dev
    build: .
    ports:
      - "${SWARM_BIND:-127.0.0.1}:${SWARM_PORT:-8765}:8765"
    environment:
      <<: *swarm-env
      AGENTIHOOKS_DEPLOYMENT: local
      LEDGER_HOST: 0.0.0.0
      LEDGER_PORT: "8765"
      LEDGER_DIR: /data
      SWARM_RELOAD: "0"
      SWARM_PUBLIC_URL: ${SWARM_PUBLIC_URL:-http://127.0.0.1:${SWARM_PORT:-8765}}
    volumes:
      - swarm-data:/data
      - ${SWARM_TLS_DIR:-./deploy/compose/tls}:/tls:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  controller:
    image: ghcr.io/the-cloud-clockwork/agentihooks-swarm:dev
    command: [agentihooks, controller, run]
    environment:
      <<: *swarm-env
      LEDGER_URL: http://swarm:8765
      SWARM_HIVE_ID: ${SWARM_HIVE_ID:-compose-controller}
    volumes:
      - ${SWARM_TLS_DIR:-./deploy/compose/tls}:/tls:ro
    healthcheck:
      test: [CMD, python, -c, "from scripts.swarm.store import connect; connect()"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      swarm:
        condition: service_healthy
    restart: unless-stopped
  hive:
    image: ghcr.io/the-cloud-clockwork/agentihooks-swarm:dev
    profiles: [join]
    command:
      - agentihooks
      - hive
      - serve
      - --host=0.0.0.0
      - --redis-url=${SWARM_MEMBER_REDIS_URL:-redis://redis:6379/0}
      - --tls-cert=/tls/cert.pem
      - --tls-key=/tls/key.pem
    ports:
      - "${SWARM_BIND:-127.0.0.1}:${SWARM_HIVE_PORT:-8770}:8770"
    environment:
      <<: *swarm-env
    volumes:
      - ${SWARM_TLS_DIR:-./deploy/compose/tls}:/tls:ro
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7
    command: [bash, /compose/start.sh]
    ports:
      - "${SWARM_BIND:-127.0.0.1}:${SWARM_REDIS_PORT:-6379}:6379"
    environment:
      SWARM_REDIS_PASSWORD: ${SWARM_REDIS_PASSWORD:?set SWARM_REDIS_PASSWORD, see deploy/compose/.env.example}
      SWARM_REDIS_SCHEME: ${SWARM_REDIS_SCHEME:-redis}
    volumes:
      - redis-data:/data
      - ./deploy/compose/redis:/compose:ro
      - ${SWARM_TLS_DIR:-./deploy/compose/tls}:/tls:ro
    healthcheck:
      test: [CMD, bash, /compose/healthcheck.sh]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  swarm-data:
  redis-data:
