sonar.projectKey=agentihooks
sonar.projectName=AgentiHooks
sonar.projectVersion=1.1
sonar.sources=.
sonar.exclusions=tests/**,.venv/**,__pycache__/**,*.egg-info/**,build/**,dist/**,logs/**,**/*.env,.agenticore_tool_memory.ndjson,profiles/**/.claude/**,profiles/**/.mcp.json
sonar.tests=tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=lcov.info
sonar.sourceEncoding=UTF-8
sonar.text.activate=true
sonar.text.inclusions.activate=true
sonar.text.inclusions=**/*
sonar.scanner.excludeHiddenFiles=false
