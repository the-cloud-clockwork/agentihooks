rules:
  - id: ledger-server-reads-only
    languages: [python]
    severity: ERROR
    message: >-
      The ledger server only reads: it serves the ledger page and its reads. Every ledger write is a route of the
      ledger API service, which writes the shared database, so the ledger server defines no POST, PUT, PATCH or
      DELETE handler.
    paths:
      include:
        - /scripts/swarm_ledger/ledger_server.py
        - "*.test.py"
    patterns:
      - pattern-either:
          - pattern: |
              def $METHOD(...):
                  ...
          - pattern: $METHOD = $VALUE
          - pattern: "$METHOD: $TYPE = $VALUE"
          - pattern: $OWNER.$METHOD = $VALUE
          - pattern: setattr($OWNER, "$METHOD", $VALUE)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^do_(POST|PUT|PATCH|DELETE)$
  - id: ledger-client-in-process
    languages: [python]
    severity: ERROR
    message: >-
      A ResourceClient without a transport sends its operations over HTTP to the ledger server, the old write path.
      Give it the in process transport, which runs the ledger API route code over the shared database.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: ResourceClient(...)
              - pattern: $MODULE.ResourceClient(...)
          - pattern-not: $CLIENT(..., transport=$TRANSPORT, ...)
          - pattern-not: $CLIENT($BASE, $CREDENTIALS, $TIMEOUT, $TRANSPORT, ...)
      - pattern: ResourceClient(..., transport=None, ...)
      - pattern: $MODULE.ResourceClient(..., transport=None, ...)
      - pattern: ResourceClient($BASE, $CREDENTIALS, $TIMEOUT, None, ...)
      - pattern: $MODULE.ResourceClient($BASE, $CREDENTIALS, $TIMEOUT, None, ...)
