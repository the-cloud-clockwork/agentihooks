rules:
  - id: tick-unbounded-store-read
    languages: [python]
    severity: ERROR
    message: >-
      Per pass tick code never reads a whole Redis hash or scans the whole key space: hgetall, hscan_iter, and hscan,
      scan, scan_iter or keys without a count page grow with every row nothing removes, and the tick pass slows with
      them. Read the fields the pass needs, page the scan with count, or call the archive or expiry that bounds the
      store in the same function. A file still doing so stays listed in tick-unbounded-read-allowlist.json with the
      task that removes it.
    patterns:
      - pattern-either:
          - pattern: $STORE.hgetall(...)
          - pattern: $STORE.hscan_iter(...)
          - patterns:
              - pattern-either:
                  - pattern: $STORE.hscan($KEY, ...)
                  - pattern: $STORE.scan($CURSOR, ...)
                  - pattern: $STORE.scan_iter(...)
                  - pattern: $STORE.keys($MATCH, ...)
              - pattern-not: $STORE.$READ(..., count=$PAGE, ...)
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    def $FUNCTION(...):
                      ...
                      $OWNER.$BOUND(...)
                      ...
                - pattern: |
                    def $FUNCTION(...):
                      ...
                      $BOUND(...)
                      ...
            - metavariable-regex:
                metavariable: $BOUND
                regex: (?i)^(p?expire(at)?|\w*archive\w*)$
    paths:
      include:
        - "/scripts/swarm/**"
        - "/scripts/tick/**"
        - "*.test.py"
      exclude:
        - "/scripts/swarm/blockers.py"
        - "/scripts/swarm/bottleneck_remedy.py"
        - "/scripts/swarm/commands.py"
        - "/scripts/swarm/context_view.py"
        - "/scripts/swarm/dev_red.py"
        - "/scripts/swarm/dispatch_seat.py"
        - "/scripts/swarm/drain_watch.py"
        - "/scripts/swarm/failed_panes.py"
        - "/scripts/swarm/fencing.py"
        - "/scripts/swarm/health/standing.py"
        - "/scripts/swarm/health/verdicts.py"
