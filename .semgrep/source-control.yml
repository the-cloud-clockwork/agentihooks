rules:
  - id: swarm-source-control-port
    languages: [python]
    severity: ERROR
    message: >-
      Swarm code reaches source control through the source control port, never a direct gh command. The GitHub
      adapter alone runs gh; a file still calling it stays listed in source-control-allowlist.json until it moves.
    pattern: '["gh", ...]'
    paths:
      include:
        - "/scripts/swarm/**"
        - "*.test.py"
      exclude:
        - "/scripts/tick/adapters/github.py"
