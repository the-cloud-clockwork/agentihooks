# Excluded paths beside /scripts/scheduler/ hold a timed job or reconnect loop listed in the inventory; remove an entry when its job moves onto the scheduler.
rules:
  - id: machine-timer-unit
    message: A systemd timer unit schedules work outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [regex]
    pattern-regex: '(?:^|["'']|\\n)\[Timer\]|\bOn(Calendar|BootSec|StartupSec|ActiveSec|UnitActiveSec|UnitInactiveSec)='
    paths:
      include: ["*.py", "*.sh", "*.bash", "*.timer", "*.service", "*.unit", "*.conf", "*.ini", "Dockerfile*", "*.cron", "crontab"]
      exclude: [/scripts/scheduler/, /hooks/lifecycle/timer.py, /scripts/swarm/timer.py, /scripts/swarm_v2/herdr/operator_setup.py]

  - id: machine-cron-entry
    message: A crontab, at, launchd or Task Scheduler entry schedules work outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [regex]
    pattern-regex: '\bcrontab\b|/etc/cron\.|/var/spool/cron|\bsystemd-run\b[^\n]*--on-|\bStart(Calendar)?Interval\b|\bschtasks\b|\b(at|batch) (now|midnight|noon|teatime|\d{1,2}:\d{2})\b|\[\s*"at"\s*,'
    paths:
      include: ["*.py", "*.sh", "*.bash", "*.timer", "*.service", "*.unit", "*.conf", "*.ini", "Dockerfile*", "*.cron", "crontab"]
      exclude: [/scripts/scheduler/]

  - id: periodic-sleep-loop
    message: An endless loop that sleeps runs a timed job outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              while True:
                  ...
          - pattern-inside: |
              while 1:
                  ...
          - pattern-inside: |
              while not $E.is_set():
                  ...
          - pattern-inside: |
              while self.$FLAG:
                  ...
          - pattern-inside: |
              for $X in itertools.count(...):
                  ...
          - pattern-inside: |
              for $X in count(...):
                  ...
      - pattern-either:
          - patterns:
              - pattern: $SLEEP($ARG, ...)
              - metavariable-regex:
                  metavariable: $SLEEP
                  regex: (.*\.)?sleep$
          - patterns:
              - pattern: $EVENT.wait($ARG, ...)
              - pattern-not-inside: $RESULT = $EVENT.wait(...)
      - pattern-not-inside: |
          try:
              ...
          except $E:
              ...
              $SLEEP(...)
              ...
      - pattern-not-inside: |
          try:
              ...
          except $E:
              ...
              await $SLEEP(...)
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... time.monotonic() ...>
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... time.time() ...>
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... clock() ...>
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... deadline ...>
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... $OBJ.deadline ...>
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... $OBJ.expires_at ...>
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... attempt ...>
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... attempts ...>
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... ATTEMPTS ...>
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... retries ...>
              ...
      - pattern-not-inside: |
          while $C:
              ...
              <... RETRIES ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... time.monotonic() ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... time.time() ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... clock() ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... deadline ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... $OBJ.deadline ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... $OBJ.expires_at ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... attempt ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... attempts ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... ATTEMPTS ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... retries ...>
              ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              <... RETRIES ...>
              ...
    paths:
      exclude: [/scripts/scheduler/, /hooks/serena_router/app.py, /scripts/hive/daemon.py, /scripts/swarm_ledger/ledger_server.py, /scripts/swarm_ledger/watch_ledger.py, /scripts/swarm/controller.py, /scripts/swarm/lease.py, /scripts/swarm_v2/herdr/operator_setup.py]

  - id: periodic-wait-loop
    message: A loop that waits on an event with a timeout runs a timed job outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [python]
    pattern: |
      while not $E.wait($T):
          ...
    paths:
      exclude: [/scripts/scheduler/, /scripts/swarm/cli.py]

  - id: periodic-shell-sleep-loop
    message: An endless shell loop that sleeps runs a timed job outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [regex]
    pattern-regex: '\bwhile\s+sleep\b[^\n]*;\s*do\b|\b(?:while\s+(?:true|:)|until\s+false)\s*;?\s*do\b(?:(?!\b(?:done|exit|break|return)\b)[\s\S])*\bsleep\b(?:(?!\b(?:done|exit|break|return)\b)[\s\S])*\bdone\b'
    paths:
      include: ["*.sh", "*.bash", "Dockerfile*"]
      exclude: [/scripts/scheduler/]
