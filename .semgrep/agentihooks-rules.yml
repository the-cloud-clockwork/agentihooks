# Excluded paths beside /scripts/scheduler/ hold a timed job awaiting its move onto the scheduler, or a daemon loop paced by its own reconnect or event wait.
rules:
  - id: machine-timer-unit
    message: A systemd timer unit schedules work outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [regex]
    pattern-regex: '(?:^|["'']|\\n)\[Timer\]|\bOn(Calendar|BootSec|StartupSec|ActiveSec|UnitActiveSec|UnitInactiveSec)='
    paths:
      include: ["*.py", "*.sh", "*.bash", "*.timer", "*.service", "*.unit", "*.conf", "*.ini", "Dockerfile*", "*.cron", "crontab"]
      exclude: [/scripts/scheduler/, /hooks/lifecycle/timer.py, /scripts/swarm/timer.py]

  - id: machine-cron-entry
    message: A crontab, at, launchd or Task Scheduler entry schedules work outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [regex]
    pattern-regex: '\bcrontab\b|/etc/cron\.|/var/spool/cron|\bsystemd-run\b[^\n]*--on-|\bStart(Calendar)?Interval\b|\bschtasks\b|(?:^|[;&|(]\s*)(?:at|batch)\s+(?:now|midnight|noon|teatime|tomorrow|\d{1,2}(?::\d{2})?\s*(?:am|pm)?)(?=[\s\"'']|$)|\[\s*"at"\s*,'
    paths:
      include: ["*.py", "*.sh", "*.bash", "*.timer", "*.service", "*.unit", "*.conf", "*.ini", "Dockerfile*", "*.cron", "crontab"]
      exclude: [/scripts/scheduler/]

  - id: periodic-sleep-loop
    message: An endless loop that sleeps runs a timed job outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              while True:
                  ...
          - pattern-inside: |
              while 1:
                  ...
          - pattern-inside: |
              while not $E.is_set():
                  ...
          - pattern-inside: |
              while self.$FLAG:
                  ...
          - pattern-inside: |
              for $X in itertools.count(...):
                  ...
          - pattern-inside: |
              for $X in count(...):
                  ...
      - pattern-either:
          - patterns:
              - pattern: $SLEEP($ARG, ...)
              - metavariable-regex:
                  metavariable: $SLEEP
                  regex: (.*\.)?(sleep|wait)$
          - pattern: $EVENT.wait(..., timeout=$ARG, ...)
      - pattern-not: scripts.scheduler.process_timer.wait(...)
      - pattern-not-inside: |
          try:
              ...
          except $E:
              ...
              $SLEEP($ARG, ...)
              ...
      - pattern-not-inside: |
          try:
              ...
          except $E:
              ...
              await $SLEEP($ARG, ...)
              ...
      - pattern-not-inside: |
          while $C:
              ...
              if <... time.monotonic() ...>:
                  ...
                  return ...
              ...
      - pattern-not-inside: |
          while $C:
              ...
              if <... time.monotonic() ...>:
                  ...
                  raise ...
              ...
