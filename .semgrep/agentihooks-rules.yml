# Files excluded beside /scripts/scheduler/ predate these rules; moving a job onto the scheduler deletes its entry.
rules:
  - id: machine-timer-unit
    message: A systemd timer unit schedules work outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [regex]
    pattern-regex: '(?:^|["'']|\\n)\[Timer\]|\bOn(Calendar|BootSec|StartupSec|ActiveSec|UnitActiveSec|UnitInactiveSec)='
    paths:
      include: ["*.py", "*.sh", "*.bash", "*.timer", "*.service", "Dockerfile*", "*.cron", "crontab"]
      exclude: [/scripts/scheduler/, /hooks/lifecycle/timer.py, /scripts/swarm/timer.py, /scripts/swarm_v2/herdr/operator_setup.py]

  - id: machine-cron-entry
    message: A crontab, at, launchd or Task Scheduler entry schedules work outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [regex]
    pattern-regex: '\bcrontab\b|/etc/cron\.|/var/spool/cron|\bsystemd-run\b[^\n]*--on-|\bStart(Calendar)?Interval\b|\bschtasks\b|\b(at|batch) now\b|\[\s*"at"\s*,'
    paths:
      include: ["*.py", "*.sh", "*.bash", "*.timer", "*.service", "Dockerfile*", "*.cron", "crontab"]
      exclude: [/scripts/scheduler/]

  - id: periodic-sleep-loop
    message: An endless loop that sleeps runs a timed job outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              while True:
                  ...
          - pattern-inside: |
              while 1:
                  ...
          - pattern-inside: |
              for $X in itertools.count(...):
                  ...
          - pattern-inside: |
              for $X in count(...):
                  ...
      - pattern: $SLEEP(...)
      - metavariable-regex:
          metavariable: $SLEEP
          regex: (.*\.)?sleep$
      - pattern-not-inside: |
          try:
              ...
          except $E:
              ...
              $SLEEP(...)
              ...
      - pattern-not-inside: |
          try:
              ...
          except $E:
              ...
              await $SLEEP(...)
              ...
      - pattern-not-inside: |
          while $C:
              ...
              return ...
      - pattern-not-inside: |
          while $C:
              ...
              break
      - pattern-not-inside: |
          while $C:
              ...
              raise ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              return ...
      - pattern-not-inside: |
          for $X in $I:
              ...
              break
      - pattern-not-inside: |
          for $X in $I:
              ...
              raise ...
    paths:
      exclude: [/scripts/scheduler/, /hooks/serena_router/app.py, /scripts/hive/daemon.py, /scripts/swarm_ledger/ledger_server.py, /scripts/swarm_ledger/watch_ledger.py]

  - id: periodic-wait-loop
    message: A loop that waits on an event with a timeout runs a timed job outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: |
          while not $E.wait($T):
              ...
      - pattern: |
          while not $E.is_set():
              ...
              $E.wait($T)
              ...
    paths:
      exclude: [/scripts/scheduler/, /scripts/swarm/cli.py]

  - id: periodic-shell-sleep-loop
    message: An endless shell loop that sleeps runs a timed job outside the agentihooks scheduler. Register the job with scripts.scheduler instead.
    severity: ERROR
    languages: [regex]
    pattern-regex: '\bwhile\s+(true|:)\s*;?\s*do\b(?:(?!\b(?:done|exit|break|return)\b)[\s\S])*\bsleep\b(?:(?!\b(?:done|exit|break|return)\b)[\s\S])*\bdone\b'
    paths:
      include: ["*.sh", "*.bash", "Dockerfile*"]
      exclude: [/scripts/scheduler/]
