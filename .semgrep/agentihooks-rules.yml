    severity: ERROR
    languages: [regex]
    pattern-regex: '\bwhile\s+sleep\b[^\n]*;\s*do\b|\b(?:while\s+(?:true|:|\[\[?\s*1\s*\]\]?)|until\s+false)\s*;?\s*do\b(?:(?!\bdone\b)[\s\S])*\bsleep\b(?:(?!\bdone\b)[\s\S])*\bdone\b'
    paths:
      include: ["*.sh", "*.bash", "Dockerfile*"]
