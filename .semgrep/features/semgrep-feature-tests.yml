rules:
  - id: feature-semgrep-feature-tests
    languages: [yaml]
    severity: ERROR
    message: >-
      Semgrep feature tests, ordered 2026-10-25: the local rules workflow must
      run semgrep --metrics off --test .semgrep/features so feature regressions
      and rules that stop matching fail CI.
    patterns:
      - pattern: |
          ...
          jobs:
            ...
            scan:
              ...
              with:
                ...
                rules_dir: .semgrep
                ...
              ...
            ...
          ...
      - pattern-not: |
          ...
          jobs:
            ...
            feature-tests:
              ...
              steps:
                ...
                - run: semgrep --metrics off --test .semgrep/features
                  ...
                ...
              ...
            ...
          ...
