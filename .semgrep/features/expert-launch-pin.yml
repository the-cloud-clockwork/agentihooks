rules:
  - id: feature-expert-launch-pin
    languages: [python]
    severity: ERROR
    message: >-
      Ordered 2026-11-22, an expert always launches on Claude Code with the Fable model at effort xhigh or max: the
      runtime's spawn and resume must hold their pick through expert_launch.hold before they build the launch model
      arguments.
    patterns:
      - pattern-inside: |
          def $LAUNCH(...):
            ...
      - metavariable-regex:
          metavariable: $LAUNCH
          regex: ^(spawn|resume)$
      - pattern: _model_args(...)
      - pattern-not-inside: |
          def $LAUNCH(...):
            ...
            $PICKED = expert_launch.hold(...)
            ...
    paths:
      include:
        - /scripts/swarm/runtime.py
        - '*.test.py'
