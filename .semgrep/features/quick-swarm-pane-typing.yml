rules:
  - id: feature-quick-swarm-pane-typing
    languages: [python]
    severity: ERROR
    message: >-
      Found by the 2026-11-12 quick swarm stress test: a Codex seat whose agent exited left a bare bash prompt that herdr
      still reported idle, and the room notice typed into it ran as a shell command. The quick swarm types into a pane
      only through tick.LiveHerdr.prompt, and tick._busy refuses a pane at a bare shell before it reads the agent status.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  def _busy(...):
                    ...
              - pattern-not: |
                  def _busy($SEAT, $HERDR):
                    if $HERDR.bare($SEAT.pane_id):
                      return ...
                    ...
          - patterns:
              - pattern-either:
                  - pattern: herdr_host.prompt(...)
                  - pattern: herdr_host.run(...)
              - pattern-not-inside: |
                  class LiveHerdr:
                    ...
    paths:
      include:
        - /scripts/quick/
        - '*.test.py'
