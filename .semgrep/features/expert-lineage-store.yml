rules:
  - id: feature-expert-lineage-store
    languages: [python]
    severity: ERROR
    message: >-
      Ordered 2026-11-22, an expert lineage works one saved mission and only code moves its state: the lineage
      records and the saved missions are read and written through scripts/swarm/expert_lineage.py alone, so no
      other module names their store keys.
    pattern-either:
      - pattern: '"expert-lineages"'
      - pattern: '"expert-missions"'
      - pattern: expert_lineage.LINEAGES
      - pattern: expert_lineage.MISSIONS
    paths:
      include:
        - /scripts/
        - /hooks/
        - '*.test.py'
      exclude:
        - /scripts/swarm/expert_lineage.py
