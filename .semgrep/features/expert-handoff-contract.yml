rules:
  - id: feature-expert-handoff-contract
    languages: [python]
    severity: ERROR
    message: >-
      Ordered 2026-11-22, an expert hands its seat off with its own handoff: the mission, what is done and pending,
      the assumptions, the tests and the validation. The handoff command and the context limit gate judge a document
      through scripts/handoff/contracts.py, which holds an expert to that contract. The handoff command never calls
      the Handoff v2 check on its own, and the context limit hook calls it only for a session it has just found is no
      expert or for a quick swarm member, which is never an expert.
    pattern-either:
      - patterns:
          - pattern-inside: |
              def cmd_handoff(...):
                ...
          - pattern: handoff_check.problems(...)
      - patterns:
          - pattern: handoff_check.problems(...)
          - pattern-not: handoff_check.problems($TEXT, Resolver(args.slug, ...))
          - pattern-not: handoff_check.problems($TEXT, quick_handoff.resolver(...))
          - pattern-not-inside: |
              if not _expert(...):
                ...
      - patterns:
          - pattern: |
              if not _expert(...):
                ...
              else:
                ...
                $STEP
                ...
          - metavariable-pattern:
              metavariable: $STEP
              pattern: handoff_check.problems(...)
          - focus-metavariable: $STEP
    paths:
      include:
        - /scripts/swarm/cli.py
        - /hooks/context/context_recycle.py
        - '*.test.py'
