rules:
  - id: feature-ledger-api-writes
    languages: [python]
    severity: ERROR
    message: >-
      Ordered 2026-11-16, every swarm ledger write goes through the ledger API to the database and the ledger server
      write path is gone: the database ledger client sends every request through the ledger API route code over
      the shared database, on this host's warm writer first and in process otherwise, and a hosted hub, whose
      admission claims write the ledger in process, refuses to start without the shared database setting.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  def client(base: str, timeout: float) -> ResourceClient:
                    ...
              - pattern-not: |
                  def client(base: str, timeout: float) -> ResourceClient:
                    ...
                    return ResourceClient(base, {}, timeout, transport=partial(routed, timeout))
          - patterns:
              - pattern: |
                  def main(argv: list[str]) -> int:
                    ...
              - pattern-not: |
                  def main(argv: list[str]) -> int:
                    ...
                    if $LINK.remote() and not storage.shared():
                      ...
                      return 2
                    ...
    paths:
      include:
        - /scripts/tick/adapters/database_ledger.py
        - /scripts/hub/runner.py
        - '*.test.py'
