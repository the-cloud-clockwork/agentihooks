rules:
  - id: feature-tick-database-ledger
    languages: [python]
    severity: ERROR
    message: >-
      Ordered 2026-11-07 and 2026-11-16, the tick and every swarm client read and write the shared database through
      the ledger API route code run in process and never through the ledger server: the tick route runs its pass
      inside database_ledger.acting(""), the swarm's own service, the tick ledger port builds its client with
      ledger.client and builds no ResourceClient of its own, and ledger.client returns the in process database
      client or the writer client, this host's warm writer first, with no other path.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  def routed(store, slug, *args, **kwargs):
                    ...
              - pattern-not: |
                  def routed(store, slug, *args, **kwargs):
                    ...
                    with database_ledger.acting(""):
                      ...
          - patterns:
              - pattern: |
                  def build(remaining: float) -> ResourceClient:
                    ...
              - pattern-not: |
                  def build(remaining: float) -> ResourceClient:
                    ...
                    $BUILT: ResourceClient = ledger.client(...)
                    return $BUILT
          - patterns:
              - pattern-inside: |
                  def build(remaining: float) -> ResourceClient:
                    ...
              - pattern: ResourceClient(...)
          - patterns:
              - pattern: |
                  def client(...):
                    ...
              - pattern-not: |
                  def client(...):
                    "..."
                    from scripts.tick.adapters import database_ledger

                    return database_ledger.client(...)
              - pattern-not: |
                  def client(...):
                    "..."
                    from scripts.tick.adapters import writer_client

                    return writer_client.client(...)
    paths:
      include:
        - /scripts/swarm_ledger/ledger_route.py
        - /scripts/swarm_ledger/ledger.py
        - /scripts/tick/adapters/ledger.py
        - '*.test.py'
