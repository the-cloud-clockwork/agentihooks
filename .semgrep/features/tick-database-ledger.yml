rules:
  - id: feature-tick-database-ledger
    languages: [python]
    severity: ERROR
    message: >-
      Ordered 2026-11-07, the tick reads and writes the shared database instead of the ledger server: the tick route
      runs its pass inside database_ledger.scoped() or as the swarm's own service through database_ledger.acting(""),
      the tick ledger port builds the database client while database_ledger.serving() or through ledger.client and
      builds no ResourceClient of its own outside that branch, and ledger.client returns the database client.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  def routed(store, slug, *args, **kwargs):
                    ...
              - pattern-not: |
                  def routed(store, slug, *args, **kwargs):
                    ...
                    with $ROUTE, database_ledger.scoped():
                      ...
              - pattern-not: |
                  def routed(store, slug, *args, **kwargs):
                    ...
                    with database_ledger.acting(""):
                      ...
          - patterns:
              - pattern: |
                  def build(remaining: float) -> ResourceClient:
                    ...
              - pattern-not: |
                  def build(remaining: float) -> ResourceClient:
                    ...
                    if database_ledger.serving():
                      return database_ledger.client(...)
                    ...
              - pattern-not: |
                  def build(remaining: float) -> ResourceClient:
                    ...
                    $BUILT: ResourceClient = ledger.client(...)
                    return $BUILT
          - patterns:
              - pattern-inside: |
                  def build(remaining: float) -> ResourceClient:
                    ...
              - pattern: ResourceClient(...)
              - pattern-not-inside: |
                  if database_ledger.serving():
                    return database_ledger.client(...)
                  ...
                  return ResourceClient(...)
          - patterns:
              - pattern: |
                  def client(...):
                    ...
              - pattern-not: |
                  def client(...):
                    ...
                    if database_ledger.serving():
                      return database_ledger.client(...)
                    ...
              - pattern-not: |
                  def client(...):
                    ...
                    return database_ledger.client(...)
    paths:
      include:
        - /scripts/swarm_ledger/ledger_route.py
        - /scripts/swarm_ledger/ledger.py
        - /scripts/tick/adapters/ledger.py
        - '*.test.py'
